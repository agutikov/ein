# EinAf — iterative autoformalization, an application of Ein.
#
# One package, a library and the `einaf` command, standing outside the
# engine's workspace: its own `[workspace]` table below makes it the root of
# a workspace of one, so `cargo test --workspace` in `ein.rs/` never sees it
# and nothing of the engine names it. It links the engine's crates by path,
# as `docs/ein/ein.rs/04-api.md` § 1 says a program outside the checkout does.
#
# Its documentation is `docs/einaf/`.

[package]
name        = "einaf"
description = "Iterative autoformalization over Ein: a program's outcome, read off the kernel's values"
version     = "0.1.0"
edition     = "2024"
license     = "MIT"
publish     = false

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "einaf"
path = "src/main.rs"

[dependencies]
ein-core   = { path = "../ein.rs/crates/ein-core" }
ein-ir     = { path = "../ein.rs/crates/ein-ir" }
ein-infer  = { path = "../ein.rs/crates/ein-infer" }
ein-render = { path = "../ein.rs/crates/ein-render" }
# The feedback object as JSON, `einaf-feedback/1`, written and read back
# (`einaf::kernel::Feedback`), at the versions the engine's lock file has.
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# A program's and a state's digests, SHA-256, as `ein --version` takes the
# library's manifest's.
sha2       = "0.10"
# The model's chat template, which its file carries as a Jinja text, rendered
# in EinAf (`einaf::model::template`): llama.cpp's own C renderer knows no
# Jinja, and the binding wraps nothing else. `pycompat` gives the template
# the Python string methods it calls (`startswith`, `split`, `rstrip`);
# `preserve_order` keeps a declared function's keys in the order written.
minijinja         = { version = "2", default-features = false, features = ["builtins", "macros", "multi_template", "loop_controls", "adjacent_loop_items", "preserve_order", "serde"] }
minijinja-contrib = { version = "2", default-features = false, features = ["pycompat"] }
# The binding to llama.cpp, behind the features below and nothing else: it
# builds a llama.cpp of its own (CMake, a C++ compiler, and with `cuda` the
# CUDA toolkit), which the gate's build of EinAf never does.
llama-cpp-2 = { version = "=0.1.161", optional = true, default-features = false, features = ["common"] }
# The grammars (`einaf::grammar`): Ein's two grammar files read through
# grmtools' public readers, as Ein's grammar page is written from them, at the
# versions `ein-ir` builds against, and `regex-syntax`, which reads a lexer
# rule's regular expression as a tree. All three are already in the lock
# file, through `ein-ir`.
cfgrammar    = "=0.15.0"
lrlex        = "=0.15.0"
regex-syntax = "0.8"

[features]
# **The model's runtime**, off by default (`docs/einaf/05-model.md`): with
# `llama` the binding runs the model in EinAf's process, on the CPU; with
# `cuda`, on the GPU. Without either, EinAf builds and tests with no
# llama.cpp and no model, replaying recorded generations.
default = []
llama   = ["dep:llama-cpp-2"]
cuda    = ["llama", "llama-cpp-2/cuda"]

[dev-dependencies]
# The corpus manifest, its worker pool and the repository's root, as the
# engine's own sweeps read them. A test helper of the engine's
# (`publish = false`), whose two dependencies, `serde` and `toml`, are what
# reading `corpus/corpus.toml` would take anyway.
ein-corpus = { path = "../ein.rs/crates/ein-corpus", default-features = false }

# The parser runtime the engine builds against: `ein-ir`'s generated parser
# calls into `lrpar`, and the engine's workspace patches it with the copy
# under `ein.rs/vendor/lrpar/` (deterministic error recovery, bounded by a
# count of steps). A `[patch]` applies only in the root manifest of the
# workspace being built, so this one names the same copy; without it the
# published `lrpar` would be linked and a parse error's repairs could differ
# from the engine's.
[patch.crates-io]
lrpar = { path = "../ein.rs/vendor/lrpar" }

# The engine's test profile, copied: release codegen with `debug_assert!`
# and overflow checks on, so the engine's own assertions run under EinAf's
# tests as they do under the engine's. Profiles are read from the root
# manifest only, so the engine's `[profile.gate]` does not reach here.
[profile.gate]
inherits         = "release"
debug-assertions = true
overflow-checks  = true
