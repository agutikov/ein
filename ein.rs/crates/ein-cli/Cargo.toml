[package]
name        = "ein-cli"
description = "The `ein` binary — render / saturate / solve / test"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[features]
# `--no-default-features` is the escape hatch, and it drops all three: no
# vendored C++ allocator, no container, no work-stealing pool. What it costs
# is the allocator's share of a run.
default  = ["snmalloc", "einb", "parallel"]
# The global allocator.
snmalloc = ["dep:snmalloc-rs"]
# `.einb` read and write (docs/ein/ein.rs/design/toolchain-and-layout.md § 4).
# Off, `ein kb` is not registered
# and a `.einb` argument is refused by the loader that would have opened it,
# which is what a build with no container in it should say.
einb     = ["dep:ein-einb"]
# The route workers' fan-out, forwarded so the *binary* can drop `rayon`:
# `ein-infer` and `ein-render` are taken without their defaults below, or the
# dependency-light build would link a pool it had no flag to reach. Off,
# `--jobs N` parses and is inert, which `ein --version` says by not listing
# `parallel`.
parallel = ["ein-infer/parallel", "ein-render/parallel"]

[dependencies]
ein-core   = { path = "../ein-core" }
ein-ir     = { path = "../ein-ir" }
ein-infer  = { path = "../ein-infer", default-features = false }
ein-render = { path = "../ein-render", default-features = false }
ein-einb   = { path = "../ein-einb", optional = true }
clap.workspace = true
snmalloc-rs = { workspace = true, optional = true }
# `--version`'s stdlib line. On the *binary*, not on `ein-ir`,
# which keeps the digest out of the engine crates' dependency budget for the
# same reason the allocator is here: this is the program, not the library.
sha2.workspace = true

# The one `unsafe` call outside `ein-einb`'s `cast.rs`: `main.rs` restores
# SIGPIPE's default disposition before the program does anything, so a closed
# stdout ends `ein` as it ends `cat` (Q-M1f.68). Unix only:
# Windows has no SIGPIPE, and a write to a closed pipe there is an error.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lib]
name = "ein_cli"
path = "src/lib.rs"

[[bin]]
name = "ein"
path = "src/main.rs"

[dev-dependencies]
ein-corpus = { path = "../ein-corpus" }
serde_json.workspace = true
# `tests/regressions.rs` holds its bless to a file that still parses.
toml.workspace = true
