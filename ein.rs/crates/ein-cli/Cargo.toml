[package]
name        = "ein-cli"
description = "The `ein` binary — render / saturate / solve"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[features]
# Forwarded so `cargo build --features fork-delta` on the binary means the
# same as on the engine — S1a.6.9 T1a.6.9.2.
fork-delta = ["ein-infer/fork-delta"]

[dependencies]
ein-core   = { path = "../ein-core" }
ein-ir     = { path = "../ein-ir" }
ein-infer  = { path = "../ein-infer" }
ein-render = { path = "../ein-render" }
clap.workspace = true

[lib]
name = "ein_cli"
path = "src/lib.rs"

[[bin]]
name = "ein"
path = "src/main.rs"

[dev-dependencies]
ein-oracle = { path = "../ein-oracle" }
serde_json.workspace = true
