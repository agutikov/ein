[package]
name        = "ein-ir"
description = "Parser, AST, dumper, macros, imports, embedded stdlib"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
ein-core    = { path = "../ein-core" }
# The interner's index. Its keys are strings the *source file* chose, so the
# adversarial-input resistance `RandomState` buys is not worth 7 % of a parse
# (T1a.6.5.2), and a per-process random seed is a determinism hazard the
# workspace already refuses everywhere else — design/02 §9.
rustc-hash.workspace = true
# The stdlib, embedded so the binary ships self-contained (design/11 §3).
include_dir.workspace = true
# grmtools (M1f S1f.5.5, the user's ruling of 2026-11-07): the grammar is
# `src/ein.l` and `src/ein.y`, and `build.rs` generates the parser from them,
# so a conflict in the grammar fails the build. `lrpar` is the vendored, patched
# copy (`[patch.crates-io]` in the workspace manifest, F11). Exact versions: the
# patch is against 0.15.0, and the generated code calls into all three.
cfgrammar = "=0.15.0"
lrlex     = "=0.15.0"
lrpar     = "=0.15.0"

[build-dependencies]
lrlex = "=0.15.0"
lrpar = "=0.15.0"

# No `[features]`: T1f.5.5.3's `generated-parser` hook went at the swap
# (T1f.5.5.4), when the generated parser became the only one.

[dev-dependencies]
# Verifying the embedded copy against `stdlib/MANIFEST.sha256`, in a test —
# the digest is not needed at runtime.
sha2.workspace = true
# The corpus, the goldens and `repo_root()`. A dev-dependency only: the
# engine's own dependency budget is unaffected.
ein-corpus = { path = "../ein-corpus" }
serde_json.workspace = true
