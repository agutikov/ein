[package]
name        = "ein-ir"
description = "Parser, AST, dumper, macros, imports, embedded stdlib"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
ein-core    = { path = "../ein-core" }
# The interner's index. Its keys are strings the *source file* chose, so the
# adversarial-input resistance `RandomState` buys is not worth its cost on every
# parse, and a per-process random seed is a determinism hazard the workspace
# refuses everywhere else (docs/ein/ein.rs/03-design/01-determinism-and-order.md § 2.3).
rustc-hash.workspace = true
# The stdlib, embedded so the binary ships self-contained
# (docs/ein/ein.rs/03-design/02-shared-assets.md § 3).
include_dir.workspace = true
# grmtools (Q-M1e2.25): the grammar is `src/ein.l` and `src/ein.y`, and
# `build.rs` generates the parser from them, so a conflict in the grammar fails
# the build. `lrpar` is the vendored, patched copy (`[patch.crates-io]` in the
# workspace manifest). Exact versions: the patch is against 0.15.0, and the
# generated code calls into all three.
cfgrammar = "=0.15.0"
lrlex     = "=0.15.0"
lrpar     = "=0.15.0"

[build-dependencies]
lrlex = "=0.15.0"
lrpar = "=0.15.0"

# No `[features]`: the generated parser is the only one.

[dev-dependencies]
# Verifying the embedded copy against `stdlib/MANIFEST.sha256`, in a test —
# the digest is not needed at runtime.
sha2.workspace = true
# The corpus, the goldens and `repo_root()`. A dev-dependency only: the
# engine's own dependency budget is unaffected.
ein-corpus = { path = "../ein-corpus" }
serde_json.workspace = true
# `fuzz_properties`' `no_firing_meets_an_unbound_variable` compiles the plans of
# what the loader accepts (Q-M1f.40). A dev-dependency only, as
# `ein-infer` takes `ein-render`: no shipped crate gains an edge.
ein-infer = { path = "../ein-infer", default-features = false }
# `grammar_pages` writes the reference's lexical grammar as EBNF: it reads each
# rule of `ein.l` through the parser the lexer's `regex` reads it with, and
# translates the syntax tree. A dev-dependency only, and no new package:
# `lrlex` already brings it through `regex`.
regex-syntax = "0.8"
