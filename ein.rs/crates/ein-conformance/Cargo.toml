[package]
name        = "ein-conformance"
description = "Parity harness: runs two ein implementations over the shared corpus and diffs them"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
serde.workspace      = true
serde_json.workspace = true
toml.workspace       = true

[dev-dependencies]
criterion.workspace = true
# The benches measure the engine; the *binary* still links neither
# implementation (it shells out to both). A dev-dependency keeps that true.
ein-ir = { path = "../ein-ir" }

[[bin]]
name = "ein-conformance"
path = "src/main.rs"

[[bench]]
name    = "engine"
harness = false
