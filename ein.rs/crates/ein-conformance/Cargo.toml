[package]
name        = "ein-conformance"
description = "Parity harness: runs two ein implementations over the shared corpus and diffs them"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[features]
# The bench set runs under the binary's allocator by default (T1a.6.2.7).
# `cargo bench -p ein-conformance --no-default-features` is the other arm of
# that measurement — the same benches on the system allocator — and it is how
# the allocator's share of each bench stays a number rather than a claim.
default  = ["snmalloc"]
snmalloc = []

[dependencies]
# The parity contract's normalisation list, executable — so the harness and
# the crates' own parity tests apply the *same* rule and cannot drift apart.
ein-parity = { path = "../ein-parity" }
serde.workspace      = true
serde_json.workspace = true
toml.workspace       = true

[dev-dependencies]
criterion.workspace = true
# The bench runs under the *binary's* allocator (T1a.6.2.7); a bench set that
# measures a different program from the one that ships is measuring nothing.
snmalloc-rs.workspace = true
# The benches measure the engine; the *binary* still links neither
# implementation (it shells out to both). A dev-dependency keeps that true.
ein-ir = { path = "../ein-ir" }
ein-core = { path = "../ein-core" }
ein-infer = { path = "../ein-infer" }

[[bin]]
name = "ein-conformance"
path = "src/main.rs"

[[bench]]
name    = "engine"
harness = false
