[package]
name        = "ein-infer"
description = "Compile, match, saturate, world, search, verdict, explain"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[features]
default = ["parallel"]
# P1a.7 — the fan-out. `explore::Options::jobs` is inert without it and every
# node runs on the calling thread, which is a dependency-light build's
# escape rather than a mode anybody chooses.
parallel = ["dep:rayon"]
# Forwards to `ein-core/counters`, so `--features counters` on either crate
# means the same build.
counters = ["ein-core/counters"]
# `fork-delta` (S1a.6.9, the resumed fork saturator's verification) and
# `spec-audit` (S1a.7.0, the speculation audit) instrumented the walk's
# fork and its parallel layers. They went with the walk at M1e2 S1e2.1c.5
# (2026-11-03), with their drivers `utils/fork_delta_verify.py` and
# `utils/spec_audit.py`: no route speculates, and the routes' fork is
# held to the oracle node for node (`tests/region.rs`).

[dependencies]
ein-core = { path = "../ein-core" }
ein-ir   = { path = "../ein-ir" }
rustc-hash.workspace = true
rayon = { workspace = true, optional = true }

[dev-dependencies]
ein-corpus = { path = "../ein-corpus" }
# A dev-only cycle (`ein-render` depends on `ein-infer`), which Cargo allows.
# It is here for one claim: `LatticeDumper`'s contract — what a dump tree does
# and does not contain — is a claim about the *lattice*, and the formatter that
# implements `solve::Dumper` lives in `ein-render`. Asserting it from the
# renderer's side would test the writer; asserting it here tests the search's
# use of the hook. See `tests/lattice_semantics.rs`.
ein-render = { path = "../ein-render" }
# The one implementation of what counts as a derivation's narration rather
# than its content — a fork's derivation, and anything keyed on a dying fork's
# stopping point — shared by every test that has to know.
ein-narration = { path = "../ein-narration" }
serde_json.workspace = true
