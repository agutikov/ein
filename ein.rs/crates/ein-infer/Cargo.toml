[package]
name        = "ein-infer"
description = "Compile, match, saturate, world, search, verdict, explain"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[features]
default = ["parallel"]
# The fan-out. `explore::Options::jobs` is inert without it and every
# node runs on the calling thread, which is a dependency-light build's
# escape rather than a mode anybody chooses.
parallel = ["dep:rayon"]
# Forwards to `ein-core/counters`, so `--features counters` on either crate
# means the same build.
counters = ["ein-core/counters"]
# No feature instruments the fork: no route speculates, and the routes' fork
# is held to the oracle node for node (`tests/region.rs`).

[dependencies]
ein-core = { path = "../ein-core" }
ein-ir   = { path = "../ein-ir" }
rustc-hash.workspace = true
rayon = { workspace = true, optional = true }

[dev-dependencies]
ein-corpus = { path = "../ein-corpus" }
# A dev-only cycle (`ein-render` depends on `ein-infer`), which Cargo allows.
# It is here for one claim: the structure of the hypothesis set is the
# program's, and `ein_render::structure` is the view that shows it, read from
# the same reading by the one call the view makes
# (`tests/structure_invariance.rs`); `examples/pair_layer.rs` writes the same.
ein-render = { path = "../ein-render" }
# The one implementation of what counts as a derivation's narration rather
# than its content — a fork's derivation, and anything keyed on a dying fork's
# stopping point — shared by every test that has to know.
ein-narration = { path = "../ein-narration" }
serde_json.workspace = true
