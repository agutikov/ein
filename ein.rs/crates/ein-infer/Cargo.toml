[package]
name        = "ein-infer"
description = "Compile, match, saturate, world, search, verdict, explain"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[features]
# Forwards to `ein-core/counters`, so `--features counters` on either crate
# means the same build.
counters = ["ein-core/counters"]
# S1a.6.9 T1a.6.9.2 — the *resumed* fork saturator, and the per-entering audit
# record that verifies it. **Off by default and not a shipping path**: the
# change it makes is observable (it drops the redundant re-derivations T2
# narrates), so it exists to produce the evidence Q-M1a.18 is decided against.
# Even in a `fork-delta` build the resumed path is off until `EIN_FORK_DELTA=1`,
# so one binary produces both arms of the diff and nothing else differs
# between them.
fork-delta = []

[dependencies]
ein-core = { path = "../ein-core" }
ein-ir   = { path = "../ein-ir" }
rustc-hash.workspace = true

[dev-dependencies]
ein-oracle = { path = "../ein-oracle" }
serde_json.workspace = true
