[package]
name        = "ein-infer"
description = "Compile, match, saturate, world, search, verdict, explain"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[features]
default = ["parallel"]
# P1a.7 — the fan-out. `SolveOptions::jobs` is inert without it and every
# layer runs on the committing thread, which is a dependency-light build's
# escape rather than a mode anybody chooses.
parallel = ["dep:rayon"]
# Forwards to `ein-core/counters`, so `--features counters` on either crate
# means the same build.
counters = ["ein-core/counters"]
# S1a.6.9 — a fixture, not a feature of the engine. A fork *resumes* root's
# saturation rather than re-deriving it, so two runs can narrate different
# amounts of one derivation; the resumed fork saturator is the *shipping* path
# since Q-M1a.18 was answered, and what this compiles in is the way back to
# the re-deriving one (`EIN_FORK_DELTA=0`) plus the per-entering audit record,
# so `utils/fork_delta_verify.py` can produce both arms out of one binary and
# prove the difference has not widened.
fork-delta = []
# S1a.7.0 — the speculation audit. Runs every entering a second time
# against root as of layer start, which is what a P1a.7 worker would have
# forked, and reports where the two disagree. Off by default because it
# doubles the enterings; inert even when compiled in unless
# `$EIN_SPEC_AUDIT` names a file.
spec-audit = []

[dependencies]
ein-core = { path = "../ein-core" }
ein-ir   = { path = "../ein-ir" }
rustc-hash.workspace = true
rayon = { workspace = true, optional = true }

[dev-dependencies]
ein-corpus = { path = "../ein-corpus" }
# A dev-only cycle (`ein-render` depends on `ein-infer`), which Cargo allows.
# It is here for one claim: `LatticeDumper`'s contract — what a dump tree does
# and does not contain — is a claim about the *lattice*, and the formatter that
# implements `solve::Dumper` lives in `ein-render`. Asserting it from the
# renderer's side would test the writer; asserting it here tests the search's
# use of the hook. See `tests/lattice_semantics.rs`.
ein-render = { path = "../ein-render" }
# The one implementation of what counts as a derivation's narration rather
# than its content — a fork's derivation, and anything keyed on a dying fork's
# stopping point — shared by every test that has to know.
ein-narration = { path = "../ein-narration" }
serde_json.workspace = true
