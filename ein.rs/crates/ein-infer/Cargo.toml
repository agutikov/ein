[package]
name        = "ein-infer"
description = "Compile, match, saturate, world, search, verdict, explain"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[features]
# Forwards to `ein-core/counters`, so `--features counters` on either crate
# means the same build.
counters = ["ein-core/counters"]
# S1a.6.9 — D3's fixture, not a feature of the engine. The resumed fork
# saturator is the *shipping* path since Q-M1a.18 was answered; what this
# compiles in is the way back to the old one (`EIN_FORK_DELTA=0`) plus the
# per-entering audit record, so `utils/fork_delta_verify.py` can produce both
# arms of the divergence out of one binary and prove it has not widened.
fork-delta = []

[dependencies]
ein-core = { path = "../ein-core" }
ein-ir   = { path = "../ein-ir" }
rustc-hash.workspace = true

[dev-dependencies]
ein-oracle = { path = "../ein-oracle" }
# The one implementation of "what the parity contract stopped comparing",
# shared with `ein-conformance` so a test and the gate cannot disagree.
ein-parity = { path = "../ein-parity" }
serde_json.workspace = true
