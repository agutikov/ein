# ein.rs — the Rust port of the ein engine (M1a).
#
# The engine crates are in place and empty: P1a.0 builds only the parity
# harness (`ein-conformance`, which shells out to both implementations and
# links neither), and the rest fill in over P1a.1–P1a.5 in the order the
# tiers gate them. Having them compile from the start means a stage adds
# code rather than also adding a crate, and `cargo test` covers the shape of
# the workspace before there is anything in it.
#
# `ein-oracle` is dev-only (`publish = false`): it is `ein.py` and CPython kept
# warm behind a JSON-Lines protocol, so the differential tests every phase from
# P1a.1 onwards needs do not each re-implement the process plumbing. Nothing
# outside a `[dev-dependencies]` block depends on it.
#
# `ein-py` (P1a.9) is NOT here: PyO3/maturin is a heavy dependency whose cost
# the dependency policy says to defer until something needs it. (`ein-server`
# used to be named here for the same reason; the server was dropped outright
# on 2026-08-18 — the engine ships as a library plus this CLI.)
#
# Layout and the dependency policy:
# plans/m1a_rust/design/12_toolchain_and_layout.md.

[workspace]
resolver = "3"
members = [
    "crates/ein-core",
    "crates/ein-oracle",
    "crates/ein-parity",
    "crates/ein-ir",
    "crates/ein-infer",
    "crates/ein-render",
    "crates/ein-cli",
    "crates/ein-conformance",
]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
license    = "MIT"
repository = "https://github.com/gutikoff/ein"

[workspace.dependencies]
# Deterministic, fast, non-DoS-resistant hashing. The engine's maps are keyed
# by integers it assigned itself, so the adversarial-input resistance
# `RandomState` buys is worthless here — and its per-process randomisation is
# an active hazard, because a hash map that iterates in a run-dependent order
# is exactly the failure design/02 §9 forbids.
rustc-hash = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml        = { version = "0.9", default-features = false, features = ["parse", "serde"] }
include_dir = "0.7"
# `render.dot_util.hashed_id` is `md5(seed)[:10]` and the checked-in DOT
# goldens are its fixture (design/02 §8) — a node id, not a security claim.
md-5        = "0.10"
# `render.palette.hash_color` — the relation-colour index (design/02 §8).
sha1        = "0.10"
sha2        = "0.10"
criterion   = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# The global allocator, default-on for the binary and the bench (T1a.6.2.7).
# glibc `malloc` is 20.0 % of an exhaustive `zebra2`'s self time over 880 k
# allocations averaging ~71 bytes, and that profile — enormous counts, tiny
# sizes, extreme lifetime locality — is what the per-thread-cache allocators
# exist for. All three were measured; snmalloc won on wall clock *and* kept
# peak RSS, which mimalloc did not (+42 % on `zebra -e`), and it is the only
# one of the two fastest that also builds on MSVC (`tikv-jemallocator` is
# `cfg(not(target_env = "msvc"))` by its own README). `--no-default-features`
# on `ein-cli` puts the system allocator back for a distro build that would
# rather not have a vendored C++ one.
# plans/m1a_rust/p1a.6_performance/baseline.md § 13.
snmalloc-rs = "0.7"
# The CLI's argument parser. Q-M1a.13 (resolved 2026-08-18) put `--help`
# layout and usage-error text on the normalisation list, so this does not have
# to reproduce `argparse`'s formatter — only its *surface*: same options, same
# short keys, same defaults, same exclusions, same exit codes. `cli` only; the
# engine crates stay dependency-light.
clap        = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }

# Optimised even in dev: every conformance run spawns hundreds of engine
# processes, and the harness itself must never be the slow part.
[profile.dev]
opt-level = 1

# `cargo build --profile profiling` — release codegen plus the one thing a
# profiler needs and a shipped binary does not: line tables, so `perf` can put a
# name on an address. Frame pointers are deliberately *not* forced: `perf
# --call-graph fp` cannot unwind out of glibc, which has none, and S1a.6.1
# measured what that costs — 57 % of an exhaustive `zebra2`'s samples arrived
# with no caller. `utils/profile_ein_rs.py` uses LBR call stacks instead, which
# need neither frame pointers nor DWARF. `debug = 1` changes no codegen, and the
# script re-times `release` against this profile on every run so the claim that
# it changes no codegen stays a measurement.
[profile.profiling]
inherits = "release"
debug    = 1
strip    = false

# …but not for the vendored C++ allocator. `cmake`-rs picks `CMAKE_BUILD_TYPE`
# from the `DEBUG` and `OPT_LEVEL` cargo passes each build script, so
# `debug = 1` above quietly built snmalloc as `RelWithDebInfo` and the
# profiling binary ran **+49.6 %** slower than the release one — a profile of a
# different program, which is the one thing this profile exists not to be. The
# script's release-vs-profiling line is what caught it (T1a.6.2.7).
[profile.profiling.package.snmalloc-sys]
debug = false

# `cargo test` and the conformance harness run the dev profile, and an
# allocator compiled with its own assertions on is not the allocator anything
# ships. Same reason, same fix.
[profile.dev.package.snmalloc-sys]
debug     = false
opt-level = 3
