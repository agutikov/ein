# ein.rs — the ein engine.
#
# Six engine crates and two dev-only ones. The six stack linearly up to
# `ein-infer` and fork there: `ein-einb` and `ein-render` are siblings over it,
# and `ein-cli` depends on both. `ein-einb` is the one crate whose *boundary*
# is load-bearing — see its own manifest.
#
# The two dev-only crates (`publish = false`, and nothing outside a
# `[dev-dependencies]` block or a bench depends on either):
#
#   ein-corpus  the corpus manifest (`corpus/corpus.toml`), the fixture helpers
#               every crate's tests share, the worker pool the corpus sweeps
#               share, and the benchmark set.
#   ein-narration  what counts as a derivation's *narration* rather than its
#               content, executable. A fork *resumes* root's saturation rather
#               than re-deriving it, so two runs of one program can narrate
#               different amounts of one derivation — a firing count, a
#               rendered derivation, a dying fork's stopping point — while the
#               answer and the search stay exact.
#
# There is no server crate: the engine ships as libraries plus this CLI.
#
# Layout and the dependency policy:
# docs/ein/ein.rs/03-design/10-toolchain-and-layout.md.

[workspace]
resolver = "3"
members = [
    "crates/ein-core",
    "crates/ein-corpus",
    "crates/ein-narration",
    "crates/ein-ir",
    "crates/ein-infer",
    "crates/ein-einb",
    "crates/ein-render",
    "crates/ein-cli",
]
# The vendored `lrpar` below is a patched dependency, not a member: none of
# the gate's checks (fmt, clippy, rustdoc, the tests) is ours to run over a
# crate we did not write, and a path dependency inside the workspace's
# directory would otherwise join it.
exclude = ["vendor"]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
license    = "MIT"
# The remote, and what `cargo install` / crates.io metadata point at.
repository = "https://github.com/agutikov/ein"

[workspace.dependencies]
# Deterministic, fast, non-DoS-resistant hashing. The engine's maps are keyed
# by integers it assigned itself, so the adversarial-input resistance
# `RandomState` buys is worthless here — and its per-process randomisation is
# an active hazard, because a hash map that iterates in a run-dependent order
# is exactly the failure docs/ein/ein.rs/03-design/01-determinism-and-order.md
# § 2.3 forbids.
rustc-hash = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml        = { version = "0.9", default-features = false, features = ["parse", "serde"] }
include_dir = "0.7"
# `render.dot_util.hashed_id` is `md5(seed)[:10]` and the checked-in DOT
# goldens are its fixture (01-determinism-and-order.md § 8) — a node id, not a
# security claim.
md-5        = "0.10"
# `render.palette.hash_color` — the relation-colour index (the same § 8).
sha1        = "0.10"
sha2        = "0.10"
# The `.einb` header digest (docs/ein/ein.rs/03-design/09-binary-format.md § 2.1) —
# content addressing, so the question it answers is "are these the bytes that
# were written", which is what a fast tree hash is for. `ein-einb` only; the engine crates stay
# dependency-light, and the two digests already here are rendering fixtures
# rather than integrity checks (`md-5` is a DOT node id, `sha1` a colour index).
blake3      = { version = "1", default-features = false, features = ["std"] }
# The route workers' work-stealing pool, `ein-infer` only and behind its
# `parallel` feature (10-toolchain-and-layout.md § 4). What it buys over
# `std::thread::scope` is that the threads **stay alive between batches**:
# work runs in bounded batches so that the results in flight stay bounded,
# and spawning `jobs` threads for every batch would cost more than the
# parallelism returns.
rayon       = "1"
criterion   = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# The global allocator, default-on for the binary and the bench. The engine
# allocates in enormous counts and tiny sizes, with extreme lifetime locality,
# which is what the per-thread-cache allocators exist for; snmalloc also
# builds on MSVC (`tikv-jemallocator` is `cfg(not(target_env = "msvc"))` by
# its own README). `--no-default-features` on `ein-cli` puts the system
# allocator back for a distro build that would rather not have a vendored C++
# one.
snmalloc-rs = "0.7"
# The CLI's argument parser. `--help` layout and usage-error text are clap's;
# what is fixed is the *surface* — every option's name, short key, default,
# exclusions and help string, and every exit code
# (`docs/ein/user/04-reference/05-cli.md` § 5). `cli` only; the engine crates stay
# dependency-light.
clap        = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
# `signal(SIGPIPE, SIG_DFL)`, once, at the top of the binary's `main`
# (Q-M1f.68): Rust's runtime ignores SIGPIPE before `main`, so without it a
# write to a pipe whose reader has gone fails with EPIPE and every `print!`
# panics, exit 101. The disposition is process-wide, so it is the binary's
# choice, as the allocator is, and `ein-cli` on Unix only; no engine crate
# takes it. It is in every build already, through the parser's `lrpar` and
# its `filetime` (`cargo tree -i libc`); MIT OR Apache-2.0.
libc        = "0.2"

# grmtools' parser runtime, patched (Q-M1e2.25): the published `lrpar`
# 0.15.0's error recovery is not deterministic. It ranks equal repairs in a
# `HashSet`'s random order and stops at a 500 ms wall-clock budget, so one
# refused file could report different errors on two runs. The copy under
# `vendor/lrpar/` keeps the first of each duplicate in the order the search
# found it, sorts stably, and bounds recovery by a count of search steps over
# the whole parse (`RECOVERY_STEP_BUDGET`), with each error saying whether it
# was cut there. `vendor/lrpar/ein.patch` is the whole difference from the
# published crate, apart from the licence files the crate does not ship,
# which are grmtools' at the commit it was published from. Through
# `[patch.crates-io]`, so the parser `ein-ir`'s `build.rs` generates and any
# grammar loaded at run time both get it. The patch stays here; nothing but
# a change to `ein.patch` edits the copy.
[patch.crates-io]
lrpar = { path = "vendor/lrpar" }

# Optimised even in dev: `cargo test` spawns hundreds of engine processes —
# `ein-cli/tests/corpus_cli.rs` alone runs one for every declared run of every
# corpus entry — and a debug-speed engine would make the tests slow enough to
# skip.
[profile.dev]
opt-level = 1

# `cargo build --profile profiling` — release codegen plus the one thing a
# profiler needs and a shipped binary does not: line tables, so `perf` can put a
# name on an address. Frame pointers are deliberately *not* forced: `perf
# --call-graph fp` cannot unwind out of glibc, which has none, so most samples
# would arrive with no caller; LBR call stacks need neither frame pointers nor
# DWARF. `debug = 1` changes no codegen.
[profile.profiling]
inherits = "release"
debug    = 1
strip    = false

# …but not for the vendored C++ allocator. `cmake`-rs picks `CMAKE_BUILD_TYPE`
# from the `DEBUG` and `OPT_LEVEL` cargo passes each build script, so
# `debug = 1` above would build snmalloc as `RelWithDebInfo` and the
# profiling binary would run slower than the release one — a profile of a
# different program, which is the one thing this profile exists not to be.
[profile.profiling.package.snmalloc-sys]
debug = false

# `cargo test` runs the dev profile, and an allocator compiled with its own
# assertions on is not the allocator anything ships. Same reason, same fix.
[profile.dev.package.snmalloc-sys]
debug     = false
opt-level = 3

# **`cargo test --profile gate`, the profile the tests are built in**:
# release codegen with the two checks the dev profile buys and release drops,
# `debug_assert!` and `cfg(debug_assertions)` (`ein-infer/src/engine.rs` has a
# block of them) and integer overflow checks, so the tests run optimised and
# still check the engine's assertions. It builds into `ein.rs/target/gate/`;
# `cargo build` and `cargo test` without it build the dev profile.
[profile.gate]
inherits         = "release"
debug-assertions = true
overflow-checks  = true

# The allocator as release builds it, for the reason the two above give:
# `cmake`-rs reads `DEBUG` and `OPT_LEVEL`, which the profile already sets to
# release's, and the Rust half of the crate gets no assertions of its own.
[profile.gate.package.snmalloc-sys]
debug            = false
opt-level        = 3
debug-assertions = false
overflow-checks  = false
