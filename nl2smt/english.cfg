# english.cfg — the context-free grammar NLTK's chart parser is given.
#
# Phrase structure and parts of speech, and no meaning: which house a phrase
# names is nltk2smt.rkt's reading of the tree. The words are vocabulary.rktd's,
# each written here once more under its part of speech. A name of several
# words is one rule with several words, N -> 'Old' 'Gold'.
#
# NLTK reads this file as it is (nltk.CFG.fromstring): a rule a line, | between
# alternatives, a word in quotes, and a line that starts with # skipped.

# A sentence: a statement, how many of something there are, a question.
S -> NP VP
S -> Ex Be NP
S -> Wh VP

# A noun phrase. Its noun, and what says which one is meant: before it an
# adjective, a number or another noun, after it a preposition's phrase or a
# clause.
NP -> Det Nom | Nom
Nom -> N | Adj Nom | Num Nom | N Nom | Nom PP | Nom RC
RC -> Rel VP | RelAdv S

# A verb phrase: a verb alone or with its object, the passive, "is" with a
# place, and any of these with a place after it.
VP -> V | V NP | Be Part | Be PP | VP PP

# A preposition with its noun phrase, and an adverb before the two.
PP -> P NP | Adv PP

# The words of the sentence shapes.
Det -> 'the'
Ex -> 'there'
Be -> 'is' | 'are'
Wh -> 'who'
Rel -> 'who'
RelAdv -> 'where'
P -> 'in' | 'with' | 'to' | 'of' | 'next' 'to'
Adv -> 'immediately'
Num -> 'five' | 'four' | 'six'

# The puzzle's words.
Adj -> 'red' | 'green' | 'ivory' | 'yellow' | 'blue' | 'first' | 'middle'
V -> 'owns' | 'drinks' | 'smokes' | 'lives'
Part -> 'kept' | 'drunk' | 'smoked'
N -> 'house' | 'houses' | 'smoker' | 'man' | 'right'
N -> 'Englishman' | 'Spaniard' | 'Ukrainian' | 'Norwegian' | 'Japanese'
N -> 'dog' | 'snails' | 'fox' | 'horse' | 'zebra'
N -> 'coffee' | 'tea' | 'milk' | 'orange' 'juice' | 'water'
N -> 'Kools' | 'Chesterfields' | 'Old' 'Gold' | 'Lucky' 'Strike' | 'Parliaments'
