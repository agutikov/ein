# The parity corpus — M1a S1a.0.1 T1a.0.1.1.
#
# One entry per `.ein` file both implementations are compared on, with the runs
# it is exercised under. Format, the group vocabulary and the run-name
# convention: conformance/README.md. A file under examples/ or the stdlib with
# no entry here fails a completeness check in BOTH test suites, so the corpus
# cannot silently miss one.
#
# `slow = true` keeps an entry out of the per-commit tier. It is measured, not
# guessed: an entry is slow when any of its runs took 3s or more in the
# T1a.0.1.1 probe of the whole matrix (CPython 3.14, dev machine, 2026-08-17).
# The per-commit tier is then everything else — 78 of 95 entries.
#
# Generated once from the tree; maintained by hand from here.

schema = "ein-corpus/1"


# ── positive ────────────────────────────────────────────────

