# Tier 3 of three — plans/m1a_rust/design/12_toolchain_and_layout.md §4.
#
# Everything nightly, plus the checks that only matter when something is about
# to be handed to someone: does the parallel engine agree with the serial one,
# does the build work without its default features, and do the artefacts
# actually build on the platforms they claim.
#
# Most of this is inert until the phase that gives it something to check, and
# says so rather than being added later — a release checklist assembled at
# release time is a checklist nobody reviewed.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  jobs-cross-diff:
    name: --jobs {1,2,4,8} agree (P1a.7)
    runs-on: ubuntu-latest
    if: false   # enable with the `parallel` feature at P1a.7
    steps:
      - uses: actions/checkout@v4
      - run: echo "cross-diff the same corpus at four --jobs values"

  no-default-features:
    name: builds without default features
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ein.rs } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The `events` feature compiles the event emitter out entirely, so a
      # measurement build has no branch on the hot path at all. Both shapes
      # are built, because "off" is a configuration nobody exercises by
      # accident.
      - run: cargo build --workspace --no-default-features
      - run: cargo test --workspace --no-default-features

  packaging:
    name: binaries
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bin ein
        working-directory: ein.rs
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: ein.rs/target/release/ein*
          retention-days: 30
      # The **wheel** half of this job built ein.py's sdist/wheel, which
      # carried a build-time copy of the shared stdlib and was where a broken
      # copy surfaced. Both went at S1a.10.5. The wheel that replaces it is
      # P1a.9's PyO3 module, built by `maturin` over the same matrix
      # (S1a.9.3), and the stdlib copy it carries is `include_dir!`'s —
      # already checked against `stdlib/MANIFEST.sha256` by
      # `ein-ir`'s `the_embedded_copy_matches_the_manifest`, in the gate.
