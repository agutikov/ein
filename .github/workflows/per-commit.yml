# Tier 1 of three — docs/history/m1a_rust/design/12_toolchain_and_layout.md §4.
#
# Budget: five minutes.
#
# **`./run_tests.sh` runs every step of this tier**, in this order, since M1c
# S1c.1.5 — so a green local gate means a green CI. It had not, and that cost
# three red commits: clippy and the two Python greps ran only here, and the
# local script reported a pass over findings it could not see.
#
# **Since M1e S1e.3.4 a test diffs the two lists** rather than a convention
# asking for them to be kept the same — `ein-cli/tests/gate_steps.rs`, which
# reads this file and `run_tests.sh` and compares the commands after
# normalising away the path spellings. A `# gate-step` marker is what makes a
# `run:` here part of that list: the provisioning steps (checkout, toolchain,
# cache, Python, Graphviz) are not gate steps and are excluded by name in the
# test, so an *unmarked* new step fails it rather than being ignored.
#
# The `conformance-fast` job that used to close this file ran the parity
# harness over the corpus, Python against Rust, at T3. It was retired with the
# harness at M1a S1a.10.3: the corpus is still swept every commit, by
# `cargo test --workspace`, which runs `ein-cli/tests/corpus_cli.rs` — every
# entry under every declared run, as a process, against a banked exit golden —
# in about three seconds rather than eight minutes of two engines.

name: per-commit

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: per-commit-${{ github.ref }}
  cancel-in-progress: true

# The `oracle` job — `pip install -e 'ein.py[dev]'`, `./run_tests.sh --fast`,
# `ruff check ein.py` — went with its subject at S1a.10.5. It ran first and on
# its own, because a parity failure is meaningless if the oracle moved; there
# is no parity and no oracle, and `rust` below is the gate.

jobs:
  shared-assets:
    name: stdlib + corpus — no drift, no gaps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      # The stdlib is the one input whose divergence no parity tier can
      # diagnose: both engines would be *correct* about different programs.
      # gate-step
      - run: python3 utils/stdlib_manifest.py
      # No iteration over a hash map at an observable site (design/02 §9).
      # gate-step
      - run: python3 utils/check_hashmap_iteration.py

  rust:
    name: ein.rs — build, lint, test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ein.rs } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ein.rs }
      # ein.py was a *test* dependency of ein.rs from P1a.1 to S1a.10.2: the
      # frontend has no CLI surface for the conformance harness to drive, so 42
      # of the workspace's integration tests talked to `utils/ir_oracle.py`
      # instead, and without `pip install -e ein.py` they skipped — loudly, but
      # they skipped, and a silent gate is not a gate.
      #
      # S1a.10.2 un-differentialled all 42, so **the install is gone and its
      # absence is the check**: a test that reacquired an oracle would now fail
      # rather than skip. `python3` itself stays, for one thing —
      # `examples/gen_zebra2_variants.py --check`, a stdlib-only script that
      # `cli_semantics.rs` runs to compare the zebra2 variants byte for byte.
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      # `ein-render/tests/dot_wellformed.rs` runs every DOT view of every
      # corpus file through `dot -Tsvg`, which is the only authority they have
      # on being well-formed. It used to skip when Graphviz was absent — on a
      # stderr line `cargo test` captures for a passing test, so this job had
      # been reporting a pass for 5 209 renderings nothing checked. S1a.10.3
      # made it fail instead, and this line is the other half of that.
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      # gate-step
      - run: cargo fmt --all --check
      # gate-step
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # M1c S1c.1.5. Nothing had ever run rustdoc here, and its default for
      # every lint in the family is a *warning*, so twelve unresolved
      # intra-doc links and seven public-docs-to-private-item references had
      # accumulated invisibly. `--no-deps`: this workspace's docs are the
      # subject, a dependency's warnings are not ours.
      # gate-step
      - run: cargo doc --workspace --no-deps
        env: { RUSTDOCFLAGS: "-D warnings" }
      # The whole gate. Covers the corpus-completeness check, the corpus sweep
      # through the CLI, the embedded-stdlib digest, and since S1a.10.2 every
      # claim the frontend's differential tests carried.
      # gate-step
      - run: cargo test --workspace
      # gate-step
      - run: cargo bench --bench engine -- --test
