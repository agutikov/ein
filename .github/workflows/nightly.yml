# Tier 2 of three — docs/history/m1a_rust/design/12_toolchain_and_layout.md §4.
#
# Everything the per-commit tier cannot afford **that guards an answer or a
# contract no per-commit step guards**, each step at a budget that fits in
# 5 min on the runner: M1f S1f.5.27's rule, on the user's ruling of
# 2026-11-10, *"reduce nightly job, remove long running tests, we will
# eventually run them on dev host, retain critical tests in CI"*
# (plans/m1f_hypothesis_and_documentation/open_questions.md, Q-M1f.102). A step
# over 5 min on the runner, or one that measures rather than checks, runs on
# the dev host instead, `./run_tests.sh --dev-host`, which runs every step here
# at full budget and the steps that left: the id space permuted eight ways,
# `stdlib_census.py` and the whole review bundle. Nothing schedules the dev
# host; the user runs it. The jobs run side by side.
#
# **The shards** (M1f S1f.6.39, the user's ruling of 2026-11-15 on
# Q-M1f.293, *"split into parallel nightly jobs (shards), staying in CI"*). A
# step over five minutes at the runner's four threads runs as a matrix job,
# one shard a job, `EIN_TEST_SHARD=k/n` (`ein-corpus/src/shard.rs`): every
# program the step's sweeps read is dealt to exactly one shard, so the `n`
# jobs together check what the step checked. `deep-corpus-shards` holds the
# long slow halves and the full-corpus sweeps that left the per-commit tier
# (Q-M1f.289, .290: every corpus program's renderings held to the golden and
# permuted), `mutants` the sensitivity census. Each shard was measured on
# four P-core threads with four workers, the runner's count, as T6 measured
# the steps (the stage's record).
#
# **`./run_tests.sh --nightly` runs every step of this file**, since M1e2
# S1e2.3.6: the three jobs one after another, in this file's order, the fuzz
# job once per seed of its matrix. `ein-cli/tests/nightly_steps.rs` diffs the
# two lists, so a step added here and not there fails a test; since S1f.5.27
# it holds `--dev-host`'s list to this one's too, so a step that leaves here
# and is not named there fails it. Every `run:` here is a step of that list,
# or a provisioning step the test names with its reason (Graphviz, the tests'
# `TMPDIR`). Until S1e2.3.6 nothing local ran these steps, and this workflow
# failed on every run from 2026-10-17 to 11-03 without anybody here seeing it
# (plans/m1e2_correctness/p1e2.3_surfaces_that_misreport_the_answer/s1e2.3.6_the_nightly_workflow.md).

name: nightly

on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:

jobs:
  deep-corpus:
    name: ein.rs — the slow corpus entries, and the tests' slow halves
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ein.rs } }
    # M1e2 S1e2.3.6 — the tests' `TMPDIR`, a fresh directory under `build/`,
    # as in the per-commit tier since S1e2.3.5: the job's test steps run under
    # it, and `check_test_scratch.py` holds it empty after them. The slow cells
    # are tests the per-commit tier never runs, so this is the one CI job that
    # checks their scratch (`--dev-host` checks its own since M1f S1f.5.27).
    # `run_tests.sh --nightly` names its own
    # `build/gate-tmp-<pid>`; the steps that read it are spelt the same.
    env: { GATE_TMP: "${{ github.workspace }}/build/gate-tmp" }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ein.rs }
      # `libgvplugin-neato-layout8` is `fdp`'s layout: every KB view suggests `fdp`,
      # and Ubuntu 26.04's `graphviz` links `fdp` to `dot` without it, so the review
      # bundle's drawings of them were refused (M1f S1f.5.29, Q-M1f.78).
      - run: sudo apt-get update && sudo apt-get install -y graphviz libgvplugin-neato-layout8
      - run: mkdir -p "${GATE_TMP}"
      # M1f S1f.6.39 — the job's test binaries, built in a step of their own, so
      # that a test step's time on the runner is its tests' (Q-M1f.102's five
      # minutes a step) and the build's is read apart: `rust-cache` holds the
      # dependencies, and the workspace's own crates build here every night.
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-cli -p ein-infer -p ein-render --profile gate --no-run
      # The `slow = true` entries the per-commit sweep skips, every declared
      # cell of each: 14 entries on 2026-11-03
      # (`grep -c '^slow *= *true' corpus/corpus.toml`). `slow` is a measured
      # claim, an entry whose declared runs cost 1 s or more together, recorded
      # in `cost_ms`, and two tests hold the flag to it in both directions:
      # `ein-corpus`'s `slow_matches_the_recorded_cost` and `corpus_cli.rs`'s
      # `the_slow_flag_still_describes_the_sweep`, whose timing half runs only
      # under `EIN_CORPUS_SLOW` at release speed, which is this step
      # (docs/history/m1a_rust/measurements/corpus_cost.md). **Every test step
      # here runs the gate profile** (M1f S1f.6.39), release codegen with the
      # debug assertions and overflow checks on, as the per-commit tier does:
      # `--release` until then, which dropped both.
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-cli --profile gate --test corpus_cli
        env: { EIN_CORPUS_SLOW: "1" }
      # M1e2 S1e2.1.2 — every `--dump-answer` state file a fixpoint of its own
      # program (`docs/kernel/inference/answer_dump.md`). Per commit it leaves
      # out the runs of the `heavy_dump` entries, W8's `square-unique` witness
      # among them, and this step reads them (M1f S1f.6.39, Q-M1f.294).
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-cli --profile gate --test answer_dump
        env: { EIN_CORPUS_SLOW: "1" }
      # M1e2 S1e2.1a.6 — every mode's read-out and summary under every lever,
      # held to the default's, with the cells the per-commit tier leaves out
      # for their cost: the declared lever cells of the slow entries (the
      # zebra2 pair's) and the register's witnesses that are slow. The one
      # test that reads the flag, by name, since M1f S1f.6.39: the binary's
      # others are the per-commit tier's, and one of them was 227 of the
      # step's 244 s on four threads (2026-11-15).
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-cli --profile gate --test lever_invariance -- every_declared_lever_cell_moves_no_line_of_any_mode
        env: { EIN_CORPUS_SLOW: "1" }
      # M1f S1f.5.27 (Q-M1f.51) — `region`'s slow half, the state route held
      # to route 1 through layer 6 on zebra2-minus-15, which no per-commit test
      # reaches: its one test that reads the flag, by name, since S1f.6.39 (the
      # binary's others are the per-commit tier's, which runs them).
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-infer --profile gate --test region -- the_state_route_is_route_1_on_zebra2_minus_15_through_layer_6
        env: { EIN_CORPUS_SLOW: "1" }
      # And `obligation_rung`'s, the theory held to the hrule's 32 states.
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-infer --profile gate --test obligation_rung
        env: { EIN_CORPUS_SLOW: "1" }
      # The pair layer of the hypothesis set held to `N` on the `slow` entries
      # too: the pairs it excludes are the members of `N` that hold two
      # candidates, and the candidates it finds dead alone are the read-out's,
      # on every corpus program whose describe exhausts at the default budget.
      # The per-commit tier reads every entry that is not slow and three named
      # instances. The one test that reads the flag, by name: the binary's
      # others are the per-commit tier's.
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-infer --profile gate --test pair_layer -- the_excluded_pairs_are_the_pairs_of_n
        env: { EIN_CORPUS_SLOW: "1" }
      # The coupling against a describe on the `slow` entries too: every
      # member of N lies inside one edge of the questions' hypergraph, and R
      # is the product of its parts over the hypergraph's components, joined
      # along the debts across them, on every corpus program whose describe
      # exhausts at the default budget. The one test that reads the flag, by
      # name: the binary's others are the per-commit tier's.
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-infer --profile gate --test coupling -- the_coupling_is_held_to_n_and_to_r
        env: { EIN_CORPUS_SLOW: "1" }
      # What a route knows dead by a state's denial, on the `slow` entries
      # too: every question on every corpus program that searches answers the
      # same with the denials read and from deaths alone. The per-commit tier
      # reads every entry that is not slow and the two zebra puzzles. The one
      # test that reads the flag, by name: the binary's others are the
      # per-commit tier's.
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-infer --profile gate --test known_dead -- every_question_answers_alike_with_the_denials_and_from_deaths_alone
        env: { EIN_CORPUS_SLOW: "1" }
      # The structure of the hypothesis set, which is root's pair layer, the
      # theory's share of it and the cover by groups, held to a permuted id
      # space and to every import form on the `slow` entries too. The
      # per-commit tier reads every program that searches but the `slow`
      # ones, and three named instances.
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-infer --profile gate --test structure_invariance
        env: { EIN_CORPUS_SLOW: "1" }
      # M1e2 S1e2.1c.2 — route 1 and the state route print one read-out, the
      # state route never doing more: the test at the default budget, by name,
      # with the `slow` entries the per-commit half leaves here since M1f
      # S1f.6.39 (Q-M1f.291). Its 2^25 test is gone: no test runs past the
      # default budget (Q-M1f.304 ruled (d), 2026-11-15).
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-cli --profile gate --test route_invariance -- the_state_route_and_route_1_print_one_read_out
        env: { EIN_CORPUS_SLOW: "1" }
      # M1f S1f.6.35 — every corpus program that imports answers alike with its
      # imports selective, whole and `:as` (the user's criterion of 2026-11-14);
      # the per-commit tier reads the entries that are not slow, and this the
      # slow ones too: 83 s here (2026-11-14).
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-cli --profile gate --test import_invariance
        env: { EIN_CORPUS_SLOW: "1" }
      # M1f S1f.6.39 (Q-M1f.288, .290) — the job count's sweep over every
      # corpus program, where per commit it reads the programs outside
      # `tests/` that search; and Graphviz over every view of every corpus
      # program, where per commit it reads those outside `tests/`.
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-render --profile gate --test jobs_invariance
        env: { EIN_CORPUS_SLOW: "1" }
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-render --profile gate --test dot_wellformed
        env: { EIN_CORPUS_SLOW: "1" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }
      # M1e2 S1e2.3.6 — the test steps left nothing in their `TMPDIR`,
      # every entry named with the file that writes it (S1e2.3.5's check).
      - run: python3 utils/check_test_scratch.py "${GATE_TMP}"
        working-directory: ${{ github.workspace }}

  deep-corpus-shards:
    name: ein.rs — the long slow halves and the full-corpus sweeps, in shards
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ein.rs } }
    env: { GATE_TMP: "${{ github.workspace }}/build/gate-tmp" }
    # M1f S1f.6.39 (Q-M1f.293): every step here, run whole, was over five
    # minutes on the runner's four threads, or would have been; one shard of
    # each a job. A program is in one shard of every step.
    strategy:
      fail-fast: false
      matrix: { shard: ["1/4", "2/4", "3/4", "4/4"] }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ein.rs }
      - run: sudo apt-get update && sudo apt-get install -y graphviz libgvplugin-neato-layout8
      - run: mkdir -p "${GATE_TMP}"
      # M1f S1f.6.39 — the shard's test binaries, built in a step of their own, so
      # that a test step's time on the runner is its tests' (Q-M1f.102's five
      # minutes a step) and the build's is read apart: `rust-cache` holds the
      # dependencies, and the workspace's own crates build here every night.
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-cli -p ein-infer -p ein-render --profile gate --no-run
      # M1f S1f.5.13 — every corpus program's `--dump-answer` state files, each
      # reloaded to its state by value, with the entries the per-commit tier
      # leaves out: the `slow` ones, and the `heavy_dump` ones, whose dump
      # writes 40 000 state files or more (`ein_corpus::manifest::HEAVY_DUMP_FILES`;
      # `square-unique`'s three, `features/04_open` and `features/01`, 64 514
      # to 65 214 each on 2026-11-09). The user's ruling of 2026-11-08 on P-16,
      # *"move to slow tier"*; until it no CI tier ran this test's slow half.
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-cli --profile gate --test answer_round_trip
        env: { EIN_CORPUS_SLOW: "1", EIN_TEST_SHARD: "${{ matrix.shard }}" }
      # M1e2 S1e2.2.21 — every core a run reports names its commitment and,
      # with root, derives its contradiction; the per-commit tier reads the
      # entries that are not slow, and this the zebra family's too.
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-infer --profile gate --test corpus_cores
        env: { EIN_CORPUS_SLOW: "1", EIN_TEST_SHARD: "${{ matrix.shard }}" }
      # M1f S1f.6.39 (Q-M1f.287, .289, .290) — every rendering of every corpus
      # program held to the golden, and every one under one permuted id space:
      # per commit the golden reads the programs outside `tests/` and the
      # permutation those of them that search. Eight permutations are the dev
      # host's.
      - run: TMPDIR="${GATE_TMP}" cargo test -p ein-render --profile gate --test id_order_invariance
        env: { EIN_CORPUS_SLOW: "1", EIN_TEST_SHARD: "${{ matrix.shard }}" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }
      - run: python3 utils/check_test_scratch.py "${GATE_TMP}"
        working-directory: ${{ github.workspace }}

  # ── The sensitivity census — M1e S1e.4.5, `TE-L4` ──
  #
  # It reads the gate profile's `ein`, built by the step before it (M1f
  # S1f.6.39: `target/gate/ein`, which the deep-corpus job's tests built
  # until the census left it for shards of its own). Its mutants run on
  # `EIN_TEST_JOBS` workers, each in its own stdlib tree, the report in the
  # mutants' order (`--jobs`), every `n`-th mutant from the `k`-th in a
  # shard (`--shard`, `EIN_TEST_SHARD`, Q-M1f.293: the whole census was 23
  # min on four threads). It is not the gate: the per-commit claim is
  # `ein-infer/tests/stdlib_coverage.rs`, in-process and scoped to
  # `tests/stdlib/`, which asks whether a rule is activated, and this whether
  # the activation would notice a defect. Its sibling, `stdlib_census.py
  # --check`, the weaker corpus-wide claim and a measurement, left for the dev
  # host at M1f S1f.5.27 (380 s on the runner, run 42802597417), and so did
  # the whole review bundle and its link check (372 s and 13 s there): the
  # per-commit `review_bundle.py --smoke` reads every register row and builds
  # four cases, and `utils/ci_container.sh --dev-host` builds the whole
  # bundle on the runner's Graphviz.
  mutants:
    name: stdlib — the sensitivity census, in shards
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ein.rs } }
    strategy:
      fail-fast: false
      matrix: { shard: ["1/12", "2/12", "3/12", "4/12", "5/12", "6/12", "7/12", "8/12", "9/12", "10/12", "11/12", "12/12"] }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ein.rs }
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }
      - run: cargo build -p ein-cli --profile gate --bin ein
      # M1e S1e.3.6 — would `tests/` notice a defect in the rule it tests: four
      # mechanical mutation families over every `(rule …)` in `stdlib/`, each
      # run past `ein test tests/`, and the survivors held as a set to
      # `tests/mutation_survivors.txt`. `--check` fails on a new survivor and on
      # a banked one that is now killed, each shard on its own mutants'. A
      # change in the set is explained in `tests/README.md` before `--bless`
      # re-banks it, which is a whole run.
      #
      # `working-directory` overrides the job's `ein.rs`: the script resolves
      # the repo from `__file__` and runs the engine with `cwd=REPO`, but the
      # `python3 utils/...` path is root-relative.
      - run: python3 utils/stdlib_mutants.py --check --bin ein.rs/target/gate/ein
        working-directory: ${{ github.workspace }}
        env: { EIN_TEST_SHARD: "${{ matrix.shard }}" }

  frontend-fuzz:
    name: ein.rs — the frontend fuzzer, at the nightly's budget
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ein.rs } }
    strategy:
      fail-fast: false
      matrix: { seed: ["1", "987654321"] }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # 20 000 mutations a seed since M1f S1f.5.27 (Q-M1f.103). It was 10^6,
      # P1a.1's acceptance number, which the dev host runs: five of the file's
      # properties parse every input of the stream, and the runner took
      # 4 410 s and 3 494 s for a million a seed (run 42802597417,
      # 2026-11-10). The per-commit tier runs 2 000 (`EIN_FUZZ_ITERS`' default
      # in `fuzz_properties.rs`). A find is minimised and written to
      # corpus/fuzz_findings/, which the failure artifact carries out.
      - run: cargo test -p ein-ir --profile gate --test fuzz_properties
        env: { EIN_FUZZ_ITERS: "20000", EIN_FUZZ_SEED: "${{ matrix.seed }}" }
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: fuzz-findings-${{ matrix.seed }}
          path: corpus/fuzz_findings
          retention-days: 30

  benches:
    name: benchmarks — the M1a measurement set
    runs-on: ubuntu-latest
    # A shared runner is nobody's quiet machine, so this job
    # exists to prove the benches still *run*, not to publish a timing —
    # `--test` is one iteration per case, which is exactly that check. The
    # per-commit tier runs the same command as its last step.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo bench --bench engine -- --test
        working-directory: ein.rs
