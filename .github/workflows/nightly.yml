# Tier 2 of three — plans/m1a_rust/design/12_toolchain_and_layout.md §4.
#
# Budget: an hour. Everything the per-commit tier cannot afford, plus the check
# that only makes sense over time: does anything the corpus does not cover
# break.
#
# Three jobs left at M1a S1a.10.3, with the harness they drove. Each named a
# question, and each question has an owner that runs without a second engine:
#
#   hash-seed-sweep    ein.py against itself under two PYTHONHASHSEEDs — the
#                      check that found hazards H1 and H4. Successor:
#                      `ein-render/tests/id_order_invariance.rs`, which
#                      permutes the *id space* instead of a hash seed and is
#                      stronger for it (the ledger §5). `EIN_ID_SEEDS=8` below.
#   conformance-full   the whole corpus, both engines, T1 and T3. Successor:
#                      `cargo test --workspace` per commit, plus the corpus
#                      sweep at EIN_CORPUS_SLOW=1 below for the 17 slow
#                      entries the per-commit tier skips.
#   frontend-fuzz      the parser against lark, 10^6 mutations. Successor:
#                      `ein-ir/tests/fuzz_properties.rs`, which checks the
#                      frontend's own properties — nothing panics, everything
#                      that parses round-trips, every recorded finding still
#                      parses the way it was recorded.

name: nightly

on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:

jobs:
  full-suite:
    name: ein.py — full suite + the acceptance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install -e 'ein.py[dev]'
      # No --fast: the EIN_RUN_SLOW tests and the three exhaustive zebra2
      # task-class fixtures.
      - run: ./run_tests.sh -j auto

  deep-corpus:
    name: ein.rs — the slow corpus entries, and the id space permuted
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ein.rs } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ein.rs }
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      # The 17 `slow` entries — 118 cells the per-commit sweep skips, two
      # minutes of exhaustive search including `zebra2` and `zebra2-minus-15`.
      - run: cargo test -p ein-cli --release --test corpus_cli
        env: { EIN_CORPUS_SLOW: "1" }
      # Eight id-space permutations rather than one. The successor to the
      # PYTHONHASHSEED sweep: same question — does any output depend on an
      # ordering accident — asked of the one engine that is left.
      - run: cargo test -p ein-render --release --test id_order_invariance
        env: { EIN_ID_SEEDS: "8" }

  frontend-fuzz:
    name: ein.rs — the frontend fuzzer, at budget
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ein.rs } }
    strategy:
      fail-fast: false
      matrix: { seed: ["1", "987654321"] }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 10^6 mutations is P1a.1's acceptance number; the per-commit tier runs
      # 2 000 of them. A find is minimised and written to
      # corpus/fuzz_findings/, which the failure artifact carries out.
      - run: cargo test -p ein-ir --release --test fuzz_properties
        env:
          EIN_FUZZ_ITERS: "1000000"
          EIN_FUZZ_SEED: ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-findings-${{ matrix.seed }}
          path: corpus/fuzz_findings
          retention-days: 30

  benches:
    name: benchmarks — the M1a measurement set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -e ein.py
      - run: python3 utils/bench_baseline.py --json bench-python.json
      - run: cargo bench --bench engine
        working-directory: ein.rs
      - uses: actions/upload-artifact@v4
        with: { name: benches, path: bench-python.json, retention-days: 30 }

  packaging:
    name: ein.py — the sdist and wheel build, and install from them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install build
      # The per-commit tier installs editable, which exercises `build_editable`
      # and nothing else. These are the two paths a user gets — and the two
      # that carry the stdlib copy out of the checkout (design/11 § Packaging).
      # Installing FROM the sdist is the part that matters: an sdist that omits
      # the in-tree backend cannot be built at all, and nothing else notices.
      - run: python -m build --outdir dist ein.py
      - run: pip install dist/*.whl
      # Run from outside the repo, so the checkout cannot be what answers the
      # import — this is the packaged copy or nothing.
      - run: cd /tmp && ein saturate "$GITHUB_WORKSPACE/examples/features/05_stdlib_domain_elim.ein"
      - run: pip uninstall -y ein && pip install dist/*.tar.gz
      - run: cd /tmp && ein saturate "$GITHUB_WORKSPACE/examples/features/05_stdlib_domain_elim.ein"
