# Tier 2 of three — docs/history/m1a_rust/design/12_toolchain_and_layout.md §4.
#
# Budget: an hour. Everything the per-commit tier cannot afford, plus the check
# that only makes sense over time: does anything the corpus does not cover
# break.

name: nightly

on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:

jobs:
  deep-corpus:
    name: ein.rs — the slow corpus entries, and the id space permuted
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ein.rs } }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ein.rs }
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      # The `slow = true` entries the per-commit sweep skips, every declared
      # cell of each: 14 entries on 2026-11-03
      # (`grep -c '^slow *= *true' corpus/corpus.toml`). `slow` is a measured
      # claim, an entry whose declared runs cost 1 s or more together, recorded
      # in `cost_ms`, and two tests hold the flag to it in both directions:
      # `ein-corpus`'s `slow_matches_the_recorded_cost` and `corpus_cli.rs`'s
      # `the_slow_flag_still_describes_the_sweep`, whose timing half runs only
      # under `EIN_CORPUS_SLOW` on `--release`, which is this step
      # (docs/history/m1a_rust/measurements/corpus_cost.md).
      - run: cargo test -p ein-cli --release --test corpus_cli
        env: { EIN_CORPUS_SLOW: "1" }
      # Eight id-space permutations of every corpus file, where the per-commit
      # tier runs `EIN_ID_SEEDS`' default of one: does any output depend on an
      # ordering accident.
      - run: cargo test -p ein-render --release --test id_order_invariance
        env: { EIN_ID_SEEDS: "8" }
      # M1e2 S1e2.1.2 — every `--dump-answer` state file a fixpoint of its own
      # program (`docs/kernel/inference/answer_dump.md`). **This step runs what
      # the per-commit tier runs, under `--release`.** It was here for one slow
      # run, `zebra2-minus-15 -e -m 3`, which went with `-e` at S1e2.1a.5's
      # switch (`fbcae3b2`, 2026-10-18); nothing in `answer_dump.rs` has read
      # `EIN_CORPUS_SLOW` since. Whether it gets a slow cell back is parked in
      # S1e2.3.6's notes.
      - run: cargo test -p ein-cli --release --test answer_dump
        env: { EIN_CORPUS_SLOW: "1" }
      # M1e2 S1e2.1a.6 — every mode's read-out and summary under every lever,
      # held to the default's, with the cells the per-commit tier leaves out
      # for their cost: the declared lever cells of the slow entries (the
      # zebra2 pair's) and the register's witnesses that are slow.
      - run: cargo test -p ein-cli --release --test lever_invariance
        env: { EIN_CORPUS_SLOW: "1" }
      # ── The two `--check` censuses — M1e S1e.4.5, `TE-L4` ──
      #
      # Both read the release `ein` the steps above have already built
      # (`CARGO_BIN_EXE_ein` is `target/release/ein` under `--release`), so
      # this is two runs and not a job. Neither is the gate and neither should
      # be: the per-commit claim is `ein-infer/tests/stdlib_coverage.rs`,
      # in-process and scoped to `tests/stdlib/`, because a rule that fires only
      # inside `examples/zebra.ein` has no test. These are the weaker
      # corpus-wide claim and the sensitivity claim, the two that were, in the
      # coverage test's own words, shaped like something that "runs when
      # somebody remembers it".
      #
      # `working-directory` overrides the job's `ein.rs`: both scripts resolve
      # the repo from `__file__` and run the engine with `cwd=REPO`, but the
      # `python3 utils/...` path is root-relative.
      #
      # **Nothing in the workspace reads this file**, so deleting these two
      # steps fails no test: `ein-cli/tests/gate_steps.rs` diffs `run_tests.sh`
      # against the *per-commit* workflow only. That is accepted rather than
      # unnoticed — teaching that test a second marker convention is more than
      # a Low finding is worth, and the cadence is stated in `utils/README.md`
      # where a reader of the numbers will find it.
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }
      - run: python3 utils/stdlib_census.py --check
        working-directory: ${{ github.workspace }}
      # M1e2 S1e2.1.6 — the whole review bundle, every register case, with the
      # release `ein` the corpus step above built; a case whose page fails to
      # build exits 1, and so does a dangling link or image in it.
      - run: python3 utils/review_bundle.py && python3 utils/doc_audit.py --links --check build/review
        working-directory: ${{ github.workspace }}
      # M1e S1e.3.6 — would `tests/` notice a defect in the rule it tests: four
      # mechanical mutation families over every `(rule …)` in `stdlib/`, each
      # run past `ein test tests/`, and the survivors held as a set to
      # `tests/mutation_survivors.txt`. `--check` fails on a new survivor and on
      # a banked one that is now killed. A change in the set is explained in
      # `tests/README.md` before `--bless` re-banks it.
      - run: python3 utils/stdlib_mutants.py --check
        working-directory: ${{ github.workspace }}

  frontend-fuzz:
    name: ein.rs — the frontend fuzzer, at budget
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ein.rs } }
    strategy:
      fail-fast: false
      matrix: { seed: ["1", "987654321"] }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # 10^6 mutations is P1a.1's acceptance number; the per-commit tier runs
      # 2 000 of them (`EIN_FUZZ_ITERS`' default in `fuzz_properties.rs`). A
      # find is minimised and written to corpus/fuzz_findings/, which the
      # failure artifact carries out.
      - run: cargo test -p ein-ir --release --test fuzz_properties
        env:
          EIN_FUZZ_ITERS: "1000000"
          EIN_FUZZ_SEED: ${{ matrix.seed }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: fuzz-findings-${{ matrix.seed }}
          path: corpus/fuzz_findings
          retention-days: 30

  benches:
    name: benchmarks — the M1a measurement set
    runs-on: ubuntu-latest
    # A shared runner is nobody's quiet machine, so this job
    # exists to prove the benches still *run*, not to publish a timing —
    # `--test` is one iteration per case, which is exactly that check. The
    # per-commit tier runs the same command as its last step.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo bench --bench engine -- --test
        working-directory: ein.rs
