<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:480px;height:1110px;background:#FFFFFF;" width="480px" height="1110px" viewBox="0 0 480 1110" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><ellipse cx="258.72" cy="25" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="193.85" y="55" width="129.741" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="203.85" y="77.828" fill="#000" font-size="12" textLength="109.741">fork = root.branch()</text><rect x="114.067" y="111.344" width="289.306" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="124.067" y="134.172" fill="#000" font-size="12" textLength="269.306">write each fact of the commitment, in H's order,</text><text x="124.067" y="150.516" fill="#000" font-size="12" textLength="158.353">with hypothesis provenance</text><rect x="148.219" y="184.032" width="221.001" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="158.219" y="206.86" fill="#000" font-size="12" textLength="196.837">Saturator::resume(root's snapshot,</text><text x="158.219" y="223.205" fill="#000" font-size="12" textLength="201.001">delta = the facts the snapshot lacks)</text><polygon points="153.253,256.721,364.187,256.721,376.187,271.702,364.187,286.684,153.253,286.684,141.253,271.702,153.253,256.721" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="153.253" y="268.479" fill="#000" font-size="11" textLength="210.935">a route's node, on a monotone program,</text><text x="153.253" y="283.461" fill="#000" font-size="11" textLength="180.718">and the commitment is not empty?</text><text x="124.17" y="268.479" fill="#000" font-size="11" textLength="17.083">yes</text><text x="376.187" y="268.479" fill="#000" font-size="11" textLength="13.453">no</text><rect x="16" y="296.684" width="230.506" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="319.512" fill="#000" font-size="12" textLength="189.877">saturate to the first contradiction,</text><text x="26" y="335.857" fill="#000" font-size="12" textLength="210.506">or to the fixpoint where there is none</text><rect x="311.417" y="296.684" width="149.541" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="321.417" y="319.512" fill="#000" font-size="12" textLength="129.541">saturate to the fixpoint</text><polygon points="258.72,355.373,270.72,367.373,258.72,379.373,246.72,367.373,258.72,355.373" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="163.855" y="399.373" width="189.729" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="173.855" y="422.201" fill="#000" font-size="12" textLength="169.729">obligations::tally: what it owes</text><rect x="114.745" y="505.208" width="287.95" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="124.745" y="528.036" fill="#000" font-size="12" textLength="267.95">the pass of open.rs writes the state's open facts</text><polygon points="129.124,455.717,388.316,455.717,400.316,467.717,388.316,479.717,129.124,479.717,117.124,467.717,129.124,455.717" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="262.72" y="491.476" fill="#000" font-size="11" textLength="17.083">yes</text><text x="129.124" y="471.985" fill="#000" font-size="11" textLength="259.191">a rule reads open, or the state is printed or saved?</text><polygon points="258.72,561.552,270.72,573.552,258.72,585.552,246.72,573.552,258.72,561.552" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="170.533" y="605.552" width="176.373" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="180.533" y="628.38" fill="#000" font-size="12" textLength="156.373">contradiction::detect: dead?</text><rect x="136.129" y="661.896" width="245.182" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="146.129" y="684.724" fill="#000" font-size="12" textLength="184.873">closure = the candidates it holds;</text><text x="146.129" y="701.068" fill="#000" font-size="12" textLength="225.182">denied = those whose negation it stores</text><rect x="133.705" y="734.584" width="250.03" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="143.705" y="757.412" fill="#000" font-size="12" textLength="230.03">state key = its facts beyond root's, sorted</text><rect x="104.923" y="840.419" width="307.594" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="114.923" y="863.247" fill="#000" font-size="12" textLength="287.594">go on to the fixpoint, silently, where it was stopped</text><rect x="137.209" y="911.763" width="243.022" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="147.209" y="934.591" fill="#000" font-size="12" textLength="223.022">explain::contradiction_frontier: the core</text><polygon points="159.11,790.928,358.33,790.928,370.33,802.928,358.33,814.928,159.11,814.928,147.11,802.928,159.11,790.928" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="262.72" y="826.687" fill="#000" font-size="11" textLength="17.083">yes</text><text x="159.11" y="807.196" fill="#000" font-size="11" textLength="199.22">dead, and a core is asked of this node?</text><polygon points="258.72,9