<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:480px;height:960px;background:#FFFFFF;" width="480px" height="960px" viewBox="0 0 480 960" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><ellipse cx="258.72" cy="25" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="193.85" y="55" width="129.741" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="203.85" y="77.828" fill="#000" font-size="12" textLength="109.741">fork = root.branch()</text><rect x="114.067" y="111.344" width="289.306" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="124.067" y="134.172" fill="#000" font-size="12" textLength="269.306">write each fact of the commitment, in H's order,</text><text x="124.067" y="150.516" fill="#000" font-size="12" textLength="158.353">with hypothesis provenance</text><rect x="148.219" y="184.032" width="221.001" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="158.219" y="206.86" fill="#000" font-size="12" textLength="196.837">Saturator::resume(root's snapshot,</text><text x="158.219" y="223.205" fill="#000" font-size="12" textLength="201.001">delta = the facts the snapshot lacks)</text><polygon points="153.253,256.721,364.187,256.721,376.187,271.702,364.187,286.684,153.253,286.684,141.253,271.702,153.253,256.721" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="153.253" y="268.479" fill="#000" font-size="11" textLength="210.935">a route's node, on a monotone program,</text><text x="153.253" y="283.461" fill="#000" font-size="11" textLength="180.718">and the commitment is not empty?</text><text x="124.17" y="268.479" fill="#000" font-size="11" textLength="17.083">yes</text><text x="376.187" y="268.479" fill="#000" font-size="11" textLength="13.453">no</text><rect x="16" y="296.684" width="230.506" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="319.512" fill="#000" font-size="12" textLength="189.877">saturate to the first contradiction,</text><text x="26" y="335.857" fill="#000" font-size="12" textLength="210.506">or to the fixpoint where there is none</text><rect x="311.417" y="296.684" width="149.541" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="321.417" y="319.512" fill="#000" font-size="12" textLength="129.541">saturate to the fixpoint</text><polygon points="258.72,355.373,270.72,367.373,258.72,379.373,246.72,367.373,258.72,355.373" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="170.533" y="399.373" width="176.373" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="180.533" y="422.201" fill="#000" font-size="12" textLength="156.373">contradiction::detect: dead?</text><rect x="163.855" y="455.717" width="189.729" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="173.855" y="478.545" fill="#000" font-size="12" textLength="169.729">obligations::tally: what it owes</text><rect x="136.129" y="512.061" width="245.182" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="146.129" y="534.889" fill="#000" font-size="12" textLength="184.873">closure = the candidates it holds;</text><text x="146.129" y="551.233" fill="#000" font-size="12" textLength="225.182">denied = those whose negation it stores</text><rect x="133.705" y="584.749" width="250.03" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="143.705" y="607.577" fill="#000" font-size="12" textLength="230.03">state key = its facts beyond root's, sorted</text><rect x="104.923" y="690.584" width="307.594" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="114.923" y="713.412" fill="#000" font-size="12" textLength="287.594">go on to the fixpoint, silently, where it was stopped</text><rect x="137.209" y="761.928" width="243.022" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="147.209" y="784.756" fill="#000" font-size="12" textLength="223.022">explain::contradiction_frontier: the core</text><polygon points="159.11,641.093,358.33,641.093,370.33,653.093,358.33,665.093,159.11,665.093,147.11,653.093,159.11,641.093" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="262.72" y="676.852" fill="#000" font-size="11" textLength="17.083">yes</text><text x="159.11" y="657.361" fill="#000" font-size="11" textLength="199.22">dead, and a core is asked of this node?</text><polygon points="258.72,818.272,270.72,830.272,258.72,842.272,246.72,830.272,258.72,818.272" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="94.579" y="862.272" width="328.282" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="104.579" y="885.1" fill="#000" font-size="12" textLength="308.282">NodeOut: dead, owes, closure, denied, state, its events</text><ellipse cx="258.72" cy="929.616" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="258.72" cy="929.616" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="258.72" y1="35" x2="258.72" y2="55" style="stroke:#181818;stroke-width:1;"/><polygon points="254.72,45,258.72,55,262.72,45,258.72,49" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="258.72" y1="91.344" x2="258