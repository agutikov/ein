<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:614px;height:1485px;background:#FFFFFF;" width="614px" height="1485px" viewBox="0 0 614 1485" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="246.49" y="87" width="50" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="259.947" y="112.432" fill="#000" font-size="14" textLength="23.086">run</text><rect x="246.49" y="188" width="50" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="257.217" y="213.432" fill="#000" font-size="14" textLength="28.546">load</text><g class="entity" data-qualified-name="Sat" id="ent0003" data-source-line="4"><rect x="161.42" y="289" width="220.143" height="77.204" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="161.42" y1="318.068" x2="381.563" y2="318.068" style="stroke:#181818;stroke-width:0.5;"/><text x="217.011" y="308.966" fill="#000" font-size="14" textLength="108.962">root's saturation</text><text x="166.42" y="338.034" fill="#000" font-size="14" textLength="150.905">compile, enqueue, fire,</text><text x="166.42" y="357.102" fill="#000" font-size="14" textLength="200.143">quiesce, park, admit, retire, alt</text></g><g class="entity" data-qualified-name="Gen" id="ent0004" data-source-line="5"><rect x="186.06" y="427.2" width="170.863" height="77.204" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="186.06" y1="456.268" x2="356.923" y2="456.268" style="stroke:#181818;stroke-width:0.5;"/><text x="242.736" y="447.166" fill="#000" font-size="14" textLength="57.512">H is built</text><text x="191.06" y="476.234" fill="#000" font-size="14" textLength="150.863">hyp, hypskip (verbose),</text><text x="191.06" y="495.302" fill="#000" font-size="14" textLength="113.862">at most one rung</text></g><g class="entity" data-qualified-name="Owe" id="ent0005" data-source-line="6"><rect x="190.82" y="565.41" width="161.344" height="58.136" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="190.82" y1="594.478" x2="352.164" y2="594.478" style="stroke:#181818;stroke-width:0.5;"/><text x="200.82" y="585.376" fill="#000" font-size="14" textLength="141.344">root's obligation pass</text><text x="195.82" y="614.444" fill="#000" font-size="14" textLength="105.084">owe, one a debt</text></g><g class="entity" data-qualified-name="Resume" id="ent0006" data-source-line="7"><rect x="7" y="720.54" width="194.985" height="96.272" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="749.608" x2="201.985" y2="749.608" style="stroke:#181818;stroke-width:0.5;"/><text x="17" y="740.506" fill="#000" font-size="14" textLength="174.985">root's saturation, resumed</text><text x="12" y="769.574" fill="#000" font-size="14" textLength="148.987">enqueue, fire, quiesce:</text><text x="12" y="788.642" fill="#000" font-size="14" textLength="151.843">a rule reads open, over</text><text x="12" y="807.71" fill="#000" font-size="14" textLength="133.167">what the pass wrote</text></g><g class="entity" data-qualified-name="Mono" id="ent0007" data-source-line="8"><rect x="153.98" y="895.81" width="213.017" height="58.136" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="153.98" y1="924.878" x2="366.997" y2="924.878" style="stroke:#181818;stroke-width:0.5;"/><text x="216.991" y="915.776" fill="#000" font-size="14" textLength="86.996">monotonicity</text><text x="158.98" y="944.844" fill="#000" font-size="14" textLength="193.017">one line, a flagged program's</text></g><g class="entity" data-qualified-name="Node" id="ent0008" data-source-line="9"><rect x="229.38" y="1014.95" width="222.229" height="134.408" fill="#F1F1F1" styl