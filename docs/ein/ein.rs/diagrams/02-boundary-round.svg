<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:800px;height:640px;background:#FFFFFF;" width="800px" height="640px" viewBox="0 0 800 640" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><ellipse cx="251.728" cy="25" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="112.343" y="55" width="278.77" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="122.343" y="77.828" fill="#000" font-size="12" textLength="215.486">take the size of each watched relation;</text><text x="122.343" y="94.172" fill="#000" font-size="12" textLength="258.77">advance the clock of each guard set that grew</text><polygon points="180.091,184.947,323.365,184.947,335.365,199.929,323.365,214.911,180.091,214.911,168.091,199.929,180.091,184.947" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="180.091" y="196.706" fill="#000" font-size="11" textLength="142.174">judged before, and nothing</text><text x="180.091" y="211.688" fill="#000" font-size="11" textLength="143.274">its guard set watches grew?</text><text x="151.008" y="196.706" fill="#000" font-size="11" textLength="17.083">yes</text><text x="335.365" y="196.706" fill="#000" font-size="11" textLength="13.453">no</text><rect x="43" y="224.911" width="53.18" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="53" y="247.739" fill="#000" font-size="12" textLength="33.18">skip it</text><rect x="270.967" y="224.911" width="325.798" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="280.967" y="247.739" fill="#000" font-size="12" textLength="305.798">run each guard's sub-plan on the candidate's bindings</text><text x="280.967" y="264.083" fill="#000" font-size="12" textLength="261.578">(Matcher::holds), to the first that finds a match</text><polygon points="139.191,297.599,269.375,297.599,281.375,309.599,269.375,321.599,139.191,321.599,127.191,309.599,139.191,297.599" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="208.283" y="333.358" fill="#000" font-size="11" textLength="17.083">yes</text><text x="139.191" y="313.867" fill="#000" font-size="11" textLength="130.184">no guard found a match?</text><rect x="116.18" y="356.581" width="176.205" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="126.18" y="379.409" fill="#000" font-size="12" textLength="156.205">admit: move it to the queue</text><ellipse cx="204.283" cy="438.925" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="204.283" cy="438.925" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="324.786,297.599,483.174,297.599,495.174,309.599,483.174,321.599,324.786,321.599,312.786,309.599,324.786,297.599" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="407.98" y="333.358" fill="#000" font-size="11" textLength="17.083">yes</text><text x="324.786" y="313.867" fill="#000" font-size="11" textLength="158.388">the failing guard is monotone?</text><text x="495.174" y="306.376" fill="#000" font-size="11" textLength="142.394">no: it holds a nested absent</text><rect x="312.385" y="356.581" width="183.189" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="322.385" y="379.409" fill="#000" font-size="12" textLength="163.189">retire: it can only keep failing</text><rect x="515.575" y="380.59" width="235.978" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="525.575" y="403.418" fill="#000" font-size="12" textLength="215.978">stays parked, stamped with this round</text><polygon points="251.728,475.925,263.728,487.925,251.728,499.925,239.728,487.925,251.728,475.925" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="154.813,127.688,348.643,127.688,360.643,139.688,348.643,151.688,154.813,151.688,142.813,139.688,154.813,127.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="255.728" y="163.447" fill="#000" font-size="11" textLength="19.657">one</text><text x="154.813" y="143.956" fill="#000" font-size="11" textLength="193.83">next parked candidate, in rank order?</text><text x="96.702" y="136.465" fill="#000" font-size="11" textLength="46.112">none left</text><rect x="168.468" y="541.925" width="166.521" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="178.468" y="564.753" fill="#000" font-size="12" textLength="146.521">no admission: the fixpoint</text><ellipse cx="251.728" cy="609.269" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="251.728" cy="609.269" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="251.728" y1="35" x2="251.728" y2="55" style="stroke:#181818;stroke-width:1;"/><polygon points="247.728,45,251.728,55,255.728,45,251.728,49" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="204.283" y1="392.925" x2="204.283" y2="427.925" style="stroke:#181818;stroke-width:1;"/><polygon points="200.283,417.925,204.283,427.925,208.283,417.925,204.283,421.925" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="204.283" y1="321.599" x2="204.283" y2="356.581" style="stroke:#181818;stroke-width:1;"/><polygon points="200.283,346.581,204.283,356.581,208.283,346.581,204.283,350.581" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin: