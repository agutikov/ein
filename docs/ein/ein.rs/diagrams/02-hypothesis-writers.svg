<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:725px;height:698px;background:#FFFFFF;" width="725px" height="698px" viewBox="0 0 725 698" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><ellipse cx="362.71" cy="25" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="279.648" y="104.491" width="166.125" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="289.648" y="127.319" fill="#000" font-size="12" textLength="146.125">no writer runs: H is empty</text><ellipse cx="362.71" cy="179.163" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="362.71" cy="179.163" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="264.145,55,461.275,55,473.275,67,461.275,79,264.145,79,252.145,67,264.145,55" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="366.71" y="90.759" fill="#000" font-size="11" textLength="17.083">yes</text><text x="264.145" y="71.268" fill="#000" font-size="11" textLength="197.13">the program states (solve :no-search)?</text><text x="473.275" y="63.777" fill="#000" font-size="11" textLength="13.453">no</text><rect x="122.032" y="232.163" width="481.355" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="132.032" y="254.991" fill="#000" font-size="12" textLength="207.001">the rules that conclude a hypothesis:</text><text x="132.032" y="271.335" fill="#000" font-size="12" textLength="461.355">each plan's matches at root, one candidate a match (HypothesisRules::candidates)</text><rect x="248.249" y="304.851" width="228.922" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="258.249" y="327.679" fill="#000" font-size="12" textLength="208.922">the (open F) facts the program writes</text><polygon points="123.827,361.195,295.195,361.195,307.195,373.195,295.195,385.195,123.827,385.195,111.827,373.195,123.827,361.195" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="213.511" y="396.954" fill="#000" font-size="11" textLength="17.083">yes</text><text x="123.827" y="377.463" fill="#000" font-size="11" textLength="171.368">an obligation is activated at root?</text><rect x="16" y="418.454" width="387.023" height="69.032" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="441.282" fill="#000" font-size="12" textLength="367.023">oblgen::generate: the facts that would discharge what root owes,</text><text x="26" y="457.626" fill="#000" font-size="12" textLength="274.25">and what a rule can bring a commitment to owe;</text><text x="26" y="473.971" fill="#000" font-size="12" textLength="359.943">nothing where a witness step does not resolve (Mode::Declined)</text><polygon points="435.023,361.195,647.42,361.195,659.42,373.195,647.42,385.195,435.023,385.195,423.023,373.195,435.023,361.195" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="545.221" y="396.954" fill="#000" font-size="11" textLength="13.453">no</text><text x="435.023" y="377.463" fill="#000" font-size="11" textLength="212.398">a rule or the program wrote a candidate?</text><text x="659.42" y="369.972" fill="#000" font-size="11" textLength="17.083">yes</text><rect x="437.777" y="418.454" width="206.889" height="69.032" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="447.777" y="441.282" fill="#000" font-size="12" textLength="124.165">the blind enumerator:</text><text x="447.777" y="457.626" fill="#000" font-size="12" textLength="185.101">every eligible relation, every slot,</text><text x="447.777" y="473.971" fill="#000" font-size="12" textLength="186.889">over the program's object names</text><rect x="198.659" y="527.487" width="328.102" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="208.659" y="550.315" fill="#000" font-size="12" textLength="269.786">each candidate through the filters, in this order:</text><text x="208.659" y="566.659" fill="#000" font-size="12" textLength="308.102">a stored negation, a fact root holds, a repeat in the call</text><rect x="169.337" y="600.175" width="386.747" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="179.337" y="623.003" fill="#000" font-size="12" textLength="366.747">sort the survivors by text, deduplicate: H, the union of the writers</text><ellipse cx="362.71" cy="667.519" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="362.71" cy="667.519" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="362.71" y1="140.835" x2="362.71" y2="168.163" style="stroke:#181818;stroke-width:1;"/><polygon points="358.71,158.163,362.71,168.163,366.71,158.163,362.71,162.163" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="362.71" y1="79" x2="362.71" y2="104.491" style="stroke:#181818;stroke-width:1;"/><polygon points="358.71,94.491,362.71,104.491,366.71,94.491,362.71,98.491" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="473.275" y1="67" x2="485.275" y2="67" style="stroke:#181818;stroke-width:1;"/><polygon points="481.275,138.163,485.275,148.163,489.275,138.163,485.275,142.163" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="485.275" y1="67" x2="485.275" y2="212.163" style="stroke:#181818;stroke-width:1;"/><line x1="485.275" y1="212.163" x2="362.71" y2="212.163" style="stroke:#181818;stroke-width:1;"/><line x1="362.7