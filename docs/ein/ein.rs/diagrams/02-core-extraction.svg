<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:428px;height:960px;background:#FFFFFF;" width="428px" height="960px" viewBox="0 0 428 960" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><ellipse cx="218.113" cy="25" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="27.83" y="55" width="380.567" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="37.83" y="77.828" fill="#000" font-size="12" textLength="360.567">build the graph: the premise closure of the contradiction's facts,</text><text x="37.83" y="94.172" fill="#000" font-size="12" textLength="325.418">every justification the KB holds for each (Kb::justifications)</text><rect x="64.07" y="127.688" width="308.086" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="74.07" y="150.516" fill="#000" font-size="12" textLength="157.441">label each given fact {itself};</text><text x="74.07" y="166.86" fill="#000" font-size="12" textLength="288.086">a premise-free derivation {the empty environment}</text><rect x="89.954" y="200.376" width="256.318" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="99.954" y="223.205" fill="#000" font-size="12" textLength="236.318">dirty = the consumers of the labelled facts</text><rect x="111.746" y="313.979" width="212.733" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="121.746" y="336.808" fill="#000" font-size="12" textLength="192.733">take the dirty facts, sorted by rank</text><rect x="65" y="427.583" width="306.226" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="75" y="450.411" fill="#000" font-size="12" textLength="286.226">for each of its derivations: fold the premises' labels</text><text x="75" y="466.755" fill="#000" font-size="12" textLength="229.946">into the unions of one environment each</text><rect x="84.056" y="501.262" width="268.114" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="94.056" y="524.09" fill="#000" font-size="12" textLength="248.114">minimise: drop supersets, keep the smallest</text><text x="94.056" y="540.434" fill="#000" font-size="12" textLength="155.485">max_environments of them</text><rect x="130.178" y="628.925" width="175.869" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="140.178" y="651.753" fill="#000" font-size="12" textLength="155.869">its consumers become dirty</text><polygon points="169.581,579.434,266.645,579.434,278.645,591.434,266.645,603.434,169.581,603.434,157.581,591.434,169.581,579.434" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="222.113" y="615.193" fill="#000" font-size="11" textLength="17.083">yes</text><text x="169.581" y="595.702" fill="#000" font-size="11" textLength="97.063">the label changed?</text><polygon points="218.113,685.269,230.113,697.269,218.113,709.269,206.113,697.269,218.113,685.269" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="193.297,370.324,242.929,370.324,254.929,382.324,242.929,394.324,193.297,394.324,181.297,382.324,193.297,370.324" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="222.113" y="406.083" fill="#000" font-size="11" textLength="19.657">one</text><text x="193.297" y="386.592" fill="#000" font-size="11" textLength="49.632">next fact?</text><text x="154.842" y="379.101" fill="#000" font-size="11" textLength="26.455">none</text><polygon points="99.776,256.721,336.45,256.721,348.45,268.721,336.45,280.721,99.776,280.721,87.776,268.721,99.776,256.721" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="222.113" y="292.479" fill="#000" font-size="11" textLength="17.083">yes</text><text x="99.776" y="272.989" fill="#000" font-size="11" textLength="236.674">dirty is not empty, and rounds &lt; max_rounds?</text><text x="74.323" y="265.498" fill="#000" font-size="11" textLength="13.453">no</text><rect x="53.27" y="773.269" width="329.686" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="63.27" y="796.097" fill="#000" font-size="12" textLength="309.686">each contradiction: the smallest environment of (false),</text><text x="63.27" y="812.441" fill="#000" font-size="12" textLength="208.97">or of X and (not X) folded as one AND</text><rect x="54.638" y="845.957" width="326.95" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="64.638" y="868.785" fill="#000" font-size="12" textLength="306.95">the core is the smallest over the node's contradictions;</text><text x="64.638" y="885.129" fill="#000" font-size="12" textLength="286.442">its status: within-budget, or cut and the caps it met</text><ellipse cx="218.113" cy="929.645" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="218.113" cy="929.645" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="218.113" y1="35" x2="218.113" y2="55" style="stroke:#181818;stroke-width:1;"/><polygon points="214.113,45,218.113,55,222.113,45,218.113,49" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="218.113" y1="107.688" x2="218.113" y2="127.688" style="stroke:#181818;stroke-width:1;"/><polygon points="214.113,117.688,218.113,127.688,222.113,117.688,218.113,121.688" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line 