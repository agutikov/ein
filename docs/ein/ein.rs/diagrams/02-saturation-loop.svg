<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:685px;height:580px;background:#FFFFFF;" width="685px" height="580px" viewBox="0 0 685 580" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><ellipse cx="294.2" cy="25" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="200.783,55,387.617,55,399.617,69.982,387.617,84.964,200.783,84.964,188.783,69.982,200.783,55" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="200.783" y="66.759" fill="#000" font-size="11" textLength="176.296">stopping at the first contradiction,</text><text x="200.783" y="81.741" fill="#000" font-size="11" textLength="186.834">and the KB written so far holds one?</text><text x="399.617" y="66.759" fill="#000" font-size="11" textLength="17.083">yes</text><ellipse cx="438.699" cy="69.982" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="438.699" cy="69.982" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><path d="M358.376,144.43 L358.376,163.136 L338.376,167.136 L358.376,171.136 L358.376,189.842 A0,0 0 0 0 358.376,189.842 L599.492,189.842 A0,0 0 0 0 599.492,189.842 L599.492,154.43 L589.492,144.43 L358.376,144.43 A0,0 0 0 0 358.376,144.43" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M589.492,144.43 L589.492,154.43 L599.492,154.43 L589.492,144.43" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="364.376" y="163.327" fill="#000" font-size="13" textLength="220.116">the enqueue pass where one is due,</text><text x="364.376" y="181.033" fill="#000" font-size="13" textLength="93.639">then the queue</text><rect x="250.023" y="148.964" width="88.353" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="260.023" y="171.792" fill="#000" font-size="12" textLength="68.353">closure step</text><polygon points="273.514,209.842,314.885,209.842,326.885,221.842,314.885,233.842,273.514,233.842,261.514,221.842,273.514,209.842" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="273.514" y="226.11" fill="#000" font-size="11" textLength="41.371">a firing?</text><text x="244.431" y="218.619" fill="#000" font-size="11" textLength="17.083">yes</text><text x="326.885" y="218.619" fill="#000" font-size="11" textLength="140.634">no: the closure is quiescent</text><rect x="63.952" y="243.842" width="129.369" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="73.952" y="266.67" fill="#000" font-size="12" textLength="109.369">hand it to the caller</text><rect x="16" y="370.641" width="225.273" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="393.469" fill="#000" font-size="12" textLength="205.273">return, the KB not marked saturated</text><ellipse cx="128.637" cy="452.985" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="128.637" cy="452.985" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="40.489,315.186,216.785,315.186,228.785,330.168,216.785,345.15,40.489,345.15,28.489,330.168,40.489,315.186" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="132.637" y="356.909" fill="#000" font-size="11" textLength="17.083">yes</text><text x="40.489" y="326.945" fill="#000" font-size="11" textLength="176.296">stopping at the first contradiction,</text><text x="40.489" y="341.927" fill="#000" font-size="11" textLength="166.22">and a fact it derived makes one?</text><rect x="283.273" y="243.842" width="352.978" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="293.273" y="266.67" fill="#000" font-size="12" textLength="332.978">boundary round: walk the parked candidates in rank order,</text><text x="293.273" y="283.014" fill="#000" font-size="12" textLength="207.025">admit the first whose guards all pass</text><polygon points="422.632,331.53,496.893,331.53,508.893,343.53,496.893,355.53,422.632,355.53,410.632,343.53,422.632,331.53" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="422.632" y="347.798" fill="#000" font-size="11" textLength="74.26">one admitted?</text><text x="393.55" y="340.307" fill="#000" font-size="11" textLength="17.083">yes</text><text x="508.893" y="340.307" fill="#000" font-size="11" textLength="13.453">no</text><rect x="324.807" y="365.53" width="117.669" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="334.807" y="388.358" fill="#000" font-size="12" textLength="97.669">it joins the queue</text><rect x="462.476" y="365.53" width="146.817" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="472.476" y="388.358" fill="#000" font-size="12" textLength="126.817">mark the KB saturated</text><ellipse cx="535.884" cy="447.874" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="535.884" cy="447.874" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="294.2,491.985,306.2,503.985,294.2,515.985,282.2,503.985,294.2,491.985" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="294.2,104.964,306.2,116.964,294.2,128.964,282.2,116.964,294.2,104.964" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="270.269,535.985,318.13,535.985,330.13,547.985,318.13,559.985,270.269,559.985,258.269,547.985,270.269,535.985" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;