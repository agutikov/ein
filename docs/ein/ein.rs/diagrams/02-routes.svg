agged</text><rect x="954.672" y="362.11" width="261.91" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="964.672" y="384.938" fill="#000" font-size="12" textLength="175.945">route 1, which visits root alone:</text><text x="964.672" y="401.282" fill="#000" font-size="12" textLength="241.91">a fork only adds, so every node is dead (L0)</text><polygon points="1365.677,379.146,1575.896,379.146,1587.896,401.619,1575.896,424.092,1365.677,424.092,1353.677,401.619,1365.677,379.146" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1365.677" y="390.905" fill="#000" font-size="11" textLength="210.22">-n N or --single over R or its minimal line,</text><text x="1365.677" y="405.887" fill="#000" font-size="11" textLength="200.441">or more candidates than --region-limit,</text><text x="1365.677" y="420.869" fill="#000" font-size="11" textLength="177.826">or a minimal question with ∅ in R?</text><text x="1336.594" y="398.396" fill="#000" font-size="11" textLength="17.083">yes</text><text x="1587.896" y="398.396" fill="#000" font-size="11" textLength="13.453">no</text><rect x="1226.582" y="434.092" width="234.19" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1236.582" y="456.92" fill="#000" font-size="12" textLength="131.041">the cube in layer order,</text><text x="1236.582" y="473.264" fill="#000" font-size="12" textLength="214.19">stopped when the question is decided</text><rect x="1485.848" y="434.092" width="224.097" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1495.848" y="456.92" fill="#000" font-size="12" textLength="204.097">the whole cube: route 2, the oracle's</text><polygon points="1470.787,492.78,1482.787,504.78,1470.787,516.78,1458.787,504.78,1470.787,492.78" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterli