,276.291,782.782,288.291,770.782,300.291,758.782,288.291,770.782,276.291" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="1055.166" y="167.268" width="206.889" height="69.032" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1065.166" y="190.096" fill="#000" font-size="12" textLength="167.653">rung 3: the blind enumerator:</text><text x="1065.166" y="206.44" fill="#000" font-size="12" textLength="185.101">every eligible relation, every slot,</text><text x="1065.166" y="222.784" fill="#000" font-size="12" textLength="186.889">over the program's object names</text><rect x="484.477" y="340.291" width="328.102" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="494.477" y="363.119" fill="#000" font-size="12" textLength="269.786">each candidate through the filters, in this order:</text><text x="494.477" y="379.463" fill="#000" font-size="12" textLength="308.102">a stored negation, a fact root holds, a repeat in the call</text><rect x="524.719" y="412.979" width="247.618" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="534.719" y="435.808" fill="#000" font-size="12" textLength="227.618">sort the survivors by text, deduplicate: H</text><ellipse cx="648.528" cy="480.324" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="648.528" cy="480.324" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="135.565" y1="148.603" x2="135.565" y2="183.603" style="stroke:#181818;stroke-width:1;"/><polygon points="131.565,173.603,135.565,183.603,139.565,173.603,135.565,177.603" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="691.589" y1="195.603" x2="641.914" y2="195.603" style="stroke:#181818;stroke-width:1;"/><line x1="641.914" y1="195.603" x2="641.914" y2="217.603" style="stroke:#181