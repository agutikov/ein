<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:814px;height:771px;background:#FFFFFF;" width="814px" height="771px" viewBox="0 0 814 771" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="274.2" y="123" width="62.864" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="279.2" y="148.432" fill="#000" font-size="14" textLength="52.864">a match</text><rect x="69.48" y="440" width="60.316" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="74.48" y="465.432" fill="#000" font-size="14" textLength="50.316">queued</text><rect x="277.52" y="272.5" width="56.228" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="282.52" y="297.932" fill="#000" font-size="14" textLength="46.228">parked</text><rect x="411.32" y="510" width="54.632" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="416.32" y="535.432" fill="#000" font-size="14" textLength="44.632">retired</text><rect x="33.23" y="580" width="58.804" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="38.23" y="605.432" fill="#000" font-size="14" textLength="48.804">applied</text><g class="start_entity" data-qualified-name=".start." id="ent0006" data-source-line="8"><ellipse cx="305.64" cy="16" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0008" data-source-line="9"><ellipse cx="396.64" cy="746" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="396.64" cy="746" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><!--link *start* to Matched--><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" id="lnk7" data-source-line="8" data-link-type="dependency"><path d="M305.64,26.4 C305.64,46.84 305.64,90.68 305.64,117.89" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Matched"/><polygon points="305.64,122.89,309.64,113.89,305.64,117.89,301.64,113.89,305.64,122.89" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="341.266" y="70.897" fill="#000" font-size="13" textLength="107.406">an enqueue pass:</text><text x="306.64" y="88.603" fill="#000" font-size="13" textLength="176.657">a full match, or a seeded one</text></g><!--link Matched to *end*--><g class="link" data-entity-1="ent0001" data-entity-2="ent0008" id="lnk9" data-source-line="9" data-link-type="dependency"><path d="M337.42,145.25 C414.04,150.12 602.64,174.05 602.64,291.5 C602.64,291.5 602.64,291.5 602.64,601 C602.64,697 455.402,733.365 412.612,741.965" style="stroke:#181818;stroke-width:1;" fill="none" id="Matched-to-*end*"/><polygon points="407.71,742.95,417.322,745.098,412.612,741.965,415.745,737.255,407.71,742.95" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="603.64" y="456.397" fill="#000" font-size="13" textLength="194.584">(binding key, guard set) in seen,</text><text x="617.414" y="474.103" fill="#000" font-size="13" textLength="167.037">or the key in fired: dropped</text></g><!--link Matched to Queued--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk10" data-source-line="10" data-link-type="dependency"><path d="M273.98,152.3 C228.37,166.13 145.59,198.62 108.64,260 C74.03,317.48 85.639,397.234 93.809,434.864" style="stroke:#181818;stroke-width:1;" fill="none" id="Matched-to-Queued"/><polygon points="94.87,439.75,96.869,430.106,93.809,434.864,89.052,431.804,94.87,439.75" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="109.64" y="288.897" fill="#000" font-size="13" textLength="149.864">its disjunct has no guard</text><text x="112.325" y="306.603" fill="#000" font-size="13" textLength="144.495">[enqueue, parked false]</text></g><!--link Matched to Parked--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk11" data-source-line="11" data-link-type="dependency"><path d="M305.64,163.28 C305.64,191.55 305.64,238.94 305.64,267.21" style="stroke:#181818;stroke-width:1;" fill="none" id="Matched-to-Parked"/><polygon points="305.64,272.21,309.64,263.21,305.64,267.21,301.64,263.21,305.64,272.21" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="308.856" y="207.897" fill="#000" font-size="13" textLength="136.812">its disjunct has guards</text><text x="306.64" y="225.603" fill="#000" font-size="13" textLength="141.245">[enqueue, parked true]</text></g><!--link Parked to Parked--><g class="link" data-entity-1="ent0003" data-entity-2="ent0003" id="lnk12" data-source-line="12" data-link-type="dependency"><path d="M334.19,278.38 C351.9,274.98 368.75,279.69 368.75,292.5 C368.75,305.31 356.81,310.963 339.1,307.563" style="stroke:#181818;stroke-width:1;" fill="none" id="Parked-to-Parked"/><polygon points="334.19,306.62,342.274,312.245,339.1,307.563,343.783,304.389,334.19,306.62" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="377.454" y="279.897" fill="#000" font-size="13" textLength="177.658">a guard with a nested absent</text><text x="386.639" y="297.603" fill="#000" font-size="13" textLength="159.289">fails: judged again when a</text><text x="374.75" y="315.309" fill="#000" font-size="13" textLength="183.066">watched relation grows [park]</text></g><!--link Parked to Queued--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk13" data-source-line="13" data-link-type="dependency"><path d="M277.03,310.63 C267.85,315.69 257.49,320.96 247.64,325 C203.13,343.25 179.62,323.07 143.64,355 C118.56,377.25 108.331,411.277 103.651,434.677" style="stroke:#181818;stroke-width:1;" fill="none" id="Parked-to-Queued"/><polygon points="102.67,439.58,108.357,431.539,103.651,434.677,100.513,429.97,102.67,439.58" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="147.383" y="378.897" fill="#000" font-size="13" textLength="172.588">every guard passes, and it is</text><text x="144.64" y="396.603" fill="#000" font-size="13" textLength="178.074">the first in rank order [admit]</text></g><!--link Parked to Retired--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk14" data-source-line="14" data-link-type="dependency"><path d="M314.5,312.77 C325.41,336.13 344.81,376.52 363.64,410 C383.86,445.98 407.301,482.147 422.771,505.407" style="stroke:#181818;stroke-width:1;" fill="none" id="Parked-to-Retired"/><polygon points="425.54,509.57,423.887,499.861,422.771,505.407,417.225,504.291,425.54,509.57" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="364.64" y="369.897" fill="#000" font-size="13" textLength="211.783">a monotone guard fails: it can only</text><text x="381.404" y="387.603" fill="#000" font-size="13" textLength="178.256">keep failing [retire]; or its key</text><text x="377.913" y="405.309" fill="#000" font-size="13" textLength="185.237">fired through another disjunct</text></g><!--link Retired to *end*--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" id="lnk15" data-source-line="15" data-link-type="dependency"><path d="M452.08,550.07 C457.42,558.77 462.92,569.46 465.64,580 C470.06,597.22 470.07,602.78 465.64,620 C453.2,668.25 420.808,713.827 406.148,732.887" style="stroke:#181818;stroke-width:1;" fill="none" id="Retired-to-*end*"/><polygon points="403.1,736.85,411.758,732.155,406.148,732.887,405.416,727.277,403.1,736.85" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/