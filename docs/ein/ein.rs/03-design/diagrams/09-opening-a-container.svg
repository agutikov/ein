<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:432px;height:1268px;background:#FFFFFF;" width="432px" height="1268px" viewBox="0 0 432 1268" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><ellipse cx="214.185" cy="25" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="101.567" y="55" width="225.237" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="111.567" y="77.828" fill="#000" font-size="12" textLength="205.237">Header::read: the magic, the version</text><rect x="127.013" y="166.799" width="174.345" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="137.013" y="189.627" fill="#000" font-size="12" textLength="154.345">refused: Malformed, Digest</text><ellipse cx="214.185" cy="239.98" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="214.185" cy="239.98" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="111.705,111.344,316.666,111.344,328.666,126.326,316.666,141.308,111.705,141.308,99.705,126.326,111.705,111.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="218.185" y="153.067" fill="#000" font-size="11" textLength="13.453">no</text><text x="111.705" y="123.103" fill="#000" font-size="11" textLength="204.962">flags are 0, and the BLAKE3 of the bytes</text><text x="111.705" y="138.085" fill="#000" font-size="11" textLength="201.585">after the header is the header's digest?</text><rect x="16" y="292.98" width="396.371" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="315.808" fill="#000" font-size="12" textLength="376.371">the section table: each entry's bounds; an unknown kind is skipped</text><rect x="61.12" y="349.324" width="306.13" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="71.12" y="372.152" fill="#000" font-size="12" textLength="286.13">META, and Meta::freshness(engine, sources, stdlib)</text><rect x="84.713" y="405.668" width="258.946" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="94.713" y="428.496" fill="#000" font-size="12" textLength="222.494">SYMBOLS, then FACTS: re-intern entry i,</text><text x="94.713" y="444.84" fill="#000" font-size="12" textLength="238.946">learn the live id of the file's i (tables::Maps)</text><rect x="139.931" y="478.356" width="148.509" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="149.931" y="501.184" fill="#000" font-size="12" textLength="128.509">PROGRAM's file names</text><rect x="93.143" y="534.701" width="242.086" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="103.143" y="557.529" fill="#000" font-size="12" textLength="222.086">PROV: push the file's derivation records</text><rect x="41.56" y="591.045" width="345.25" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="51.56" y="613.873" fill="#000" font-size="12" textLength="201.241">parse and load the stored program:</text><text x="51.56" y="630.217" fill="#000" font-size="12" textLength="325.25">the registries, and the loader's own records after the file's</text><rect x="51.79" y="663.733" width="324.79" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="61.79" y="686.561" fill="#000" font-size="12" textLength="183.781">COMMIT, where the file has one:</text><text x="61.79" y="702.905" fill="#000" font-size="12" textLength="304.79">the stored program's commitment, a saved file's node</text><rect x="136.769" y="791.876" width="154.833" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="146.769" y="814.704" fill="#000" font-size="12" textLength="126.385">return the loader's Kb;</text><text x="146.769" y="831.048" fill="#000" font-size="12" textLength="134.833">derived_dropped is true</text><ellipse cx="214.185" cy="875.564" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="214.185" cy="875.564" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="144.264,736.421,284.106,736.421,296.106,751.403,284.106,766.385,144.264,766.385,132.264,751.403,144.264,736.421" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="218.185" y="778.144" fill="#000" font-size="11" textLength="17.083">yes</text><text x="144.264" y="748.18" fill="#000" font-size="11" textLength="139.842">the file holds derived state,</text><text x="144.264" y="763.162" fill="#000" font-size="11" textLength="96.81">and it is not Fresh?</text><rect x="68.128" y="928.564" width="292.114" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="78.128" y="951.392" fill="#000" font-size="12" textLength="272.114">PRESENT: Kb::restore_fact for each believed fact,</text><text x="78.128" y="967.736" fill="#000" font-size="12" textLength="142.501">with its recorded primary</text><rect x="112.265" y="1001.252" width="203.841" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="122.265" y="1024.08" fill="#000" font-size="12" textLength="183.841">CLOSURE, where the file has one</text><rect x="132.647" y="1057.596" width="163.077" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="142.647" y="1080.424" fill="#000" font-size="12" textLength="143.077">Kb::rebuild_indexes_from</text><rect x="105.215" y="1113.94" width="217.941" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="115.215" y="1136.769" fill="#000" font-size="12" textLength="197.941">SOLUTIONS, where the file has one</text><rect x="181.643" y="1170.285" width="65.084" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="191.643" y="1193.113" fill="#000" font-size="12" textLength="45.084">Opened</text><ellipse cx="214.185" cy="1237.629" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="214.185" cy="1237.629" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="214.185" y1="35" x2="214.185" y2="55" style="stroke:#181818;stroke-width:1;"/><polygon points="210.185,45,214.185,55,218.185,45,214.185,49" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="214.185" y1="203.143" x2="214.185" y2="228.98" style="stroke:#181818;stroke-width:1;"/><polygon points="210.185,218.98,214.185,228.98,218.185,218.98,214.185,222.98" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="214.185" y1="141.308" x2="214.185" y2="166.799" style="stroke:#181818;stroke-width:1;"/><polygon points="210.185,156.799,214.185,166.799,218.185,156.799,214.185,160.799" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="328.666" y1="126.326" x2="340.666" y2="126.326" style="stroke:#181818;stroke-width:1;"/><polygon points="336.666,198.98,340.666,208.98,344.666,198.98,340.666,202.98" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="340.666" y1="126.326" x2="340.666" y2="272.98" style="stroke:#181818;stroke-width:1;"/><line x1="340.666" y1="272.98" x2="214.185" y2="272.98" style="stroke:#181818;stroke-width:1;"/><line x1="214.185" y1="272.98" x2="214.185" y2="292.98" style="stroke:#181818;stroke-width:1;"/><pol