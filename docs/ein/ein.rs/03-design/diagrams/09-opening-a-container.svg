nown kind is skipped</text><rect x="61.12" y="349.324" width="306.13" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="71.12" y="372.152" fill="#000" font-size="12" textLength="286.13">META, and Meta::freshness(engine, sources, stdlib)</text><rect x="84.713" y="405.668" width="258.946" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="94.713" y="428.496" fill="#000" font-size="12" textLength="222.494">SYMBOLS, then FACTS: re-intern entry i,</text><text x="94.713" y="444.84" fill="#000" font-size="12" textLength="238.946">learn the live id of the file's i (tables::Maps)</text><rect x="139.931" y="478.356" width="148.509" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="149.931" y="501.184" fill="#000" font-size="12" textLength="128.509">PROGRAM's file names</text><rect x="93.143" y="534.701" width="242.086" height="36.344" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="103.143" y="557.529" fill="#000" font-size="12" textLength="222.086">PROV: push the file's derivation records</text><rect x="41.56" y="591.045" width="345.25" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="51.56" y="613.873" fill="#000" font-size="12" textLength="201.241">parse and load the stored program:</text><text x="51.56" y="630.217" fill="#000" font-size="12" textLength="325.25">the registries, and the loader's own records after the file's</text><rect x="136.769" y="719.188" width="154.833" height="52.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="146.769" y="742.016" fill="#000" font-size="12" textLength="126.385">return the loader's Kb;</text><text x="146.769" y="758.36" fill="#000" font-size="12" textLength="134.833">derived_dropped is true</text><ellipse cx="214.185" cy="802.876" rx="11" ry="11" fill=