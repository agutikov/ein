# The regressions.
#
# One row per program and run that was once answered wrong, each holding the
# run to its right answer: the engine's answer today (`[case.now]`) is the one
# the definitions give (`[case.right]`), and a run that stops giving it fails
# the gate. `title` names the wrong answer the row guards against.
#
# Three tests read the file, each for one half of a row:
#
# - `ein-cli/tests/regressions.rs` runs every row's `[case.now]` through the
#   binary and compares what it answers with what the row records, field for
#   field; and holds, with no run, that `[case.now]` answers `[case.right]`
#   on every field `[case.right]` states (`ein_corpus::regressions`);
# - `ein-infer/tests/regressions_region.rs` recomputes every row's
#   `[case.region]` with the library and holds every field to it;
#   `EIN_BLESS=1` re-banks the blocks;
# - `ein-render/tests/id_order_invariance.rs` runs a row that states
#   `id_order` under a permuted interner, where its answer must not move.
#
# A witness is a `corpus/corpus.toml` entry, or a file under
# `corpus/fuzz_findings/` with `not_in_corpus` saying why it cannot be one,
# so every sweep of the corpus reads it too. The file is the format of
# `ein_corpus::regressions`, which any file of rows held to their recorded
# answers can use; one whose rows do not yet answer right is read by the
# same code, row for row (`ein-infer`'s example `held_answers`).
#
# ── Fields ────────────────────────────────────────────────────────────────────
#
#   id        the row's name, stable: the witness's or the run's
#   title     the wrong answer the row guards against
#   settings  `default`, or what the run needs beside the witness: a lever
#             (`lever: …`), a bound the read-out qualifies
#   decisions the decisions the right answer rests on, each a file under
#             `docs/decisions/`
#   witness   the program
#   id_order  { op, seed }: an `id_order_invariance` op and a seed under which
#             a permuted interner once moved the answer
#
#   [case.now] — the run that asks the row's question, and what it answers,
#     in `ein-summary/2`'s terms:
#     run       a corpus run name, `ein <run>` with the file elided: `solve`,
#               `solve --maximal`, `solve --minimal`; or a command's run that
#               is not a solve, `saturate --dump`, `render rules`, `kb save
#               {out}/again.einb`, which writes no summary: its answer is a
#               `refused` or an `error` line, or `answered`, and it states
#               nothing else below; or a run whose stdout is closed, whatever
#               its subcommand
#     line      all | minimal | maximal — which part of R its states are; not
#               stated on a command's run
#     stdout    `"closed"`: the run's stdout is a pipe whose reader closed
#               before the run started, so every write it makes meets no
#               reader; its answer is `signal` or `panicked`, exactly one, and
#               it states nothing else below
#     signal    `13`: the run with its stdout closed ended by SIGPIPE, with
#               nothing on stderr
#     panicked  the run with its stdout closed panicked: exit 101, and this is
#               the panic's message, the line of stderr after `thread 'main'
#               (…) panicked at …:`
#     container `true`: the run reads the witness saved as a `.einb`, `ein kb
#               save WITNESS DIR/<stem>.einb` first; `{FILE}` in a `refused`
#               or `error` line is the path the run was handed
#     answered  `true`: a command's run answered, exit 0 with nothing on
#               stderr, and with `container` its stdout is the same run's on
#               the witness, every number a line times masked and the lines
#               that say what the run read (`input:`, its size, `parse:`, `kb
#               load:`, `open:`) aside
#     refused   the run refuses the program: exit 1, and this is its stderr's
#               first line; nothing below is stated. `{out}` in it is the
#               run's scratch directory, as `run`'s `{out}` is
#     exit      `2`, beside `refused` on a solve's run: a usage refusal of
#               what the run was asked to write, the library answering the
#               program, so the row states its [case.region]
#     error     the run ended in an error before it answered: exit 1, and this
#               is its stderr's first line; nothing below is stated, and the
#               row states no [case.region]
#     exhausted, k (the states it lists)
#     empty     dead | owing, when the run established R empty
#     relations the candidates' relations, which a state's `(model …)` names
#     outside   the relations the run names outside the universe, the
#               summary's `root.hypgen.outside`, sorted; omitted when it names
#               none
#     models    each listed state's `(model …)`, sorted; for an owing empty R,
#               the frontier's — the open states
#     core      the unsat core the run reports, the summary's `region.core`,
#               sorted; stated exactly when `[case.right]` states a core, or
#               beside a `right` that is a refusal
#     nogoods   each member of N the run reports and its core, `[{ set = [...],
#               core = [...] }]`, each sorted and the list by set:
#               `--dump-answer`'s `nogoods.json`; stated exactly when
#               `[case.right]` states N's cores
#     nogoods_listed `true`: the run's N is compared on the sets `nogoods`
#               lists alone
#     core_status the status the run reports beside root's core, the
#               summary's `region.core_status`: `within-budget`, `cut-` and
#               the caps the search stopped at, or `none`; stated exactly when
#               `[case.right]` states one
#     stale     `{ in_r, nodes }`: how many of the nodes the run computed are
#               members of R holding a fact whose `absent` guard their own
#               fixpoint falsifies, and how many it computed, the summary's
#               `monotonicity.state`; stated exactly when `[case.right]`
#               states `stale`
#     others    how many members of R the run met and counts without listing
#               them, the summary's states with `listed = false`; stated
#               exactly when `[case.right]` states `others`
#     claim     the outcome of the program's `(solve … :expect …)` claim, the
#               summary's `claim.outcome`: `held`, `failed`, `not-checked`,
#               or `none`; stated exactly when `[case.right]` states `claim`,
#               or beside a `right` that is a refusal
#     queries   each query's answer in program order, `[{ classes = n, expect
#               = "…" }]`: the summary's `queries[i]`, its classes counted and
#               its `expect.outcome`; stated exactly when `[case.right]`
#               states `queries`, or beside a `right` that is a refusal. A run
#               whose `claim` or a query's `expect` is `failed` exits 1
#     refuted_by the rules root's `refuted by` row names, in the order
#               printed, the summary's `region.refuted_by`; stated exactly
#               when `[case.right]` states `refuted_by`
#     goal_text the sentences the read-out prints for a query's
#               `:goal-text`, one per row of a projection class, in the order
#               printed, read off stdout; stated exactly when `[case.right]`
#               states `goal_text`
#     printed   lines the run prints, `[{ file, label, line }]`: in `file`,
#               `stdout`, `answer.txt` (`--dump-answer DIR`'s, which the run
#               then writes) or a state file it writes, `models/NN.ein`, the
#               first line that begins past its indent with `label`, whole,
#               its trailing spaces aside, or empty where no line does; stated
#               exactly when `[case.right]` states `printed`, the same labels
#               in the same files
#
#   [case.right] — the answer the definitions give; any field it omits is not
#     claimed. `refused = true` says the answer is a refusal, which states no
#     verdict, `k` or model; `answered = true` that a command answers the
#     program, as another command does; `signal = 13` that a run whose stdout
#     is closed ends by SIGPIPE, with nothing on stderr. `verdict` is the
#     verdict word `[case.now]`'s states make (one state a Solution, more an
#     Ambiguity, none a Contradiction, or Open where every alive node owes).
#     `closes` names the relations a model is compared on — naming a relation
#     closes it, `:expect`'s rule, so `models = [[]]` with `closes = ["q"]` is
#     *one model with no q fact*; `open` is the same per open state. A
#     `qualifier` is a line the right read-out prints: with `outside`, its
#     `outside` row; with `core_status`, its `core search` row; the run's
#     stdout is held to print it. `core`, `nogoods`, `core_status`, `stale`,
#     `others`, `claim`, `queries`, `refuted_by`, `goal_text` and `printed`
#     are compared with `[case.now]`'s fields of the same name.
#
#   [case.region] — the witness's R, as `ein solve` describes it; absent where
#     `[case.now]` is a refusal or an error a solve's run ends in, or where
#     `[case.right]` is a refusal (a program refused at load has no R):
#     route     `tree and classes` (a monotone program whose root owes an
#               instance a licence takes: R's states by the obligation tree
#               and each state's class) | `state route` (a monotone
#               program's alive states) | `route 1` (the alive down-set, a
#               flagged program whose root is dead) | `route 2` (the cube,
#               for a program the static check flags)
#     monotone  the static check's verdict. `false` means the region is the
#               cube's, every node a fork of root, an assumption the engine
#               answers under and claims nothing beyond
#     k_s, k_c  |R| in states and in commitments
#     empty     `no-alive` | `all-owe`, exactly when k_s = 0
#     minimal, maximal   the lines, as commitments: each the candidates it
#               holds, sorted
#     stopped   `limit` | `budget`: the description stopped before R was
#               exhausted, so k_s and k_c are the lower bounds it reached,
#               `minimal` the line members it certified, and `maximal` is
#               empty, not known
#
# A witness that also carries an `:expect` states the same answer as its row.

