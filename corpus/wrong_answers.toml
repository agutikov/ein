# The wrong-answer register — M1e2 S1e2.1.1.
#
# One row per **witness** of every known wrong answer: a well-formed program,
# a run the CLI accepts, and an answer that is false under the definitions the
# user has ruled on (Q-M1e.6, Q-M1e.7 ruling A, the 2026-08-25 `Open` ruling).
# A case (W1–W12, C1 — `plans/m1e2_correctness/inventory.md`'s ids) has one row
# per witness, and a fix is done when **every** row of its case answers right.
#
# Every `wrong` block was **re-run**, not copied, on 2026-10-14 against
# `a44273e` (whose engine sources are `71dd237`'s, where the inventory was
# taken), release build, stdlib = the checkout. Every one reproduced.
#
# **Eight rows and thirteen twins were added on 2026-10-16** by S1e2.1a.10,
# taken at `8d1997f1` (engine sources `06d62a7c`'s) from the walk's last census
# (`plans/m1e2_correctness/p1e2.1a_the_solution_region/walk_census.md`): every
# cell the walk gets wrong under R, filed before S1e2.1a.5's switch removes the
# walk. Their `right` is R's maximal line, from the oracle or route 1. The same
# commit **reversed W9's two rows and W11/unsat-core-id-space's `right`**: under R
# a node is `sat(root ∪ C)` with nothing the search wrote (`solve_interface.md`
# § 0), so the default run is the wrong one and `-K` agrees with R. The old
# answer stays as a `[[case.right.alternative]]` under Q-M1e.7 ruling A.
#
# **The review (S1e2.1.7) reads the bundle built at `029ef6f`** on 2026-10-15
# (`python3 utils/review_bundle.py` → build/review/, 26 cases, 6 788 pages,
# 0 dangling links). Rebuilding at that commit gives the same pages, apart from
# wall-clock fields. W1 was read on a rebuild at `caef67a` (the same cases, plus
# each layer drawn), and each row's `[case.review]` names the bundle it was read
# on. **The review is paused after W1** (2026-10-15): the user's reading of W1
# became Q-M1e2.7, *the answer is a region R of the lattice*, and P1e2.1a
# rewrites the definitions before the other twelve cases are read against them.
#
# ── What holds it ─────────────────────────────────────────────────────────────
#
# `ein-cli/tests/wrong_answers.rs`, in the gate. For every row it runs the
# recorded runs through the `ein` binary, as a process, and compares the
# `--json-summary` it writes:
#
#   open       the wrong run still answers `wrong`, and every `control` and
#              `twin` still answers what it records. An open case that changes
#              answer is a fix nobody intended or a new wrong answer, and
#              either one is news.
#   fixed      the wrong run answers `right` (every field `right` states), and
#              the controls and twins still answer what they record.
#   not-wrong  the wrong run still answers `wrong` — which the review ruled is
#              the right answer — and the row carries the review's reason.
#
# Rows whose wrong answer is visible only under a permuted interner (W11) carry
# `wrong.id_order`; that half is held by `ein-render/tests/id_order_invariance.rs`,
# which owns the permutation, and the plain half here.
#
# ── Fields ────────────────────────────────────────────────────────────────────
#
#   id        `<case>/<witness>`, stable — the review bundle's directory name
#   case      the inventory's id;  title / class / settings: the case's, per row
#   owner     the P1e2.2 stage that fixes it;  question: the ids that carried it
#   witness   a `corpus/corpus.toml` entry, or a file under `corpus/fuzz_findings/`
#             with `not_in_corpus` saying why it cannot be one
#   status    open | fixed | not-wrong | merged:<id>
#   look_at   where the case goes wrong, as pages of a review-bundle run:
#             `root`, `root-writes`, `timeline`, `layer N`, `entering <facts>`,
#             `refuted`, `trace [step N]`, `answer`, `model N`, `summary`,
#             `events <kind>` — links on the case page, and the pointers the
#             fixing stage starts from (S1e2.1.6)
#
#   [case.wrong] / [case.control] / [[case.twin]]   an answer the engine gives
#     witness   (control, twin) another file; default: the row's witness
#     run       a corpus run name — `ein <run>` with the file elided, so
#               `"solve -e -L"` is `ein solve <witness> -e -L`
#     env       ["NAME=value", …] set for the run
#     why       (control, twin) what differs from the wrong run, in one line
#     exit      default 0 — a failed `:expect` is 1
#     verdict   Solution | Ambiguity | Contradiction | Open   (summary `verdict.type`)
#     k, exhausted
#     core      the unsat core, as a set; required on every `Contradiction`
#     closes    the relations a model is compared on — naming a relation
#               closes it, `:expect`'s rule, so `models = [[]]` with
#               `closes = ["q"]` is *one model with no q fact*, which
#               `:expect` cannot say (Q-M1e.13)
#     models    every recorded model's facts over `closes`, as a multiset
#     open      the same, per open state;  owes: each recorded state's owed total
#     debug_panic   in a build with debug assertions the run aborts (exit 101)
#                   and stderr carries this text; the other fields are release's
#     id_order  { op, seed } — the `id_order_invariance` op and seed under which
#               the answer moves (W11)
#
#   [case.right] — the answer the definitions give; any field it omits is not
#     claimed. `derived` says from what; `reading` names the ruling it assumes
#     when the case is contested, and `[[case.right.alternative]]` gives the
#     answer under each other reading. A `qualifier` is a sentence the right
#     read-out would add (W6).
#
#   [case.region] — the witness's R (M1e2 S1e2.1a.10, schema /2), as `ein solve`
#     describes it. `ein-infer/tests/register_region.rs` recomputes it with
#     `explore` and holds every field; `EIN_BLESS=1` re-banks the blocks.
#     route     `route 1` (a monotone program's alive down-set) | `route 2`
#               (the cube, for a program the static check flags)
#     monotone  the static check's verdict. `false` means the region is the
#               cube's, under *assumes a monotone lattice*: what R is there is
#               P1e2.1b's
#     k_s, k_c  |R| in states and in commitments
#     empty     `no-alive` | `all-owe`, exactly when k_s = 0
#     minimal, maximal   the lines, as commitments: each the candidates it
#               holds, sorted. This is R's vocabulary. `models` above is the walk's
#
#   [case.review] — the user's verdict (S1e2.1.7), absent until the row is read:
#     verdict   confirmed | right-answer-corrected | not-wrong | split | merge
#               (`not-wrong` here and `status = "not-wrong"` go together)
#     date      YYYY-MM-DD;  bundle: the commit the pages read were built at
#     note      the reviewer's sentence, quoted where it was the user's words
#
# ── What `:expect` keeps (T1e2.1.1.3) ─────────────────────────────────────────
#
# A witness that also carries an `:expect` keeps it stating **today's** answer
# until the fixing stage moves it — the rule `branching/15`+`16` already
# follow — so the expectation and the register cannot disagree while the case
# is open. The fixing stage moves both, and the row's status, in one commit.

schema = "ein-wrong-answers/2"

