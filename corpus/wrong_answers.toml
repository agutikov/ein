bundle  = "caef67a"
note    = "R = {∅, A, B, C, BC}, maximal line {A}, {B,C}. The user: \"Definitely 100% we can't throw out A because it's size is smaller than (B, C)\". No split: one defect in Q-M1e2.7's terms, a maximal node of R that is never recorded; layer 0 is the case where R's maximal line is {∅}."

