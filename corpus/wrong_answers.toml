[case.review]
verdict = "not-wrong"
date    = "2026-11-03"
bundle  = "3ee7796a"
note    = "The user's ruling of 2026-11-03 on Q-M1e.12, '(a) Fixture, + warning': the program is under-specified. `(relation co-located T T)` admits `(co-located Blue Color)`, and the engine does what the signature says, so R's 22 maximal states, each binding a colour to a type, are the right answer to the program as written. S1e2.2.10 is restated: retype `co-located` in branching/06 and /07, and warn when an untyped rung binds a type as an object; W1/branching-07 moves in its commit. The witness's header says so."

