settings = "default"
owner    = "S1e2.2.1"
question = ["Q-M1e.8"]
witness  = "examples/branching/15_lookahead_two_step_on.ein"
status   = "open"
look_at  = ["entering p(A)", "layer 2", "answer"]

[case.wrong]
run       = "solve -e"
verdict   = "Solution"
k         = 1
exhausted = true
