#
# ── What holds it ─────────────────────────────────────────────────────────────
#
# `ein-cli/tests/wrong_answers.rs`, in the gate. For every row it runs
# `[case.now]` through the `ein` binary, as a process, and holds the
# `--json-summary` it writes (`ein-summary/2`) to it, field for field. What a
# status means is data, checked without a run by `ein-corpus`'s
# `the_register_is_well_formed`:
#
#   open       `open_because` says why `now` is still not `right`. An open row
#              whose run changes answer is a fix nobody intended or a new wrong
#              answer, and either one is news.
#   fixed      `now` answers `right`, every field `right` states — the verdict
#              its states make, k, exhausted, the models over `closes` (and over
#              the candidates' relations, which is what a state's `(model …)`
#              names), the open states of an owing empty R, the relations
#              the read-out names outside the universe (schema /5), and the
#              core (schema /6).
#   not-wrong  the review ruled `wrong` the right answer, with its reason.
#   An open row whose review is `deferred` waits on a followup, its `owner`.
#
# Rows whose walk answer was visible only under a permuted interner (W11) keep
# `wrong.id_order` as the record of it; `ein-render/tests/id_order_invariance.rs`
# holds that a region run moves no line under that permutation.
#
# ── Fields ────────────────────────────────────────────────────────────────────
#
#   id        `<case>/<witness>`, stable — the review bundle's directory name
#   case      the inventory's id;  title / class / settings: the case's, per row
#   owner     the P1e2.2 stage that fixes it, or the stage that fixed it where
#             S1e2.1c.5 dropped its P1e2.2 stage (S1e2.1a.5; S1e2.1a.6 for W13),
#             or where the revisit did (S1e2.1.7: W12's, S1e2.1a.5); for a row
#             whose reading the user deferred, the followup (W8/features-07's:
#             F21; W10/alt-cap-shared's: F22). A case's rows of one status share an owner, and fixed rows
#             one per commit that fixed them;
#             question: the ids that carried it
#   witness   a `corpus/corpus.toml` entry, or a file under `corpus/fuzz_findings/`
#             with `not_in_corpus` saying why it cannot be one
#   status    open | fixed | not-wrong | merged:<id>
#   look_at   where the case goes wrong, as pages of a review-bundle run:
#             `root`, `root-writes`, `timeline`, `layer N`, `entering <facts>`,
#             `refuted`, `trace [step N]`, `answer`, `model N`, `summary`,
#             `events <kind>` — links on the case page, and the pointers the
#             fixing stage starts from (S1e2.1.6)
#
#   open_because  why an open row's `now` is still not `right`; required
#             exactly when the row is open
#
#   [case.now] — the region run that asks the row's question, and what it
#     answers, in `ein-summary/2`'s terms (M1e2 S1e2.1a.5):
#     run       a corpus run name, `solve`, `solve --maximal` or `solve --minimal`
#     line      all | minimal | maximal — which part of R its states are
#     refused   (schema /4, M1e2 S1e2.2.5) the run refuses the program: exit 1,
#               and this is its stderr's first line; nothing below is stated
#     exhausted, k (the states it lists)
#     empty     dead | owing, when the run established R empty
#     relations the candidates' relations, which a state's `(model …)` names
#     outside   (schema /5, M1e2 S1e2.2.8) the relations the run names outside
#               the universe, the summary's `root.hypgen.outside`, sorted;
#               omitted when it names none
#     models    each listed state's `(model …)`, sorted; for an owing empty R,
#               the frontier's — the open states
#     core      (schema /6, M1e2 S1e2.2.11) the unsat core the run reports,
#               the summary's `region.core`, sorted; stated exactly when
#               `[case.right]` states a core (W10's rows)
#
#   [case.wrong] / [case.control] / [[case.twin]]   an answer the walk gave —
#     since the switch the record of it, not run
#     by        walk (the default) | region — a recorded answer a region run
#               gave, with `why` saying how it was taken (W13's `wrong`, S1e2.1a.7)
#     witness   (control, twin) another file; default: the row's witness
#     run       a corpus run name — `ein <run>` with the file elided, so
#               `"solve -e -L"` is `ein solve <witness> -e -L`
#     env       ["NAME=value", …] set for the run
#     why       (control, twin) what differs from the wrong run, in one line
#     exit      default 0 — a failed `:expect` is 1
#     verdict   Solution | Ambiguity | Contradiction | Open   (summary `verdict.type`)
#     k, exhausted
#     core      the unsat core, as a set; required on every `Contradiction`
#     closes    the relations a model is compared on — naming a relation
#               closes it, `:expect`'s rule, so `models = [[]]` with
#               `closes = ["q"]` is *one model with no q fact*, which
#               `:expect` cannot say (Q-M1e.13)
#     models    every recorded model's facts over `closes`, as a multiset
#     open      the same, per open state;  owes: each recorded state's owed total
#     debug_panic   in a build with debug assertions the run aborted (exit 101)
#                   and stderr carried this text; the other fields are release's.
#                   W7's record: no test reads it since M1e2 S1e2.2.7 fixed W7
#     id_order  { op, seed } — the `id_order_invariance` op and seed under which
#               the answer moves (W11)
#
#   [case.right] — the answer the definitions give; any field it omits is not
#     claimed. `refused = true` (schema /4) says the answer is a refusal, which
#     states no verdict, `k` or model. `derived` says from what; `reading` names the ruling it assumes
#     when the case is contested, and `[[case.right.alternative]]` gives the
#     answer under each other reading. A `qualifier` is a sentence the right
#     read-out would add (W6). `outside` (schema /5, M1e2 S1e2.2.8) is the
#     relations the right read-out names outside the universe; with it, the
#     `qualifier` is that read-out's `outside` row, and `wrong_answers.rs`
#     holds the run's stdout to print it.
#
#   [case.region] — the witness's R (M1e2 S1e2.1a.10, schema /2), as `ein solve`
#     describes it; absent on a row whose `now` is a refusal. `ein-infer/tests/register_region.rs` recomputes it with
#     `explore` and holds every field; `EIN_BLESS=1` re-banks the blocks.
#     route     `state route` (a monotone program's alive states, describe's
#               route since M1e2 S1e2.1c.2) | `route 1` (the alive down-set,
#               a flagged program whose root is dead) | `route 2` (the cube,
#               for a program the static check flags)
#     monotone  the static check's verdict. `false` means the region is the
#               cube's, every node a fork of root: what a node is there is
#               open, F21's D2
#     k_s, k_c  |R| in states and in commitments
#     empty     `no-alive` | `all-owe`, exactly when k_s = 0
#     minimal, maximal   the lines, as commitments: each the candidates it
#               holds, sorted. This is R's vocabulary. `models` above is the walk's
#
#   [case.fixed] — what made a fixed row's `now` answer `right` (M1e2
#     S1e2.1a.7), stated exactly when the row is fixed; its case page says it:
#     commit    the commit, abbreviated;  by: the stage or task;  date YYYY-MM-DD
#
#   [case.review] — the review's verdict (S1e2.1.7), absent until the row is
#     read: the user's (W1's seven, 2026-10-15; W6, W8 and C1, 2026-11-03), or
#     the revisit's, the agent's first reading, where a stated criterion
#     decides the row (2026-11-03):
#     verdict   confirmed | right-answer-corrected | not-wrong | split | merge |
#               deferred (`not-wrong` here and `status = "not-wrong"` go
#               together; `deferred`, since 2026-11-03: the user deferred the
#               row's reading to a followup, and the row is `open` with that
#               followup, `F<n>`, as `owner`)
#     date      YYYY-MM-DD;  bundle: the commit the pages read were built at
#     note      the reviewer's sentence, quoted where it was the user's words
#
# ── What `:expect` keeps (T1e2.1.1.3) ─────────────────────────────────────────
#
# A witness that also carries an `:expect` keeps it stating **today's** answer
# until the fixing stage moves it, so the expectation and the register cannot
# disagree while the case is open. The fixing stage moves both, and the row's
