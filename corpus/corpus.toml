# The corpus — M1a S1a.0.1 T1a.0.1.1, re-based at S1a.10.3.
#
# One entry per `.ein` file the engine is exercised over, with the invocations
# it is exercised under. Format, the group vocabulary and the run-name
# convention: corpus/README.md. A file under examples/ or stdlib/ with no entry
# here fails a completeness check, so the corpus cannot silently miss one.
#
# `slow = true` keeps an entry out of the default sweep, and since S1a.9.0 it
# is a claim with a threshold behind it: an entry is slow when its declared
# runs cost **1 s or more together**, which is what `cost_ms` records. **Two
# entries are**, where three were until M1a T1a.7.2.0 made
# `branching/07_lookahead_off.ein` 2.8x cheaper and the flag stopped being
# true — which is what a measured flag is for. The rule, and why the sum
# rather than the slowest run, is corpus/README.md § `slow`; the measurement is
# docs/history/m1a_rust/measurements/corpus_cost.md and
# `utils/bench_env.sh python3 utils/corpus_cost.py` re-takes it.
#
# It used to say "any of its runs took 3 s or more in the T1a.0.1.1 probe of
# the whole matrix (CPython 3.14, 2026-08-17)" — a budget two engines out of
# date, which is how seventeen entries came to be flagged for costs between
# 11 ms and two minutes, `zebra2.ein` among them.
#
# Generated once from the tree; maintained by hand from here.
#
# schema 2 (S1a.10.3) renamed the `crash-parity` group, whose claim was about
# ein.py's exception classes, to `regression`, and split the compile-error
# fixtures out as `compile-negative`. A schema-1 manifest names groups that no
# longer exist, so the version is what refuses it rather than a stale entry
# silently dropping out of every selection.

schema = "ein-corpus/2"


# ── positive ────────────────────────────────────────────────

