# ── syntax probes ───────────────────────────────────────────
#
# The eighteen node-kind fixtures: one per shape the
# renderers draw and no puzzle contains. The manifest digests them under
# every view and every op. They are syntax probes rather than puzzles — several declare no relation and would
# not solve — so the runs are the two that read the forms.

[[entry]]
path   = "tests/text/01_unicode.ein"
group  = "positive"
runs   = ["test", "solve", "saturate"]
note   = "natural-language text in the three keywords that take a string, each with Cyrillic, CJK, an emoji and every escape a string reads, and a `:source` with a raw newline. `ein-cli/tests/natural_language_text.rs` holds the text byte for byte on every surface that carries it; the claim is about facts, which the text does not move."

[[entry]]
path   = "tests/imports/lower.ein"
group  = "positive"
runs   = ["test", "saturate"]
note   = "the lower of two theories: a request answered off a table, and an entry, `lower`, that closes its relations and names its rule. Imported by `upper.ein` and `upper_without_entry.ein`. Alone it has no request: R {∅}."

[[entry]]
path   = "tests/imports/upper.ein"
group  = "positive"
runs   = ["test", "saturate"]
note   = "the upper theory, over `lower.ein`, whose entry names the lower one's, `(upper-rule lower)`, so a selection of `upper` brings both whole. Alone it wants nothing: R {∅}."

[[entry]]
path   = "tests/imports/upper_without_entry.ein"
group  = "positive"
runs   = ["test", "saturate"]
note   = "`upper.ein` without the lower theory's entry name in its own. Loaded alone it holds both theories, its own import bringing the lower one; imported by its entry it brings them too, every import bringing its module whole, `02_nested_import_left_behind.ein`'s answer."

[[entry]]
path   = "tests/imports/01_nested_import_whole.ein"
group  = "positive"
runs   = ["test", "solve", "saturate"]
note   = "a theory built on a theory, imported by an entry that names the lower one's: both come whole, the request is answered, `(got a aa)`, and the loader prints nothing. The twin of `02`."

[[entry]]
path   = "tests/imports/02_nested_import_left_behind.ein"
group  = "positive"
runs   = ["test", "solve", "saturate", "saturate --dump"]
note   = "the same import through an entry that does not name the lower theory's. Every import brings its module whole, with its own imports, so the request is answered, `(got a aa)`, as the whole import `:as` answers it; a prototype's nested import, rebuilt small."

