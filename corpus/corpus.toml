# ── compile-negative: examples/broken/compile/ ──────────────
#
# The `CompileError` fixtures — files that parse and load and are then refused
# by the compiler. S1a.3.1's three left one by one: `empty_absent` and
# `unbound_head` to `broken/load/` at M1e2 S1e2.2.24, the loader refusing both,
# and `nested_or` at M1f S1f.5.21 (W62); `eq_in_a_macro_body`, S1f.5.21's, the
# last compile refusal a program reached, through a macro's body, left at M1f
# S1f.5.24 (W66), the loader holding a macro's expansion to the grammar's
# shapes. **No program reaches a compile refusal since**, so the group has no
# entry; `activator_arity` stays here as a `positive`. Their messages were not left unchecked: each
# has a `.expected` beside it, held byte-for-byte by
# `ein-infer/tests/compile_semantics.rs` (`examples/broken/compile/README.md`).
# `render rules` is deliberately not among the runs: it never reaches the
# compiler, so the cell would record an exit code and discard the output.

# M1e S1e.2.1 — `CO-H1`'s class. The grammar shape-pins four of the seven
# kernel meta-primitives (`00_ebnf.md` §2's *Kernel meta-primitives*
# block: `NotForm`, `NeqForm`, `AndForm`, `OrForm`); `eq`, `absent` and
# `false` are ordinary `GenericList`s, so their arity is checked by
# whatever reads them. Until S1e.2.1 that was a runtime `assert!` for
# `eq` from below and nothing at all from above. The four cells:


