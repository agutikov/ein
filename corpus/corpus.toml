[[entry]]
path   = "examples/zebra2-minus-15.ein"
group  = "positive"
runs   = ["solve", "saturate", "saturate --dump", "render rules", "render constraints"]
slow   = true
cost_ms = 7862
note   = "zebra2 with condition (15) removed — genuinely under-determined at 32 models, and M1d P1d.10 measured what proving that costs. All 32 are found by depth 3 (48 745 enterings, 25 s); the lattice does not end until **layer 22 and 17 204 592 enterings** — 24 min 56 s at -j16, `exhausted = true`, and not one further model. no solve -e: the -m 5 cut alone is 618 076 enterings, 416 s at --jobs 1 and 50 s at -j16, against a `slow` threshold of 1 s — so the exclusion is kept for a measured reason rather than for the 30-minute kill this note used to cite, which was a 2026-08-20 session and not this engine (M1d T1d.10.5.4). `solve` is 32 ms and stays. no render lattice: the same search at -m 3, which does finish — 27.8 s — and writes 11.6 MB of DOT that is the enumerator rather than a view. **M1d did not lift these; it priced them.** What would lift them is a cheaper argument for the same claim, and P1d.10 has one measured out of process at 171 nodes — S1d.10.6's to ship, not a run list's to assume. Slow since M1e2 S1e2.1a.5's switch, at 4.85 s together (`utils/corpus_cost.py`, 2026-10-18): bare `solve` describes R and its cells run to the default --region-budget, the slowest `solve` at 4.82 s. Re-taken 2026-11-03 at M1e2 S1e2.1c.2's default budget of 2^20 facts (`utils/bench_env.sh --cores PT python3 utils/corpus_cost.py`): 7.86 s together, the slowest `solve` at 7.83 s."

[[entry]]
path   = "examples/zebra2-minus-15-obligations.ein"
group  = "positive"
runs   = ["solve", "saturate", "saturate --dump", "render rules", "render constraints"]
slow   = true
cost_ms = 7874
note   = "M1d S1d.2.5 — the under-determined regime with no hypothesis rule: `zebra2-minus-15.ein` with the `(hrule guess …)` and the `:hrules` clause deleted, generated by the same script that makes the other three variants so that \"nothing else changed\" is checked rather than claimed. Its twin's run list, verbatim, and for the same reasons, now priced there (M1d T1d.10.5.4) — no `solve -e` (618 076 enterings at -m 5 and 17 204 592 before the lattice ends at layer 22, for the same 32 models depth 3 already had), no `render lattice`. What it banks is that the obligations rung finds **the same 32 models in the same 48 745 enterings** as the hrule path at `-m 3`, which is the milestone's completeness claim on the one corpus entry where the model set is large enough to be worth comparing. Slow since M1e2 S1e2.1a.5's switch, at 4.85 s together (`utils/corpus_cost.py`, 2026-10-18): bare `solve` describes R and its cells run to the default --region-budget, the slowest `solve` at 4.82 s. Re-taken 2026-11-03 at M1e2 S1e2.1c.2's default budget of 2^20 facts (`utils/bench_env.sh --cores PT python3 utils/corpus_cost.py`): 7.87 s together, the slowest `solve` at 7.84 s."

[[entry]]
path   = "examples/zebra2-obligations.ein"
group  = "positive"
runs   = ["solve", "saturate", "saturate --dump", "render rules", "render constraints", "render lattice", "solve -n 3", "solve --minimal", "solve -p -s", "solve --trace {out}/trace.md", "solve --dump-lattice {out}/lattice"]
levers = ["-y"]
slow   = true
cost_ms = 19067
note   = "M1d S1d.2.5 — the fixture the obligations rung needed, because every searching entry before it carried `:hrules`. `zebra2.ein` with the hypothesis rule and its activator clause deleted and nothing else: the five `(bijective *-loc)` declarations fan out into `total-owed` / `surjective-owed`, and the rung branches on what they owe. Layer 1 is **56 candidates against the blind enumerator's 3 734**, and the whole search is the hrule path's, entering for entering — 101 enterings, 2 layers, one model, the same one. Its run list is `zebra2.ein`'s so the two are comparable cell by cell. Slow since M1e2 S1e2.1a.5's switch, at 39.24 s together (`utils/corpus_cost.py`, 2026-10-18): bare `solve` describes R and its cells run to the default --region-budget, the slowest `solve -n 3` at 5.43 s. Re-taken 2026-11-03 at M1e2 S1e2.1c.2's default budget of 2^20 facts (`utils/bench_env.sh --cores PT python3 utils/corpus_cost.py`): 18.50 s together, the slowest `solve -n 3` at 9.42 s. Re-taken 2026-11-03 on M1e2 S1e2.1c.4's routes for the modes (`utils/bench_env.sh --cores PT python3 utils/corpus_cost.py`): 5.99 s together, the slowest `solve --trace` at 1.32 s; `solve -n 3` takes 114 ms, the obligation tree's 8 saturations, where it took 9.42 s. Re-taken 2026-11-05 at M1e2 S1e2.2.21 (`utils/bench_env.sh python3 utils/corpus_cost.py`): 19.07 s together, the slowest `solve --trace trace.md` at 9.33 s, a bare `solve` 566 ms: the cells that print every core the run visits (`--trace`, `--dump-lattice`, `render lattice`) pay Q-M1e2.15's (b), each fact a `forall` read folded into a core, and a run that prints none takes none."

[[entry]]
path   = "examples/zebra2.ein"
group  = "positive"
runs   = ["solve", "saturate", "saturate --dump", "render rules", "render constraints", "render lattice", "solve -n 3", "solve --minimal", "solve -p -s", "solve --trace {out}/trace.md", "solve --dump-lattice {out}/lattice", "solve --region-budget 1"]
levers = ["-y"]
slow   = true
cost_ms = 19083
note   = "the flagship, and what a stale flag looks like: `slow = true` on a file that solves in 16 ms and whose sixteen cells cost 260 ms together. Removed at S1a.9.0. **`solve -E 1` is the corpus's only budgeted run** and is here for M1e S1e.3.6 T4 (`TE-M4`): it exits **2**, the same code a usage error takes, and `no_cell_crashes` used to read that code as *the manifest names an argv the CLI refuses*. The cell is what makes the distinction exercised rather than merely written down. Slow since M1e2 S1e2.1a.5's switch, at 38.09 s together (`utils/corpus_cost.py`, 2026-10-18): bare `solve` describes R and its cells run to the default --region-budget, the slowest `solve -n 3` at 5.07 s. Re-taken 2026-11-03 at M1e2 S1e2.1c.2's default budget of 2^20 facts (`utils/bench_env.sh --cores PT python3 utils/corpus_cost.py`): 18.59 s together, the slowest `solve -n 3` at 9.44 s. Re-taken 2026-11-03 on M1e2 S1e2.1c.4's routes for the modes (`utils/bench_env.sh --cores PT python3 utils/corpus_cost.py`): 6.09 s together, the slowest `solve --trace` at 1.33 s; `solve -n 3` takes 114 ms, the obligation tree's 8 saturations, where it took 9.42 s. Re-taken 2026-11-05 at M1e2 S1e2.2.21 (`utils/bench_env.sh python3 utils/corpus_cost.py`): 19.08 s together, the slowest `solve --trace trace.md` at 9.33 s, a bare `solve` 566 ms: the cells that print every core the run visits (`--trace`, `--dump-lattice`, `render lattice`) pay Q-M1e2.15's (b), each fact a `forall` read folded into a core, and a run that prints none takes none."


# ── regression: examples/ein-bugs/ ──────────────────────────
#
# Inputs that once broke an implementation, kept as fixtures. The group has
# no uniform expectation and that is the point: seven of the ten answer on
# every run, one answers under `saturate` and is refused under `solve`, and
# two are refused outright. Which is which is the exit golden's to say
# (`ein-cli/tests/golden/corpus_exits.txt`), not this column's.

[[entry]]
path   = "examples/ein-bugs/alive-empty-phase1.ein"
group  = "regression"
runs   = ["solve"]
note   = "M1e D1 — the alive-∅ record site at phase 1. `compute_alive` writes the kill cache into root *after* `:1091`'s consistency check, and `:1118` recorded what it wrote: the model re-saturated to `Contradiction`. **Fixed by M1e S1e.3.1 (`CO-M1`)**: `record_node` re-saturates before recording, the file answers `Contradiction k = 0`, and its `:expect (false)` states that. Under `-K` it still answers `Solution`, which is M1e2's W9. Goal moved to `is-a` because a model with an empty goal extent is unstatable — Q-M1e.13."

[[entry]]
path   = "examples/ein-bugs/alive-empty-interlayer.ein"
group  = "regression"
runs   = ["solve"]
note   = "M1e D1, the same defect between layers, whose trigger is the singleton writeback rather than the kill cache; fixed by M1e S1e.3.1 (`CO-M1`). Under R it answered four states. **Refused since M1e2 S1e2.2.5** (*forbid*): `totality` concludes (false) from (absent (p A)) over p, which the hrule proposes, so `solve` exits 1 (`W1/alive-empty-interlayer`)."

[[entry]]
path   = "examples/ein-bugs/naf-upward-closure.ein"
group  = "regression"
runs   = ["solve", "saturate"]
note   = "M1e Q-M1e.9 / S1e.2.3 — `dead` is **not** upward-closed under `absent`: `{(p A)}` dies while `{(p A), (q A)}` is alive, so the walk never generated the maximal state. **Refused since M1e2 S1e2.2.5** (*forbid*, ruled 2026-11-02): `bad` concludes (false) from (absent (q ?x)) over q, which a commitment can extend, so `solve` exits 1 naming it and `saturate` still saturates. W3's witness of the refusal (`W3/naf-upward-closure`), and the library-level fixture the read-out's dead-hole line is held on. Goal on `is-a` because the walk's model had no `p` fact — Q-M1e.13."

[[entry]]
path   = "examples/ein-bugs/alive-set-fresh-name.ein"
group  = "regression"
runs   = ["solve", "test"]
note   = "M1e S1e.3.3 / `ST-M1` — the **M1 alive-set invariant** broken on purpose, and the program on which breaking it cost a model: M1e2's W4 (`W4/alive-set-fresh-name`), fixed by S1e2.2.4 on 2026-11-04. `spawn` asserts `(p ?b Z)` and no fact names `Z`. The candidate objects were the KB's names, so no candidate was about `Z`: the walk said `k = 0, exhausted = true` and the region R = {∅}, where `{(q A Z), (q B Z)}` is the maximal state. A rule's constant is a name of the program (Q-M1e.21 (b), ruled 2026-10-16), the candidates are seeded with it, and R is four states, the `-declared` twin's. `:expect` states that R."

