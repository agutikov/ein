note   = "06_friends_tables' monotone twin, with total-owed: everyone must sit. R is 8 isolated seatings and no holes, one projection class by table; the walk recorded all 8 (M1e2 P1e2.1a, 2026-10-16), and route 1 exhausts R in the `solve` cell. No oracle cell: 19 candidates is over `ein oracle`'s default --region-limit 16, as for its twin."

