# ── regression: examples/ein-bugs/ ──────────────────────────
#
# Inputs that broke an implementation, kept as regression fixtures. The group
# has no uniform expectation, and that is the point: some answer on every run,
# some answer under `saturate` and are refused under `solve`, some are refused
# outright. Which is which is the exit golden's to say
# (`ein-cli/tests/golden/corpus_exits.txt`), not this column's.

[[entry]]
path   = "examples/ein-bugs/alive-empty-phase1.ein"
group  = "regression"
runs   = ["solve"]
note   = "the record site at phase 1: a kill cache written into root after its consistency check would record a model that re-saturates to a contradiction. A node is `sat(root ∪ C)` with nothing the search wrote, so root stores no `(not (p A))`, `totality` never fires, and R is {∅}, which the `:expect` states (alive-empty-phase1-K, alive-empty-phase1)."

[[entry]]
path   = "examples/ein-bugs/alive-empty-interlayer.ein"
group  = "regression"
runs   = ["solve"]
note   = "the same record-site defect between layers, whose trigger is the singleton writeback rather than the kill cache. **Refused** (*forbid*): `totality` concludes (false) from (absent (p A)) over p, which the hrule proposes, so `solve` exits 1 (`alive-empty-interlayer`)."

[[entry]]
path   = "examples/ein-bugs/closed-and-owing.ein"
group  = "regression"
runs   = ["solve", "saturate", "render rules"]
note   = "the refusal of an obligation on a closed relation (*\"obligated relation can't be __closed__ also\"*, the user): `(total-owed r is-a)` owes `r`, which `infer-closure` closes. Every command refuses it, one line, exit 1."

[[entry]]
path   = "examples/ein-bugs/naf-upward-closure.ein"
group  = "regression"
runs   = ["solve", "saturate"]
note   = "`dead` is **not** upward-closed under `absent`: `{(p A)}` dies while `{(p A), (q A)}` is alive. **Refused** (*forbid*, Q-M1e2.5): `bad` concludes (false) from (absent (q ?x)) over q, which a commitment can extend, so `solve` exits 1 naming it while `saturate` saturates. The refusal's witness (`naf-upward-closure`), and the library-level fixture the read-out's dead-hole line is held on. Its goal is on `is-a`; an empty goal extent is one a claim states like any other (Q-M1e.13)."

[[entry]]
path   = "examples/ein-bugs/alive-set-fresh-name.ein"
group  = "regression"
runs   = ["solve", "test"]
note   = "the **alive-set invariant** broken on purpose (`alive-set-fresh-name`): `spawn` asserts `(p ?b Z)` and no fact names `Z`. Candidate objects drawn from the KB's names alone would hold no candidate about `Z` and give R = {∅}, where `{(q A Z), (q B Z)}` is the maximal state. A rule's constant is a name of the program (Q-M1e.21), the candidates are seeded with it, and R is four states, the `-declared` twin's. `:expect` states that R."

[[entry]]
path   = "examples/ein-bugs/alive-set-fresh-name-declared.ein"
group  = "regression"
runs   = ["solve", "test"]
note   = "the control for the entry above: the same rules and constraints plus `(seen Z)`, one fact over a relation nothing else mentions, which does nothing but put `Z` in a fact at root. Its R is four states, `{(q A Z), (q B Z)}` the maximal; the candidates are seeded with a rule's constants, so the two describe one R (`ein-infer/tests/alive_invariant.rs`)."

[[entry]]
path   = "examples/ein-bugs/minimal-line-stated-obligation.ein"
group  = "regression"
runs   = ["solve", "saturate"]
note   = "a program that states `(total-owed likes is-a)` and whose root discharges it, so R is {∅}, beside its control, which states no obligation. Describe's minimal-line row reads `1 state — ∅` on both, with `region.minimal.trivial` true on both (`ein-cli/tests/region_modes.rs`): the row reads whether a node the run met owes, not what the program states."

[[entry]]
