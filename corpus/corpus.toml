[[entry]]
path   = "examples/word_problems/before.ein"
group  = "positive"
runs   = ["solve", "test", "saturate"]
note   = "a witness kept with today's answer, the user's question: *Bob gave Alice 2 apples. Now Bob has 5. How many apples did Bob have before?* The right answer is 7; the theory reads *gave* in one direction of time and plans from no earlier moment to a later one, so no request reaches the calculator, the question has no row and `gaps` names `(not-stated (amount Bob apples t0))`, which is its claim: the claim states today's answer, not the right one."

[[entry]]
path   = "examples/word_problems/bob1.ein"
group  = "positive"
runs   = ["solve", "test", "saturate"]
note   = "a transfer read as a subtraction: *Bob has 5 apples. He gave 2 to Alice. How many apples does Bob have?* 3, search-free."

[[entry]]
path   = "examples/word_problems/boxes12.ein"
group  = "positive"
runs   = ["solve", "test", "saturate", "solve --trace {out}/trace.md"]
note   = "the two-step problem, the user's: *Bob has 5 apples, Alice has 7. A box holds 3. How many boxes do they need?* 5 + 7 = 12, 12 / 3 = 4, the two requests derived in that order and nothing else asked of the calculator. A reading of *need* is always owed (`readings`), so R is two states, a reading each, and one class, 4: two solutions and one answer, the corpus witness of *answer correct, solution not necessarily*; neither state's trace has a step, the answer being root's `need-exact`, *whatever need means*. The trace cell writes the plan as sentences."

[[entry]]
path   = "examples/word_problems/boxes13.ein"
group  = "positive"
runs   = ["solve", "test", "saturate", "solve --trace {out}/trace.md"]
note   = "the remainder variant: *Bob has 5 apples, Alice has 8. A box holds 3. How many boxes do they need?* 13 = 3 × 4 + 1, and *need* has two readings the problem does not choose between; a reading is always owed (`readings`), so R is two states and two classes, 4 boxes and 1 apple unpacked under whole-only, 5 boxes under pack-all, root owing the reading. The trace cell writes each state's answer under its reading."

[[entry]]
path   = "examples/word_problems/bystander.ein"
group  = "positive"
runs   = ["solve", "test", "saturate"]
note   = "asked about someone the event did not touch: Carol still has 9."

[[entry]]
path   = "examples/word_problems/contra.ein"
group  = "positive"
runs   = ["solve", "test", "saturate"]
note   = "a problem that contradicts itself, *Bob has 5 apples. He gave 7 to Alice.*: a flag, then `(false)`, root dead and R empty, the unsat core the two sentences, the question, the model's assumption and two table rows; its claim is `(solve :expect (false))`."

[[entry]]
path   = "examples/word_problems/gap.ein"
group  = "positive"
runs   = ["solve", "test", "saturate"]
note   = "the user's missing quantity: *Bob has 5 apples. He gave 2 to Alice. How many apples do they have together?* Bob's 3 is answered, *together* has no row, and `(unanswered (together …) (amount Alice apples t0))` names the gap; search-free and monotone, by `gaps`' `absent`."

[[entry]]
path   = "examples/word_problems/gap_assume.ein"
group  = "positive"
runs   = ["solve", "test", "saturate"]
note   = "the gap closed by an assumption, `(assumed (amount Alice apples t0) z)`: 5, and `rests-on` says what the answer rests on."

[[entry]]
path   = "examples/word_problems/gap_fact.ein"
group  = "positive"
runs   = ["solve", "test", "saturate"]
note   = "the gap closed by a sentence, *Alice has 4 apples*: 3, 6 and 9."

[[entry]]
path   = "examples/word_problems/gaps.ein"
group  = "positive"
runs   = ["saturate", "render rules"]
note   = "a theory module, imported by the gap and kinds problems: a wanted quantity with no value and nothing to compute it from is `not-stated`, by `absent`. It declares no solve run: alone it states no problem, and a solve of the module, which brings `words` whole, is R {∅}."

