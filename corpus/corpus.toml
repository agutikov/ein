note   = "kinds with the assumption written, Alice has no apples: 5, resting on it."

[[entry]]
path   = "examples/word_problems/kinds_full.ein"
group  = "positive"
runs   = ["solve", "test", "saturate"]
note   = "both kinds stated for both: 8 apples, and the pears are never wanted."

[[entry]]
path   = "examples/word_problems/kinds_listed.ein"
group  = "positive"
runs   = ["solve", "test", "saturate"]
note   = "the apples-and-pears problem with *what is not listed is zero* adopted (`listed_is_all`): Alice has no apples by the assumption, so 5, and `rests-on` names what the answer rests on; without the import it is a gap (kinds.ein). States `(solve :no-hypothesis (has))`, so that `has` is no hypothesis relation."

[[entry]]
path   = "examples/word_problems/listed_is_all.ein"
group  = "positive"
runs   = ["saturate", "render rules"]
note   = "a module a problem imports to adopt *what is not listed is zero* for `has`: for every holder and kind the `has` sentences name at a moment with no amount listed, `(assumed (amount WHO KIND MOMENT) z)`, resting on `(adopted listed-is-all has)`; it reads `absent` over `has`, so it is kept apart from `words`. It declares no solve run, as gaps.ein: alone it states no problem, and a solve of the module, which brings `words` whole, is R {∅}."

