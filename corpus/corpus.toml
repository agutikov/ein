note   = "2026-08-20 — an `adjacent-via` over an irreflexive `?S` is not satisfied from the SAME house. `disjunctive-prune-{fwd,bwd}` used to exempt `h_other = h1` with a `(neq …)` premise the following `(absent (?S …))` already decided, and the determinate zebras never showed it; `zebra2-minus-15.ein` reported 55 models against 32 real ones. Contradiction at root, 0 enterings; with the guard back it answers Ambiguity k=4."

[[entry]]
path   = "examples/features/10_expect.ein"
group  = "positive"
runs   = ["solve", "solve -e", "test", "saturate", "saturate --dump", "render rules", "render constraints", "render lattice"]
note   = "M1c S1c.1.2 — the `:expect` form. The only entry in the corpus whose `solve` runs check a claim the *file* makes rather than one a golden makes: exit 1 if the model is not the one it names. Relation-closure is what it demonstrates — `next-to`'s listed extent is complete, so a surplus mirrored edge fails it, which is the case a per-fact assertion cannot catch. `test` since S1c.1.3: the same claim through the subcommand that reports it as a status code rather than as a line under a solution table."

[[entry]]
path   = "examples/features/11_expect_ambiguity.ein"
group  = "positive"
runs   = ["solve -e", "test", "saturate", "saturate --dump", "render rules", "render constraints", "render lattice"]
note   = "M1c S1c.1.2 — `:expect (or …)`, the k>1 verdict. **No plain `solve`**: it stops at the first model and reports k=1, which is correct and is not this fixture's question — an `(or …)` expectation is a claim about the *exhausted* search. The failure says so rather than leaving a bare count mismatch. Swapping the two `(model …)` blocks leaves it passing: the disjuncts compare as a set. `test` needs no `-e` for the same claim (S1c.1.3): exhausting is what that subcommand does, which is the difference between being asked for an answer and being asked whether a claim holds."

[[entry]]
path   = "examples/features/12_expect_false.ein"
group  = "positive"
runs   = ["solve", "solve -e", "test", "saturate", "saturate --dump", "render rules", "render constraints", "render lattice"]
note   = "M1c S1c.1.2 — `:expect (false)`, the k=0 verdict, spelled with the kernel's own ⊥ rather than an invented word. Three pigeons, two holes, and the chain forced rather than searched, for two reasons its header carries: the blind version is Ambiguity k=6 rather than a contradiction, because a state leaving one pigeon nowhere is *complete* in an open world (M1d's subject), and it also has several equally small unsat cores, which is corpus/fuzz_findings/unsat-core-id-space.md reached from the corpus for the first time."

