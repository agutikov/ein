note   = "a debt one candidate pays alone and two others pay together: Ann's one witness, `(fed Ann Soup)`, is in the closure of `(orders Ann)` and of no other single candidate, and `{(cooks Bob), (shops Cat)}` derives it by a rule that reads both. The program that breaks the claim that a witness a candidate implies may stand for that candidate: that member of R holds none of the candidates whose closure holds the witness. L5 does not license the debt, every mode takes the state route, and R is five states, the oracle's (`ein-infer/tests/region.rs`)."

