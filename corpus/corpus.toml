[[entry]]
path   = "stdlib/arith.ein"
group  = "stdlib"
runs   = ["solve", "saturate", "render rules", "render constraints"]
note   = "M1f S1f.6.3 (2026-11-11): school arithmetic over `std.digits`' tables, computed by saturation alone; it begins with addition. A request fact `(add X Y)` is answered by `(sum-of X Y S)` over nested numbers `(n PREFIX DIGIT)`. S1f.6.4 added `(sub X Y)`, answered by the two numbers of `(diff-of X Y D R)`, and `(cmp X Y)`, answered by `(cmp-of X Y lt|eq|gt)`. S1f.6.5 added `(mul X Y)`, answered by `(product-of X Y P)`, the school method from the multiplier's top digit. S1f.6.6 added `(div X Y)`, answered by `(quot-of X Y Q R)`, long division with the quotient's digit by bisection, and division by zero as a flag and `(false)` from it. No rule joins two facts on a number (`ein-infer/tests/arith_theory.rs` on the text, `arith_batch.rs` on the matcher's count), and `arith`, the closing rule, closes every relation and names every rule. The module alone states no request: its closing rule fires and nothing else."

