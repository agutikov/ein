path   = "examples/lattice/14_seats_nothing_proposes.ein"
group  = "positive"
runs   = ["solve", "saturate", "render lattice", "solve --single", "solve --maximal", "oracle --dump {out}/region"]
note   = "06_friends_tables_everyone_sits made small enough for the oracle, 12 candidates: everyone owes a seat, the duo fits only the big table, and the two small-table seats that can pay Cat's and Dan's debts are proposed by nothing and written by no rule. L9 licenses those two debts, their alternatives the big table's two seats; the oracle holds the licence at all 4 096 nodes (`ein-infer/tests/unheld.rs`). R is four seatings."

[[entry]]
