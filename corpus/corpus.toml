note   = "the user's seating example of 2026-10-16: two groups of friends (2, 3) at two tables (2, 3 seats), one guest avoiding the air-conditioner, and a group that does not fit goes elsewhere — the obligation is the group's. Not monotone by construction (an obligation trigger): R is 21 isolated nodes with 166 holes, and the walk recorded 8 of them. 19 candidates: the `solve` cell records route 2 stopping at --region-limit 16 with all 21 found, and since M1e2 S1e2.1a.5 there is no oracle cell, because `ein oracle` refuses the 2^19 cube at its default limit (exit 2) — the walk's `--dump-region` cell recorded the same refusal as a note. Slow since M1e2 S1e2.1a.5's switch, at 5.05 s together (`utils/corpus_cost.py`, 2026-10-18): bare `solve` describes R and its cells run to the default --region-budget, the slowest `render lattice` at 2.57 s. Re-taken 2026-11-03 at M1e2 S1e2.1c.2's default budget of 2^20 facts (`utils/bench_env.sh --cores PT python3 utils/corpus_cost.py`): 5.20 s together, the slowest `render lattice` at 2.69 s."

