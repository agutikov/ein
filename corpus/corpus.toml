note   = "Refused at the parse since M1f S1f.5.5's swap, at its first `:rule` (S1f.5.11's default: no keyword pair inside a term or a nested fact), and moved here from `examples/ein-bugs/` (Q-M1f.2 (a)), its `.expected` the parse report; until then: M1e2 S1e2.3.2 (P1) — a keyword pair *below* an undeclared form, `(tracex (step s1 :rule … :using … :derives …) …)`. The loader accepts it as an ontology fact; `render constraints` and `render program` both exited 101 in `dot_util::value_label`, *not a value node: KwPair*, because `constraints.rs` filters a form's own keyword pairs one level deep and `ir_dot`'s ontology path filters none. Fixed on the user's ruling (a) of 2026-11-03: `value_label` labelled a keyword pair `:key value` for every caller, until M1f S1f.5.11's T1f.5.11.2 retired the arm, no value holding a pair since the swap. Found by `utils/fuzz_engine.py` 2026-08-23 (`corpus/fuzz_findings/kwpair-below-the-filter.md`); banked here so `corpus_shapes.rs` and `dot_wellformed.rs` run every view over it."

