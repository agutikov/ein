# M1e S1e.2.1 — `CO-H1`'s class. The grammar shape-pins four of the seven
# kernel meta-primitives (`00_ebnf.md` §2's *Kernel meta-primitives*
# block: `NotForm`, `NeqForm`, `AndForm`, `OrForm`); `eq`, `absent` and
# `false` are ordinary `GenericList`s, so their arity is checked by
# whatever reads them. Until S1e.2.1 that was a runtime `assert!` for
# `eq` from below and nothing at all from above. The four cells:

[[entry]]
path   = "examples/broken/compile/eq_arity_low.ein"
group  = "compile-negative"
runs   = ["solve", "saturate"]
note   = "`CO-H1` itself — `(eq ?x)` panicked the process, exit 101, with a parity note for a message. The only finding in the review reproduced against the release binary whose fix is a refusal."

[[entry]]
path   = "examples/broken/compile/eq_arity_high.ein"
group  = "compile-negative"
runs   = ["solve", "saturate"]
note   = "The worse half: `(eq ?x A B)` loaded, compiled, **fired** and exited 0, because `guard_holds` read `args[0..2]` and dropped the tail. A three-way equality silently evaluated as a two-way one."

[[entry]]
path   = "examples/broken/compile/absent_arity_zero.ein"
group  = "compile-negative"
runs   = ["solve", "saturate"]
note   = "`(absent)` fell through to the ordinary relation path and retired the rule in silence, where its sibling `empty_absent.ein` — `(absent ?x)` — has named that exact hazard in a CompileError since S1.22.0."

[[entry]]
path   = "examples/broken/compile/absent_arity_high.ein"
group  = "compile-negative"
runs   = ["solve", "saturate"]
note   = "`(absent A B)` dropped everything past the first argument, so a two-subject negation fired as a one-subject one. The pair with `eq_arity_high.ein`: two of the twenty-one cells the S1e.1.6 sweep found answering wrongly with a success exit code."


[[entry]]
path   = "examples/broken/compile/activator_arity.ein"
group  = "positive"
runs   = ["solve", "saturate", "saturate --dump", "render rules"]
note   = "S1a.3.1's fourth compile-error fixture, and the one that is `positive` rather than `compile-negative`: `Engine._activators_for`'s S1.22.0 arity filter drops `(pairwise r)` before the compiler sees it, so the rule never runs and the file solves. That it derives nothing is the assertion — until S1.22.0 the mismatch dropped every premise and the rule fired unconditionally."


