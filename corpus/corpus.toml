[[entry]]
path   = "stdlib/math/arith.ein"
group  = "stdlib"
runs   = ["solve", "saturate", "render rules", "render constraints"]
note   = "arithmetic itself, what every base shares: `z`, declared as a relation of no argument so that it has one full name, and the division by zero's flag `(division-by-zero REQUEST)` with `division-by-zero-is-false`, both moved from `std.math.decimal-arith`. `arith`, the closing rule, closes the flag and names the rule. The module alone states no request: its closing rule fires and nothing else."

[[entry]]
path   = "stdlib/math/binary-arith.ein"
group  = "stdlib"
runs   = ["solve", "saturate", "render rules", "render constraints"]
note   = "school arithmetic on binary numerals, `std.math.decimal-arith`'s twin: `(bin-add X Y)` answered by `(bin-sum-of X Y S)`, `bin-sub`, `bin-cmp`, `bin-mul` and `bin-div` likewise, `bin-let` a named constant. 57 relations and 14 rules of its own, a product's row and the division of base two, one subtraction a quotient bit, and `bin-operand-undeclared`; the 77 shared rules are `std.math.positional`'s, activated by one call of its macro in `binary-arith`, the closing rule. Nothing of decimal is loaded. The module alone states no request: its closing rules fire and nothing else."

[[entry]]
path   = "stdlib/math/binary.ein"
group  = "stdlib"
runs   = ["solve", "saturate", "render rules", "render constraints"]
note   = "the binary numeral, `(b2 PREFIX BIT)`, on `std.math.decimal`'s pattern: `bin-named`, and the check an operation asks of a numeral it takes, `(bin-check N N)` walked a place a firing to `(bin-valid N)`, four rules flagging `(not-binary NUMERAL THING)` and `not-binary-is-false` deriving `(false)` (Q-M1f.404). `binary`, the closing rule, closes every relation and `bin-nz`, labels `z` valid, and names every rule and `arith`. The module alone states no request: its closing rules fire and nothing else."

[[entry]]
path   = "stdlib/math/bits.ein"
group  = "stdlib"
runs   = ["solve", "saturate", "render rules", "render constraints"]
note   = "a library of facts, binary's four tables, `bin-fa` 8 rows, `bin-fs` 8, `bin-cl` 12 and `bin-nz` 1, generated beside `std.math.digits` and not edited by hand (`ein-ir/tests/digit_tables.rs` holds every row to Rust's integers). No rule; its written `(__closed__ R)` facts close the tables, so R is {∅}."

[[entry]]
path   = "stdlib/math/convert.ein"
group  = "stdlib"
runs   = ["solve", "saturate", "render rules", "render constraints"]
note   = "decimal to binary and back as requests, `(to-bin X)` answered by `(bin-of X B)` and `(to-dec B)` by `(dec-of B X)`: eleven rules over decimal's tagged division and addition walk and binary's strip, turn and top-first. `convert`, the closing rule, closes every relation, names every rule and both bases' entries. Moved from the binary-arithmetic examples' `conv.ein`. Alone it has no request: R {∅}."

[[entry]]
path   = "stdlib/math/decimal.ein"
group  = "stdlib"
runs   = ["solve", "saturate", "render rules", "render constraints"]
note   = "the decimal numeral, `(n PREFIX DIGIT)`, with `named`, and the check an operation asks of a numeral it takes, `(check N N)` walked a place a firing to `(valid N)`: four rules flag a malformed numeral, `(not-decimal NUMERAL THING)`, and `(false)` follows (Q-M1f.404). `decimal`, the closing rule, closes every relation and `nz`, labels `z` valid, and names every rule and `arith`. The module alone states no request: its closing rules fire and nothing else."

[[entry]]
path   = "stdlib/math/decimal-arith.ein"
group  = "stdlib"
runs   = ["solve", "saturate", "render rules", "render constraints"]
note   = "school arithmetic over `std.math.digits`' tables, computed by saturation alone. A request fact `(add X Y)` is answered by `(sum-of X Y S)` over nested numbers `(n PREFIX DIGIT)`; `(sub X Y)` by the two numbers of `(diff-of X Y D R)`; `(cmp X Y)` by `(cmp-of X Y lt|eq|gt)`; `(mul X Y)` by `(product-of X Y P)`, the school method from the multiplier's top digit; `(div X Y)` by `(quot-of X Y Q R)`, long division with the quotient's digit by bisection. Division by zero is `std.math.arith`'s flag and `(false)` from it, and the numeral and its check are `std.math.decimal`'s. No rule joins two facts on a number (`ein-infer/tests/arith_theory.rs` on the text, `arith_batch.rs` on the matcher's count), and `decimal-arith`, the closing rule, closes every relation and names every rule. The rules every base shares are `std.math.positional`'s, activated by one call of its macro in the closing rule; decimal keeps its own. The module alone states no request: its closing rule fires and nothing else."

