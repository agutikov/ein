# ── compile-negative: examples/broken/compile/ ──────────────
#
# The `CompileError` fixtures — files that parse and load and are then refused
# by the compiler. No program reaches a compile refusal: the loader refuses
# every shape the compiler would, a macro's expansion held to the grammar's
# shapes, so the group has no entry, and `activator_arity` stays here as a
# `positive`. The fixtures that left keep a `.expected` beside them, held
# byte-for-byte by `ein-infer/tests/compile_semantics.rs`
# (`examples/broken/compile/README.md`).
# `render rules` is deliberately not among the runs: it never reaches the
# compiler, so the cell would record an exit code and discard the output.


