runs   = ["solve", "saturate", "render lattice", "solve --maximal", "oracle --dump {out}/region"]
note   = "a pair the coupling reads over commitments, met through a closure: p with r brings q, and one rule forbids p with q. Every label of the whole node is one class; the tree's reading makes the conflict of the two candidates a pair and no edge, so {p, r}, dead because it derives q, meets no pair, no edge through p and no question with p. The same claim as 15_union_label_dead, broken with no union label (`ein-infer/tests/no_edge.rs`). R is five states, the oracle's."

