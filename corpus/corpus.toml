[[entry]]
path   = "stdlib/math/gcd.ein"
group  = "stdlib"
runs   = ["solve", "saturate", "render rules", "render constraints"]
note   = "the greatest common divisor and the least common multiple of two natural numbers of `std.math.decimal-arith`, which the module calls and does not edit. `(gcd X Y)` answered by `(gcd-of X Y G)`, `(lcm X Y)` by `(lcm-of X Y L)`; the tagged call `(gcd-call TAG X Y)` answered by `(gcd-done TAG G)`. Each number put into normal form by an addition walk, then Euclid's chain, a `div-call` a step; the least common multiple the product divided by the greatest common divisor. gcd(0, 0) = 0 (Q-M1f.299); no request divides by zero. Every rule has one premise; `gcd`, the closing rule, closes every relation, names every rule and names `decimal-arith`, `decimal` and `arith`. `ein-infer/tests/gcd_theory.rs` holds the module to Rust's integers. The module alone states no request: its closing rules fire and nothing else."

