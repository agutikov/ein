# The corpus — M1a S1a.0.1 T1a.0.1.1, re-based at S1a.10.3.
#
# One entry per `.ein` file the engine is exercised over, with the invocations
# it is exercised under. Format, the group vocabulary and the run-name
# convention: corpus/README.md. A file under examples/ or stdlib/ with no entry
# here fails a completeness check, so the corpus cannot silently miss one.
#
# `slow = true` keeps an entry out of the default sweep, and since S1a.9.0 it
# is a claim with a threshold behind it: an entry is slow when its declared
# runs cost **1 s or more together**, which is what `cost_ms` records. Which
# entries are is `ein-corpus`'s `the_slow_set_is_exactly_these_fourteen`'s to
# say, per commit, and this header does not copy its list. A re-take moves the
# flag both ways, which is what a measured flag is for: M1a T1a.7.2.0 made
# `branching/07_lookahead_off.ein` 2.8x cheaper and took it out, and M1e2's
# re-takes moved entries in and out again. The rule, and why the sum rather
# than the slowest run, is corpus/README.md § `slow`; the measurement is
# docs/history/m1a_rust/measurements/corpus_cost.md and
# `utils/bench_env.sh python3 utils/corpus_cost.py` re-takes it.
#
# `heavy_dump = true` (M1f S1f.5.13) keeps an entry out of the per-commit
# round trip, `ein-cli/tests/answer_round_trip.rs`, which reloads every state
# file `ein solve FILE --dump-answer DIR` writes: the entry's dump writes at
# least `ein_corpus::manifest::HEAVY_DUMP_FILES` state files, a count, held both
# ways by that test and run nightly. corpus/README.md § `heavy_dump`.
#
# Generated once from the tree; maintained by hand from here.
#
# schema 2 (S1a.10.3) introduced the `regression` group and split the
# compile-error fixtures out as `compile-negative`. A schema-1 manifest names
# groups that no longer exist, so the version is what refuses it rather than a
# stale entry silently dropping out of every selection.

schema = "ein-corpus/2"


