note   = "three operations chained: 12 cartons of 144 pencils, 250 to the office, the rest among 31 classes; 47 each and 21 left over."

[[entry]]
path   = "examples/word_problems/readings.ein"
group  = "positive"
runs   = ["solve", "saturate", "render rules"]
note   = "a theory module, imported by boxes12 and boxes13: the two readings of *need* as facts, `reads-as` proposed by the hrule `read-need` for every question of how many containers are needed, and a reading always owed by the obligation `reading-owed`. Alone it has no question, so nothing is wanted, proposed or owed: R {∅}."

[[entry]]
