note   = "zebra2 with condition (15) removed — genuinely under-determined at 32 models, so the exhaustive search is large rather than pathological. no solve -e: every model is found by depth 3 and depths 4-5 exist only to prove there are no more (M1d P1d.10), so the run outlives a 5 min ceiling here and was killed at 30 min there; `solve` is 32 ms and stays. no render lattice: the same search at -m 3, which does finish — 27.8 s — and writes 11.6 MB of DOT that is the enumerator rather than a view. These are the exclusions M1d lifts."

[[entry]]
path   = "examples/zebra2.ein"
group  = "positive"
runs   = ["solve", "solve -e", "saturate", "saturate --dump", "render rules", "render constraints", "render lattice", "solve -n 3", "solve -m 2", "solve -p -s", "solve --trace {out}/trace.md", "solve --dump-states {out}/states"]
levers = ["-L", "-K", "-y", "-o score-sum"]
cost_ms = 260
note   = "the flagship, and what a stale flag looks like: `slow = true` on a file that solves in 16 ms and whose sixteen cells cost 260 ms together. Removed at S1a.9.0."


# ── regression: examples/ein-bugs/ ──────────────────────────
#
# Inputs that once broke an implementation, kept as fixtures. The group has
# no uniform expectation and that is the point: seven of the ten answer on
# every run, one answers under `saturate` and is refused under `solve`, and
# two are refused outright. Which is which is the exit golden's to say
# (`ein-cli/tests/golden/corpus_exits.txt`), not this column's.

[[entry]]
path   = "examples/ein-bugs/mixed-type-hypothesis.ein"
group  = "regression"
runs   = ["solve -e"]
note   = "M1a hazard H2 / Q-M1a.4 — an hrule binds one variable to an int and a str, and `apriori.layer_1`'s `sorted(alive)` raises. The message names its operands in a `PYTHONHASHSEED`-dependent order, which is why this group compares the exception class and not the line."

[[entry]]
path   = "examples/ein-bugs/nested-fact-hypothesis.ein"
group  = "regression"
runs   = ["solve -e"]
note   = "M1a hazard H2, second shape — the same `sorted(alive)`, over two `Fact` args instead of a str and an int, so it needs no mixed slot types: one hrule whose `:assert` is a `(not …)` is enough. Found by the S1a.6.6 fuzzer 2026-08-20; D2's reach, widened with a fixture rather than in prose."

[[entry]]
path   = "examples/ein-bugs/query-goal-free-head-unsat.ein"
group  = "regression"
runs   = ["solve", "solve -e", "saturate", "render rules"]
note   = "The `Contradiction` arm of `query-goal-free-head.ein`: the same uncompilable goal, but no solution block is rendered, so ein.py never compiles it and the run exits 0. Pins the asymmetry a too-eager fix broke for the length of one commit."

[[entry]]
path   = "examples/ein-bugs/query-goal-free-head.ein"
group  = "regression"
runs   = ["solve", "saturate"]
note   = "S1a.6.6's shortest find — `(query :goal (?R Rex Animal))`. A query goal has no activator, so a head variable can never be bound and the pattern is uncompilable; ein.py raises out of the table renderer after a successful solve, and ein.rs ran the program until this fixture."

[[entry]]
path   = "examples/ein-bugs/unbound-assert-var.ein"
group  = "regression"
runs   = ["solve", "saturate"]
note   = "Q-M1a.14's own first example, reached for the first time 2026-08-20 by the S1a.6.6 fuzzer — an `(or …)` whose arms bind different variables lets one reach the `:assert` unbound. ein.py raises `KeyError`, whose `str` is the repr of its key; ein.rs printed the message unquoted until this fixture."

[[entry]]
path   = "examples/ein-bugs/unbound-relation-head.ein"
group  = "regression"
runs   = ["solve"]
note   = "Q-M1a.14 — `(?R ?x)` with `?R` unbound is a `CompileError` in both engines with the identical message and exit code; ein.py's CLI lets it escape as a traceback and ein.rs prints the line alone. Found by the S1a.6.6 fuzzer's mutation arm."

[[entry]]
path   = "examples/ein-bugs/int-goal-binding.ein"
group  = "regression"
runs   = ["solve", "solve -e", "saturate", "render rules"]
note   = "S1a.6.6 regression — an integer goal binding is a JSON *number* in `summary.json`, not a string. A T0 difference that five phases of byte parity missed because stdout is identical and no other corpus file binds a query variable to an int. Carries a value wider than i64 on purpose."

[[entry]]
path   = "examples/ein-bugs/fact-goal-binding.ein"
group  = "regression"
runs   = ["solve", "solve -e", "saturate", "render rules"]
note   = "S1a.6.6 regression — a *nested fact* goal binding. ein.py raised inside `json.dumps` and wrote no summary at all; it now renders the fact as an s-expression, which is what ein.rs already did."

# ── compile-negative: examples/broken/compile/ ──────────────
#
# The three `CompileError` fixtures (S1a.3.1) — files that parse and load and
# are then refused by the compiler. Their messages are not left unchecked: each
# has a `.expected` beside it, held byte-for-byte by
# `ein-infer/tests/compile_semantics.rs` (`examples/broken/compile/README.md`).
# `render rules` is deliberately not among the runs: it never reaches the
# compiler, so the cell would record an exit code and discard the output.

[[entry]]
path   = "examples/broken/compile/empty_absent.ein"
group  = "compile-negative"
runs   = ["solve", "saturate"]

[[entry]]
path   = "examples/broken/compile/nested_or.ein"
group  = "compile-negative"
runs   = ["solve", "saturate"]

[[entry]]
path   = "examples/broken/compile/unbound_head.ein"
group  = "compile-negative"
runs   = ["solve", "saturate"]


[[entry]]
path   = "examples/broken/compile/activator_arity.ein"
group  = "positive"
runs   = ["solve", "saturate", "saturate --dump", "render rules"]
note   = "S1a.3.1's fourth compile-error fixture, and the one that is `positive` rather than `compile-negative`: `Engine._activators_for`'s S1.22.0 arity filter drops `(pairwise r)` before the compiler sees it, so the rule never runs and the file solves. That it derives nothing is the assertion — until S1.22.0 the mismatch dropped every premise and the rule fired unconditionally."


