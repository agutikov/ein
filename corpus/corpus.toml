[[entry]]
path   = "examples/ein-bugs/alt-cap-core.ein"
group  = "regression"
runs   = ["solve", "test"]
note   = "M1e S1e.1.3 / Q2 — the `MAX_ALT_JUSTIFICATIONS = 32` cap **changed which unsat core is reported**. `(false)` has 33 one-premise derivations three givens deep and one two-premise derivation over givens; the 33 fill the list first and the two-premise one was refused, so the core was the 3-fact chain and not the 2-fact pair. Fixed by M1e2 S1e2.2.11 (`W10/alt-cap-core`, 2026-11-04): a full list keeps its smallest-closure arrival beside it, and the core is `(w1 X) (w2 X)`, an uncapped store's and the `-reordered` twin's. Under `:record-alternative-justifications false` it is the chain's again, the config principle's one exemption."

[[entry]]
path   = "examples/ein-bugs/alt-cap-core-reordered.ein"
group  = "regression"
runs   = ["solve", "test"]
note   = "M1e S1e.1.3 / Q2 — `alt-cap-core.ein` with `wide` at priority 50 instead of 300 and nothing else changed, and since M1f S1f.5.15 removed `:priority`, with `mk-w3` (which reads `(w1 X)` again as `(w3 X)`, `wide`'s premise) written before `mk-q` instead of after it. Its two-premise derivation becomes the primary, which is never evicted, and the core is 2 facts. The pair is what makes the cap's cost order-dependence rather than only size: `glossary.md`'s *independent of the order in which the rules fired* is true of the search and not of the store in front of it. Since M1e2 S1e2.2.11 (2026-11-04) the store keeps each fact's smallest-closure arrival beside its full list, and both files report the 2-fact core."

