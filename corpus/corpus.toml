note   = "M1e S1e.3.1 — the `Solution` arm's **mixed regime**, measured: one discharged model beside one open state, so `verdict.k` is 1 and `stats.solution_nodes` is 2. `finalise` defined that partition and its own comment said no corpus entry reached it; this one does. It is `CO-M2`'s witness — the table printed the search's node count in that arm until S1e.3.4, so this file would have read `solutions (k) 2` beside `verdict Solution`."

