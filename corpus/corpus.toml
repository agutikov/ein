note   = "the record site: a kill cache written into the fork the run then records would remove a state of R. A node is `sat(root ∪ C)` with nothing the search wrote, so the cache's negatives are no state's: R has 5 states, maximal `{(q A)}` and `{(p A), (p B)}`, which the `:expect` states (complete-records-stale-K)."

[[entry]]
path   = "examples/ein-bugs/alt-cap-core.ein"
group  = "regression"
runs   = ["solve", "test"]
note   = "the `MAX_ALT_JUSTIFICATIONS = 32` cap and which unsat core is reported: `(false)` has 33 one-premise derivations three givens deep and one two-premise derivation over givens; the 33 fill the list first, and a list that refused the two-premise one would report the 3-fact chain and not the 2-fact pair. A full list keeps its smallest-closure arrival beside it, and the core is `(w1 X) (w2 X)`, an uncapped store's and the `-reordered` twin's. Under `:record-alternative-justifications false` it is the chain's again, the config principle's one exemption."

[[entry]]
path   = "examples/ein-bugs/alt-cap-core-reordered.ein"
group  = "regression"
runs   = ["solve", "test"]
note   = "`alt-cap-core.ein` with `mk-w3` (which reads `(w1 X)` again as `(w3 X)`, `wide`'s premise) written before `mk-q` instead of after it, and nothing else changed. Its two-premise derivation becomes the primary, which is never evicted, and the core is 2 facts. The pair is what makes the cap's cost order-dependence rather than only size: `13-glossary.md`'s *independent of the order in which the rules fired* is true of the search and not of the store in front of it. The store keeps each fact's smallest-closure arrival beside its full list, and both files report the 2-fact core."

[[entry]]
path   = "examples/ein-bugs/unsat-core-id-space.ein"
group  = "regression"
runs   = ["solve", "saturate", "oracle --dump {out}/region"]
note   = "`unsat-core-id-space`, from `corpus/fuzz_findings/`: guards against a core printed one way as interned and another under a permuted interner. R is three states, ∅ and two singletons, and N's four members have one core each, the same under every permutation of the id space; `id_order_invariance` permutes it per commit."

[[entry]]
path   = "examples/ein-bugs/d3-unsat-core.ein"
group  = "regression"
runs   = ["solve", "saturate"]
note   = "`d3-unsat-core-id-order` and `d3-unsat-core/d3-unsat-core`, from `corpus/fuzz_findings/`: guards against an unsat core that moves with the fork path and with the interner. **Refused** (*forbid*, counting a refutation *via* what a rule derives): `fire-0` concludes (not …) from r1, which `fire-1` derives under an `absent` a commitment can lift, so `solve` exits 1 naming them while `saturate` saturates; the refusal is the same under every permutation `id_order_invariance` takes."

[[entry]]
path   = "examples/ein-bugs/fork-delta-order.ein"
group  = "regression"
runs   = ["solve", "saturate", "solve --dump-lattice {out}/lattice", "oracle --dump {out}/region"]
note   = "`fork-delta-order`, from `corpus/fuzz_findings/`: `(false)` has 1 600 equal-size derivations in N's one member, so its core is whichever four facts the 33 arrivals a full list keeps offer, and a resumed fork's delta sorted by `FactId` would make those arrive in interning order. The delta is in the order the commitment is written, and the core is (g G08) (h H40) (on A) (on B) under every seed, in nogoods.json, nodes.json and the oracle's region.json. Which of the equal-size cores is the canonical one is open."

