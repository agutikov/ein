group  = "positive"
runs   = ["solve", "saturate", "render lattice", "solve --maximal", "oracle --dump {out}/region"]
note   = "an extension that closes no coupling edge, and dies: `(flag X)` comes from `(a-prop X)` alone or `(b-prop X)` alone, and the whole node reads its label as the union of both questions, so the death of {a, c, d} is read as needing b too. {c, d} is an alive state, {a, c, d} is dead, and no edge through a is met, in the reading the tree takes, the structure's, and each one application back. The program that breaks the claim that a state closing no edge through its last candidate cannot die (`ein-infer/tests/no_edge.rs`). R is thirteen states, the oracle's."

[[entry]]
path   = "examples/lattice/16_pair_through_closure.ein"
