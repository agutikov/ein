[[entry]]
path   = "examples/zebra2-minus-15.ein"
group  = "positive"
runs   = ["solve", "saturate", "saturate --dump", "render rules", "render constraints"]
note   = "zebra2 with condition (15) removed — genuinely under-determined at 32 models, and M1d P1d.10 measured what proving that costs. All 32 are found by depth 3 (48 745 enterings, 25 s); the lattice does not end until **layer 22 and 17 204 592 enterings** — 24 min 56 s at -j16, `exhausted = true`, and not one further model. no solve -e: the -m 5 cut alone is 618 076 enterings, 416 s at --jobs 1 and 50 s at -j16, against a `slow` threshold of 1 s — so the exclusion is kept for a measured reason rather than for the 30-minute kill this note used to cite, which was a 2026-08-20 session and not this engine (M1d T1d.10.5.4). `solve` is 32 ms and stays. no render lattice: the same search at -m 3, which does finish — 27.8 s — and writes 11.6 MB of DOT that is the enumerator rather than a view. **M1d did not lift these; it priced them.** What would lift them is a cheaper argument for the same claim, and P1d.10 has one measured out of process at 171 nodes — S1d.10.6's to ship, not a run list's to assume."

[[entry]]
path   = "examples/zebra2-minus-15-obligations.ein"
group  = "positive"
runs   = ["solve", "saturate", "saturate --dump", "render rules", "render constraints"]
note   = "M1d S1d.2.5 — the under-determined regime with no hypothesis rule: `zebra2-minus-15.ein` with the `(hrule guess …)` and the `:hrules` clause deleted, generated by the same script that makes the other three variants so that \"nothing else changed\" is checked rather than claimed. Its twin's run list, verbatim, and for the same reasons, now priced there (M1d T1d.10.5.4) — no `solve -e` (618 076 enterings at -m 5 and 17 204 592 before the lattice ends at layer 22, for the same 32 models depth 3 already had), no `render lattice`. What it banks is that the obligations rung finds **the same 32 models in the same 48 745 enterings** as the hrule path at `-m 3`, which is the milestone's completeness claim on the one corpus entry where the model set is large enough to be worth comparing."

[[entry]]
path   = "examples/zebra2-obligations.ein"
group  = "positive"
runs   = ["solve", "solve -e", "saturate", "saturate --dump", "render rules", "render constraints", "render lattice", "solve -n 3", "solve -m 2", "solve -p -s", "solve --trace {out}/trace.md", "solve --dump-states {out}/states"]
levers = ["-L", "-K", "-y", "-o score-sum"]
note   = "M1d S1d.2.5 — the fixture the obligations rung needed, because every searching entry before it carried `:hrules`. `zebra2.ein` with the hypothesis rule and its activator clause deleted and nothing else: the five `(bijective *-loc)` declarations fan out into `total-owed` / `surjective-owed`, and the rung branches on what they owe. Layer 1 is **56 candidates against the blind enumerator's 3 734**, and the whole search is the hrule path's, entering for entering — 101 enterings, 2 layers, one model, the same one. Its run list is `zebra2.ein`'s so the two are comparable cell by cell."

[[entry]]
