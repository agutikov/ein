[[entry]]
path   = "stdlib/num9.ein"
group  = "stdlib"
runs   = ["solve", "saturate", "render rules", "render constraints"]
note   = "M1f S1f.6.13 (2026-11-11): school arithmetic on numbers of nine digits, `(num9 d8 … d0)`, the calculator's second module, generated by `utils/gen_num9.py` (`--check` in the gate through `ein-infer/tests/num9_theory.rs`, which holds the theory to Rust's integers, exhaustively at width 2). Wide rules, a premise a column: `(add9 X Y)` answered by `(sum9-of X Y S)` in one firing, `sub9`, `cmp9`, `mul9` and `div9` likewise named; `(overflow REQUEST)` where a sum or a product does not fit, and no number; a division by zero is `std.arith`'s flag and `(false)`; `(to9 X)` and `(from9 W)` convert to and from `std.arith`'s numbers. No rule joins two facts on a number, and `arith9`, the closing rule, closes every relation and names every rule. The module alone states no request: its closing rule fires and nothing else."

[[entry]]
path   = "stdlib/rat.ein"
group  = "stdlib"
runs   = ["solve", "saturate", "render rules", "render constraints"]
note   = "M1f S1f.6.8 (2026-11-12): rational numbers, `(rat Z D)`, an integer of `std.int` over a natural number of `std.arith` that is not zero, in lowest terms; the module calls the two theories below it and edits neither. Requests `rat-simplify`, `rat-neg`, `rat-add`, `rat-sub`, `rat-mul`, `rat-div` and `rat-cmp`, answered by `rat-simple-of`, `rat-neg-of`, `rat-sum-of`, `rat-diff-of`, `rat-product-of`, `rat-quot-of` and `rat-cmp-of`. Lowest terms is Euclid's chain, each step a division of `std.arith`. A zero denominator, and a division by a rational that is zero, derive `std.arith`'s flag, `(division-by-zero REQUEST)`, and its rule derives `(false)`. Every rule has one premise; `rat-arith`, the closing rule, closes every relation, names every rule and names `int-arith` and `arith`. `ein-infer/tests/rat_theory.rs` holds the module to exact fractions. The module alone states no request: its closing rules fire and nothing else."

