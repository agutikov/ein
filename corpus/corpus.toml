group  = "positive"
runs   = ["solve", "test", "saturate", "saturate --dump", "render rules", "render constraints", "render lattice"]
note   = "the `:expect` form: `solve` checks a claim the *file* makes rather than one a golden makes, and exits 1 if the model is not the one it names. Relation-closure is what it demonstrates — `next-to`'s listed extent is complete, so a surplus mirrored edge fails it, which is the case a per-fact assertion cannot catch. `test` is the same claim through the subcommand that reports it as a status code rather than as a line under the read-out."

