# ── regression: examples/ein-bugs/ ──────────────────────────
#
# Inputs that once broke an implementation, kept as fixtures. The group has
# no uniform expectation and that is the point: seven of the ten answer on
# every run, one answers under `saturate` and is refused under `solve`, and
# two are refused outright. Which is which is the exit golden's to say
# (`ein-cli/tests/golden/corpus_exits.txt`), not this column's.

[[entry]]
path   = "examples/ein-bugs/alive-empty-phase1.ein"
group  = "regression"
runs   = ["solve", "solve -e"]
note   = "M1e D1 — the alive-∅ record site at phase 1. `compute_alive` writes the kill cache into root *after* `:1091`'s consistency check, and `:1118` records what it wrote: the model re-saturates to `Contradiction`. **Its `:expect` states today's answer and is meant to break** when the record sites re-saturate before recording (Q-M1e.7's ruling), the route `tests/stdlib/closure/02|03` took. Goal moved to `is-a` because a model with an empty goal extent is unstatable — Q-M1e.13."

[[entry]]
path   = "examples/ein-bugs/alive-empty-interlayer.ein"
group  = "regression"
runs   = ["solve", "solve -e"]
note   = "M1e D1, the same defect between layers — and the one `-K` does not repair, because its trigger is the singleton writeback rather than the kill cache. `-L` answers `Contradiction k=0` on the same file with both sides exhausted. `:expect` states today's answer and is meant to break."

[[entry]]
path   = "examples/ein-bugs/naf-upward-closure.ein"
group  = "regression"
runs   = ["solve", "solve -e", "saturate"]
note   = "M1e Q-M1e.9 / S1e.2.3 — `dead` is **not** upward-closed under `absent`: `{(p A)}` dies while `{(p A), (q A)}` is alive, so the maximal state is never generated. Five of six shipped configurations answer it wrongly and all six report `exhausted = true`. It carries `(config :warn-derived-naf true)`, so the S1e.2.3 diagnostic is part of its recorded output — the containment as a fixture rather than a claim. `:expect` states today's answer (`(q A)` plus the cached `(not (p A))`) and is **meant to break** when F18 makes the three consumers world-aware or S1f.10.8 forbids the shape. Goal on `is-a` because the model has no `p` fact — Q-M1e.13."

[[entry]]
path   = "examples/ein-bugs/alive-set-fresh-name.ein"
group  = "regression"
runs   = ["solve", "solve -e", "test"]
note   = "M1e S1e.3.3 / `ST-M1` — the **M1 alive-set invariant** broken on purpose, and the first program on which breaking it costs an answer. `spawn` asserts `(p ?b Z)` and no fact names `Z`, so the name enters only inside a fork while the lattice enumerates subsets of the `alive` set taken at root. Every subset dies and the engine says `k = 0, exhausted = true` — a refutation, not a lower bound — where `{(q A Z)}` is a model. Its twin `alive-set-fresh-name-declared.ein` is this file plus the one fact `(seen Z)` and answers `Solution k = 1` over exactly that model. `:expect (false)` states today's answer and is meant to break."

[[entry]]
path   = "examples/ein-bugs/alive-set-fresh-name-declared.ein"
group  = "regression"
runs   = ["solve", "solve -e", "test"]
note   = "M1e S1e.3.3 — the control for the entry above: the same rules and constraints plus `(seen Z)`, one fact over a relation nothing else mentions, which does nothing but put `Z` in the name universe before `alive₀` is computed. `Solution k = 1` in seven enterings. The pair is what makes `ST-M1` a measurement: the twin's refutation is not a property of its constraints. Its plain `solve` cell exits **1** on purpose — a `(model …)` claim is a claim about the *exhausted* answer and `-n 1` stops at the first, so the run reports `NOT CHECKED`, the same cell `examples/features/11_expect_ambiguity.ein` carries since S1d.4.3 gave it a stderr diagnostic. The twin exits 0 there because a `(false)` claim needs no `-e`: a search that found no model at all did exhaust."

[[entry]]
path   = "examples/ein-bugs/complete-records-stale.ein"
group  = "regression"
runs   = ["solve", "solve -e"]
note   = "M1e D3 — the record site every corpus solve uses: `complete()` runs the generation pipeline and its kill cache writes into the very fork `:1977` then records. Model 1 re-saturates to `Contradiction`; `-K` prints the same `k = 2` with both models correct. Carries **no** `:expect`: its two models populate different relations, and every arm of an `(or …)` must name the goal's — Q-M1e.13."

[[entry]]
path   = "examples/ein-bugs/alt-cap-core.ein"
group  = "regression"
runs   = ["solve", "solve -e", "test"]
note   = "M1e S1e.1.3 / Q2 — the `MAX_ALT_JUSTIFICATIONS = 32` cap **changes which unsat core is reported**. `(false)` has 33 one-premise derivations three givens deep and one two-premise derivation over givens; the 33 fill the list first and the two-premise one is refused, so the core is the 3-fact chain and not the 2-fact pair. At a cap of 10^6 the same file reports the 2-fact core. Read with its `-reordered` twin, which differs in one `:priority`."

[[entry]]
path   = "examples/ein-bugs/alt-cap-core-reordered.ein"
group  = "regression"
runs   = ["solve", "solve -e", "test"]
note   = "M1e S1e.1.3 / Q2 — `alt-cap-core.ein` with `wide` at priority 50 instead of 300 and nothing else changed. Its two-premise derivation becomes the primary, which is never evicted, and the core is 2 facts. The pair is what makes the cap's cost order-dependence rather than only size: `glossary.md`'s *independent of the order in which the rules fired* is true of the search and not of the store in front of it."

[[entry]]
path   = "examples/ein-bugs/mixed-type-hypothesis.ein"
group  = "regression"
runs   = ["solve -e"]
note   = "M1a hazard H2 / Q-M1a.4 — an hrule binds one variable to an int and a str, and `apriori.layer_1`'s `sorted(alive)` raises. The message names its operands in a `PYTHONHASHSEED`-dependent order, which is why this group compares the exception class and not the line."

[[entry]]
path   = "examples/ein-bugs/nested-fact-hypothesis.ein"
group  = "regression"
runs   = ["solve -e"]
note   = "M1a hazard H2, second shape — the same `sorted(alive)`, over two `Fact` args instead of a str and an int, so it needs no mixed slot types: one hrule whose `:assert` is a `(not …)` is enough. Found by the S1a.6.6 fuzzer 2026-08-20; D2's reach, widened with a fixture rather than in prose."

[[entry]]
path   = "examples/ein-bugs/query-goal-free-head-unsat.ein"
group  = "regression"
runs   = ["solve", "solve -e", "saturate", "render rules"]
note   = "The `Contradiction` arm of `query-goal-free-head.ein`: the same uncompilable goal, but no solution block is rendered, so ein.py never compiles it and the run exits 0. Pins the asymmetry a too-eager fix broke for the length of one commit."

[[entry]]
path   = "examples/ein-bugs/query-goal-free-head.ein"
group  = "regression"
runs   = ["solve", "saturate"]
note   = "S1a.6.6's shortest find — `(query :goal (?R Rex Animal))`. A query goal has no activator, so a head variable can never be bound and the pattern is uncompilable; ein.py raises out of the table renderer after a successful solve, and ein.rs ran the program until this fixture."

[[entry]]
path   = "examples/ein-bugs/unbound-assert-var.ein"
group  = "regression"
runs   = ["solve", "saturate"]
note   = "Q-M1a.14's own first example, reached for the first time 2026-08-20 by the S1a.6.6 fuzzer — an `(or …)` whose arms bind different variables lets one reach the `:assert` unbound. ein.py raises `KeyError`, whose `str` is the repr of its key; ein.rs printed the message unquoted until this fixture."

[[entry]]
path   = "examples/ein-bugs/unbound-relation-head.ein"
group  = "regression"
runs   = ["solve"]
note   = "Q-M1a.14 — `(?R ?x)` with `?R` unbound is a `CompileError` in both engines with the identical message and exit code; ein.py's CLI lets it escape as a traceback and ein.rs prints the line alone. Found by the S1a.6.6 fuzzer's mutation arm."

[[entry]]
path   = "examples/ein-bugs/int-goal-binding.ein"
group  = "regression"
runs   = ["solve", "solve -e", "saturate", "render rules"]
note   = "S1a.6.6 regression — an integer goal binding is a JSON *number* in `summary.json`, not a string. A T0 difference that five phases of byte parity missed because stdout is identical and no other corpus file binds a query variable to an int. Carries a value wider than i64 on purpose."

[[entry]]
path   = "examples/ein-bugs/fact-goal-binding.ein"
group  = "regression"
runs   = ["solve", "solve -e", "saturate", "render rules"]
note   = "S1a.6.6 regression — a *nested fact* goal binding. ein.py raised inside `json.dumps` and wrote no summary at all; it now renders the fact as an s-expression, which is what ein.rs already did."

