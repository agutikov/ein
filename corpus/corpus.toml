[[entry]]
path   = "examples/features/10_expect.ein"
group  = "positive"
runs   = ["solve", "test", "saturate", "saturate --dump", "render rules", "render constraints", "render lattice"]
note   = "M1c S1c.1.2 — the `:expect` form. The only entry in the corpus whose `solve` runs check a claim the *file* makes rather than one a golden makes: exit 1 if the model is not the one it names. Relation-closure is what it demonstrates — `next-to`'s listed extent is complete, so a surplus mirrored edge fails it, which is the case a per-fact assertion cannot catch. `test` since S1c.1.3: the same claim through the subcommand that reports it as a status code rather than as a line under a solution table."

[[entry]]
path   = "examples/features/11_expect_ambiguity.ein"
group  = "positive"
runs   = ["solve", "test", "saturate", "saturate --dump", "render rules", "render constraints", "render lattice"]
note   = "M1c S1c.1.2 — `:expect (or …)`, the k>1 verdict. **Plain `solve` is here to fail**, and it is the corpus's only witness for `Outcome::NotChecked` (M1d S1d.4.3): it stops at the first model and reports k=1, which is correct and is not this fixture's question — an `(or …)` expectation is a claim about the *exhausted* search — so the run exits **1** with `NOT CHECKED`, and `corpus_exits.txt` banks that. It could not be declared until S1d.4.3 gave a failing `:expect` a one-line stderr diagnosis, because `every_refusal_carries_a_diagnostic` forbids an exit 1 with an empty stderr. The failure says so rather than leaving a bare count mismatch. Swapping the two `(model …)` blocks leaves it passing: the disjuncts compare as a set. `test` needs no `-e` for the same claim (S1c.1.3): exhausting is what that subcommand does, which is the difference between being asked for an answer and being asked whether a claim holds."

[[entry]]
path   = "examples/features/12_expect_false.ein"
group  = "positive"
runs   = ["solve", "test", "saturate", "saturate --dump", "render rules", "render constraints", "render lattice"]
note   = "M1c S1c.1.2 — `:expect (false)`, the k=0 verdict, spelled with the kernel's own ⊥ rather than an invented word. Three pigeons, two holes, and the chain forced rather than searched, for two reasons its header carries: the blind version is Ambiguity k=6 rather than a contradiction, because a state leaving one pigeon nowhere is *complete* in an open world (M1d's subject), and it also has several equally small unsat cores, which is corpus/fuzz_findings/unsat-core-id-space.md reached from the corpus for the first time. Since M1e2 S1e2.2.5 it closes `instance` too, `:no-hypothesis (in instance)`: `no-room`'s forall is an absent over `instance`, which *forbid* refuses while a commitment can extend it. H is empty, and the answer is root's, as it was."

