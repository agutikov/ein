[[entry]]
path   = "examples/beliefs/11_nothing_acts_in_a_context.ein"
group  = "positive"
runs   = ["solve", "test", "saturate", "render kb"]
note   = "What a fact does, it does where it is held: under an arrow of `think`, a declaration `(relation near Place)` declares nothing (`near` is used with two arguments), an activator `(chain near)` applies no rule (`(near a c)` is not concluded, where `(chain above)`, held, gives `(above a c)`), `(false)` refutes nothing, and `(not (near a b))` contradicts nothing beside the held `(near a b)`. `(solve :no-search)`. Three claims, computed by hand."

