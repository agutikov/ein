note   = "The twin of regression `rung-unactivated`: `rung-unactivated.ein` with the obligation stated, `(total-owed at is-a)`, and paid at root. An obligation activated at root takes the ladder's second rung, and a discharged root under it proposes nothing and is complete: no candidate, R {∅}."

