[[entry]]
path   = "examples/word_problems/words.ein"
group  = "positive"
runs   = ["solve", "saturate", "render rules"]
note   = "the theory module every problem here imports: what *has*, *gave*, *together*, *more*, *holds*, *of*, *shared* and *need* mean, as plan rules backwards from the question and request rules to `std.math.decimal-arith`. Alone it has no question, so nothing is wanted or computed: R {∅}."
