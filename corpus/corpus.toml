# ── stdlib conformance (M1c S1c.1.4) ────────────────────────
#
# `tests/stdlib/` — one program per stdlib rule or tight family, each stating
# what it should derive and what it must not. They are *tests* rather than
# examples, which is why they are not under `examples/`, and they are in the
# `stdlib` group with the modules they exercise, because the group names a
# subject here rather than a failure point.
#
# The run set is the `stdlib` group's plus **`test`**, which is the one that
# can fail on the file's own account: it runs the `:expect` the file's query
# carries and exits 1 when the claim is false. `saturate` is what the firing
# census reads (`utils/stdlib_census.py` sweeps `solve` / `saturate` / `test`
# runs under `--events`), and `solve` is the same claim checked from the
# subcommand that renders a solution table.
#
# Every one of them is microseconds; the whole directory under `ein test` is
# 0.02 s.

