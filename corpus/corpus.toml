[[entry]]
path   = "stdlib/int.ein"
group  = "stdlib"
runs   = ["solve", "saturate", "render rules", "render constraints"]
note   = "M1f S1f.6.7 (2026-11-11): integers as a positive and a negative part, `(int P N)`, over the natural numbers of `std.arith`, which the module calls and does not edit. Requests `int-simplify`, `int-neg`, `int-add`, `int-sub`, `int-mul` and `int-cmp`, answered by `int-simple-of`, `int-neg-of`, `int-sum-of`, `int-diff-of`, `int-product-of` and `int-cmp-of`, every answer in normal form, one part `z`. Every rule has one premise, and a call's tag is its request; `int-arith`, the closing rule, closes every relation, names every rule and names `arith`. Integer division names its convention since S1f.6.22 (2026-11-12): `int-div-euclid`, `int-div-trunc` and `int-div-floor`, answered by `int-quot-euclid-of` (the remainder a natural number), `int-quot-trunc-of` and `int-quot-floor-of`; a divisor that is zero derives `std.arith`'s flag. `ein-infer/tests/int_theory.rs` holds the module to Rust's signed integers. The module alone states no request: its closing rules fire and nothing else."

