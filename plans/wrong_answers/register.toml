# The wrong-answer register: every known wrong answer still open.
#
# One row per witness. The rules for filing, fixing and reading a row are
# README.md beside this file; `python3 utils/wrong_answers.py` is the gate's
# step that holds every row (the process fields below, then each row's
# `[case.now]` run through the binary and its `[case.region]` through the
# library, by the project's runner).
#
# The format is the project's `corpus/regressions.toml`'s
# (`ein_corpus::regressions`; its header is the field reference for `id`,
# `title`, `settings`, `witness`, `[case.now]`, `[case.right]` and
# `[case.region]`), with the difference that makes a row a wrong answer:
# its `[case.now]`, what the engine answers today, does **not** answer its
# `[case.right]`, and the runner's `--open` holds that, row for row, with no
# run. Beside those fields a row carries the register's own, which the runner
# does not read and `utils/wrong_answers.py` checks:
#
#   id        `<case>/<witness>`, the register's id, stable while the row is
#             open — the review bundle's directory name
#   case      the case's id, `W<n>`;  title / class: the case's, per row
#   owner     the followup that fixes the row, `F<n>` (a file under
#             `plans/followups/`), or the stage of a plan that does
#   question  the decision ids and findings the case was filed from
#   status    `open`
#   open_because  why the row's `now` is still not `right`: what R shares
#             with the case, or the reading the case waits on
#   look_at   where the case goes wrong, as pages of a review-bundle run:
#             `root`, `root-writes`, `timeline`, `layer N`, `entering <facts>`,
#             `refuted`, `trace [step N]`, `answer`, `model N`, `summary`,
#             `events <kind>`
#   note      the row's history and what was found on it
#   [case.right] `reading` names the ruling a contested answer assumes, and
#             `[[case.right.alternative]]` the answer under each other reading;
#             `derived` says from what the answer was derived
#   [case.wrong] / [case.control] / [[case.twin]]  the answers recorded when
#             the row was filed, a record no step runs: `run`, `by` (walk |
#             region | command), `witness` (a control's or twin's own file),
#             `why` (what differs from the wrong run), and the answer's fields
#             as `[case.now]` spells them, or the walk's (`verdict`, `k`,
#             `exhausted`, `closes`, `models`, `open`, `owes`, `core`)
#   [case.review] the review's verdict: `verdict` (confirmed |
#             right-answer-corrected | split | merge | deferred), `date`,
#             `bundle` (the commit the pages read were built at), `note`; a
#             `deferred` row waits on its owner, a followup
#
# A witness lives under `plans/wrong_answers/witnesses/` while its row is open,
# or is a project program (an example another test or page reads too); its
# fix moves the row to `corpus/regressions.toml` and the witness to
# `examples/ein-bugs/wrong-answers/` with a corpus entry, in one commit.

schema = "ein-regressions/1"

