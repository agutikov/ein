look_at  = ["root", "trace", "summary"]
note     = "Filed at the close of M1f's documentation phase, P1f.20 (2026-11-17), from its finding L-61 (the kb-evolution lane, writing the saturation page; reproduced on the gate binary), which proposed the row and left it the user's call; filed under the standing rule that a wrong answer is a row, by the reading W8/fifo-gap takes. It is W8/fifo-gap (examples/lattice/10_fifo_gap.ein, a and b candidates, flagged) and examples/lattice/11_fifo_gap_static.ein (a given, b a candidate, monotone, no answer wrong since every node is a fork of root) moved one step down: with a and b both given the stale fact is root's, and every answer is built on root. The title is the case's; what falsifies the guard here is root's own later derivation, not a commitment. p and q are outside the universe (the program states :no-search, so nothing is a candidate), so the run's one state lists nothing and what root holds is read off the query's rows. No read-out row, summary field or warning names the stale fact: `monotonicity.order` and `monotonicity.state` are empty on a program the check calls monotone. The answer is not a function of the program: the first twin differs in the written order of two rules, the second in a conclusion nothing reads, and both answer the perfect model. Not reviewed: no review bundle was built for it"

